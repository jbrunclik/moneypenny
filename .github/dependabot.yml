version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Node.js dependencies (web/)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript-eslint peer range caps TypeScript at <6.1.0
      # (typescript-eslint@8.63.0); unblock once it supports TS 7
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @playwright/test 1.62.x ships a webkit build that never completes page
      # load, hanging every webkit E2E test (chromium is fine). Pinned to 1.61.1.
      # 1.63.0 still hangs (Sep 30 2026: all 4 webkit shards hit the 30 min job
      # timeout). Listed per minor so each new release still gets a try.
      - dependency-name: "@playwright/test"
        versions: ["1.62.x", "1.63.x"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"