name: Update Visual Baselines (Linux)

# Manually-triggered: regenerates the *-linux.png visual baselines in the
# exact environment the CI visual job uses (Playwright Docker container on
# an ubuntu runner) and uploads them as an artifact. Branch protection
# forbids direct bot pushes to main, so the invoker downloads the artifact
# and commits it:
#   gh workflow run "Update Visual Baselines (Linux)"
#   gh run watch <run-id> --exit-status
#   gh run download <run-id> -n linux-baselines -D web/tests/visual/
#   git add web/tests/visual && git commit && git push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-baselines:
    name: Regenerate Linux Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # lfs: true - existing baselines are LFS objects; without it
      # --update-snapshots chokes on pointer files ("Could not decode
      # expected image as PNG")
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          allow-prereleases: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Start e2e mock server
        run: |
          python tests/e2e-server.py &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8001/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8001/

      - name: Regenerate baselines in Playwright container
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./web/package.json').devDependencies['@playwright/test']")
          docker run --rm --network host \
            -v "$PWD":/work -w /work/web \
            -e PW_BASE_URL=http://127.0.0.1:8001 \
            -e CI=1 \
            --ipc=host \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy" \
            npx playwright test tests/visual --project=chromium --update-snapshots

      - name: Collect linux baselines
        if: always()
        run: |
          mkdir -p /tmp/linux-baselines
          cd web/tests/visual
          for dir in *.visual.ts-snapshots; do
            mkdir -p "/tmp/linux-baselines/$dir"
            find "$dir" -name '*-linux.png' -exec cp {} "/tmp/linux-baselines/$dir/" \;
          done

      - name: Upload linux baselines
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-baselines
          path: /tmp/linux-baselines/
          retention-days: 7
