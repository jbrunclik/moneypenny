name: Dependabot auto-merge

# Merge Dependabot PRs only AFTER the full Tests workflow (lint + backend +
# frontend unit + E2E) AND the Dependency Audit (when the PR changed a lock
# file) have completed SUCCESSFULLY for that PR, and only for patch and minor
# updates - majors wait for a person (P3).
#
# This triggers on `workflow_run` (Tests finishing), NOT on `pull_request`.
# The previous pull_request-triggered version ran `gh pr merge --auto --squash
# || gh pr merge --squash`, which — because `main` has no required status checks
# — merged within seconds, before E2E finished. That let a broken
# @playwright/test bump (webkit build could not load the app) land on main while
# its E2E run was still failing. Gating on workflow_run conclusion == success
# makes the merge actually wait for E2E.
on:
  workflow_run:
    # Either finishing re-checks both, so the later of the two merges
    workflows: ["Tests", "Dependency Audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only for a Dependabot PR whose triggering run passed. `event ==
    # 'pull_request'` excludes the push-to-main runs; the branch prefix scopes
    # to Dependabot.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      # Only the classifier script (the merge itself needs no checkout)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Squash-merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # The commit the passing run checked (a 40-char SHA from the event)
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" \
                 --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR for branch '$HEAD_BRANCH'; nothing to merge."
            exit 0
          fi
          # Both gates for this exact commit: Tests must have passed; the audit
          # must have passed if it ran (it runs only when a lock file changed).
          # Either still running means wait - its completion re-runs this job.
          runs() {
            gh run list --repo "$REPO" --commit "$HEAD_SHA" --event pull_request \
              --workflow "$1" --json status,conclusion,createdAt
          }
          if ! RUNS="$(runs test.yml)" python3 .github/scripts/run_gate.py Tests; then
            echo "Tests have not passed for $HEAD_SHA; not merging."
            exit 0
          fi
          if ! RUNS="$(runs audit.yml)" python3 .github/scripts/run_gate.py --optional "Dependency Audit"; then
            echo "Dependency Audit has not passed for $HEAD_SHA; not merging."
            exit 0
          fi
          # P3: a major update can break behavior the tests don't cover - a
          # person reviews it. Patch and minor updates merge on green.
          text=$(gh pr view "$pr" --repo "$REPO" --json title,body --jq '.title + "\n" + .body')
          if PR_TEXT="$text" python3 .github/scripts/major_update.py; then
            echo "PR #$pr includes a major update; leaving it open for review."
            exit 0
          fi
          echo "Tests passed for PR #$pr ($HEAD_BRANCH); squash-merging."
          # --repo is REQUIRED: this job deliberately does no actions/checkout,
          # so without it gh falls back to inferring the repo from the local
          # git remote and dies with "fatal: not a git repository". The
          # gh pr list above always had --repo; the merge did not, so every
          # auto-merge since this workflow was rewritten (Aug 1 2026) failed
          # after reporting "squash-merging", leaving PRs open indefinitely.
          #
          # --match-head-commit: merge only the commit this Tests run tested -
          # a push to the PR after the run must not be merged untested.
          if out=$(gh pr merge --squash --repo "$REPO" --match-head-commit "$HEAD_SHA" "$pr" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          # Several Dependabot PRs finishing Tests together merge at once and
          # the losers get "Base branch was modified" (Oct 2026: #278 stayed
          # open, since nothing re-ran this job). Do NOT retry the merge: main
          # changed, so the PR + new main combination is untested. Ask
          # Dependabot to rebase instead - Tests re-run on the new base and
          # this job fires again when they pass. (If Dependabot ignores
          # commands from github-actions[bot], the PR just stays open - the
          # same fail-closed result as before.)
          if grep -q "Base branch was modified" <<<"$out"; then
            echo "Lost a merge race; requesting a rebase so Tests re-run on the new main."
            gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
            exit 0
          fi
          # Dependabot pushed to the PR (usually a rebase after another merge)
          # since this Tests run: --match-head-commit rightly refuses the
          # untested head. Tests run on the new head and fire this job again,
          # so this is a skip, not a failure (it was 9 of 11 red runs, Oct 2026)
          if grep -q "Head branch was modified" <<<"$out"; then
            echo "PR head moved since this Tests run; the run on the new head will merge it."
            exit 0
          fi
          exit 1
