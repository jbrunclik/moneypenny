name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          allow-prereleases: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Run linters
        run: make lint

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: make test-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 7

  frontend-unit-tests:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run tests with coverage
        run: cd web && npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  frontend-e2e-tests:
    name: Frontend E2E Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]
    # One runner per browser: both projects on a single 2-vCPU runner meant 8
    # concurrent browser contexts against one mock server, and the suite only
    # passed through retries - webkit tests timing out waiting for mock
    # responses that never became slow in isolation. Halving the contexts per
    # runner (4 workers x 1 project) removes that starvation and halves the
    # wall time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/1
            workers: 4
          # WebKit is the CPU hog: with 4 webkit contexts on one runner the mock
          # server's /test/reset took up to 12s (starved Python, not a lock -
          # a reset is ~6ms in isolation) and streams stalled on "Thinking";
          # 3 contexts still produced 9s stalls. Two contexts per runner, four
          # shards - runner minutes are free for a public repo, retries aren't.
          - project: webkit
            shard: 1/4
            workers: 2
          - project: webkit
            shard: 2/4
            workers: 2
          - project: webkit
            shard: 3/4
            workers: 2
          - project: webkit
            shard: 4/4
            workers: 2
    # Fail fast instead of burning ~6h of runner time if the browser/app hangs
    # (e.g. a Playwright bump whose webkit build never completes page load).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          allow-prereleases: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps ${{ matrix.project }}

      - name: Build frontend
        run: cd web && npm run build

      # The mock server runs outside Playwright so the browsers can be niced
      # below it: on a 2-vCPU runner the browser processes otherwise starve
      # the Python server (the SLOW log showed even GET / taking 3.8s).
      - name: Start e2e mock server
        run: |
          python tests/e2e-server.py > e2e-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8001/api/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8001/api/version

      - name: Run E2E tests
        env:
          PW_BASE_URL: http://localhost:8001
        run: cd web && nice -n 10 npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}

      # Any request the mock server took >1s to answer - a starvation
      # suspect. Empty is the goal.
      - name: Mock server slow-request log
        if: always()
        run: grep -E 'SLOW ' e2e-server.log || echo "no slow requests"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/test-results/
          retention-days: 7

  # Visual regression tests run inside the Playwright Docker container so
  # font rendering matches the committed *-linux.png baselines exactly.
  # The mock server runs on the runner host (python 3.14); the container
  # reaches it via host networking. Baselines are (re)generated locally
  # with: make test-fe-visual-linux-update (requires Docker).
  frontend-visual-tests:
    name: Frontend Visual Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]
    timeout-minutes: 30
    steps:
      # lfs: true - visual baselines are stored in git LFS; without it the
      # checkout leaves pointer files and comparisons fail with
      # "Could not decode expected image as PNG"
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          allow-prereleases: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Start e2e mock server
        run: |
          python tests/e2e-server.py &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8001/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8001/

      - name: Run visual tests in Playwright container
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./web/package.json').devDependencies['@playwright/test']")
          docker run --rm --network host \
            -v "$PWD":/work -w /work/web \
            -e PW_BASE_URL=http://127.0.0.1:8001 \
            -e CI=1 \
            --ipc=host \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy" \
            npx playwright test tests/visual --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: web/test-results/
          retention-days: 7
