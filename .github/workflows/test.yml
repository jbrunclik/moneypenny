name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Needed because a merge performed by the Dependabot
  # auto-merge job uses the default GITHUB_TOKEN, and GitHub deliberately does
  # NOT fire workflows for pushes made with that token - so a bot-merged PR
  # leaves main with no Tests run at all (Sep 6 2026: two Dependabot merges
  # landed on main with zero CI coverage, and there was no way to ask for a
  # run without pushing a commit). Use this to verify main after a batch of
  # bot merges.
  workflow_dispatch:

# Read-only token: no job writes to the repository (P4)
permissions:
  contents: read

# A newer push supersedes the running check of the same branch (P4)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # npm's download cache, not node_modules: npm ci deletes node_modules
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Run linters
        run: make lint

      # P1: the committed OpenAPI spec, TS types and lock must match their
      # sources. uv keeps the pins already in requirements.txt, so only an
      # edit to requirements.in without `make lock` shows up here.
      - name: Generated files match their sources
        run: |
          make openapi types lock
          git diff --exit-code static/openapi.json web/src/types/generated-api.ts requirements.txt

  # S9: the repo is public - no secrets and no infrastructure details
  public-repo-scan:
    name: Public Repo Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: No secrets in tracked files (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --no-banner --redact

      # Hostnames, IPs and provider names live in the FORBIDDEN_PATTERNS secret
      # (one per line), never in the repo. Only file:line is printed: a public
      # repo's CI logs are public too.
      - name: No infrastructure details in tracked files
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: |
          if [ -z "$FORBIDDEN_PATTERNS" ]; then
            echo "::warning::FORBIDDEN_PATTERNS secret not set; infrastructure scan skipped"
            exit 0
          fi
          printf '%s\n' "$FORBIDDEN_PATTERNS" | sed '/^$/d' > "$RUNNER_TEMP/patterns"
          hits=$(git grep -n -I -i -F -f "$RUNNER_TEMP/patterns" | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then
            echo "::error::Infrastructure details in tracked files:"
            echo "$hits"
            exit 1
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run backend tests with coverage
        run: make test-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 7

  # P7: tests that need Docker (code sandbox) or Chromium (browser tool) skip
  # in the backend job; here the dependencies exist, so a skip is a failure
  backend-docker-browser-tests:
    name: Backend Docker & Browser Tests
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build the code sandbox image
        run: make sandbox-image

      - name: Run Docker and browser tests (no skips allowed)
        run: |
          python -m pytest -rs -v \
            tests/integration/test_browser_page_state.py \
            tests/integration/test_browser_request_guard.py \
            tests/integration/test_code_sandbox_cancel.py \
            tests/integration/test_code_sandbox_isolation.py \
            tests/integration/test_code_sandbox_office_files.py | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::A Docker or browser test skipped although its dependency is installed"
            exit 1
          fi

  frontend-unit-tests:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # npm's download cache, not node_modules: npm ci deletes node_modules
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run tests with coverage
        run: cd web && npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  frontend-e2e-tests:
    name: Frontend E2E Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Only lint gates the browser jobs: waiting for the backend and unit
    # suites put them on the critical path, and runner minutes are free for a
    # public repo
    needs: [lint]
    # One runner per browser: both projects on a single 2-vCPU runner meant 8
    # concurrent browser contexts against one mock server, and the suite only
    # passed through retries - webkit tests timing out waiting for mock
    # responses that never became slow in isolation. Halving the contexts per
    # runner (4 workers x 1 project) removes that starvation and halves the
    # wall time.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Playwright shards by test COUNT in file order, so a shard that
          # draws streaming.spec.ts (many 10-20s tests) runs long. Smaller
          # slices even that out (Oct 2026: the 1-shard chromium job and the
          # streaming-heavy webkit shard were the critical path at ~6.5 min).
          - project: chromium
            shard: 1/2
            workers: 4
          - project: chromium
            shard: 2/2
            workers: 4
          # WebKit is the CPU hog: with 4 webkit contexts on one runner the mock
          # server's /test/reset took up to 12s (starved Python, not a lock -
          # a reset is ~6ms in isolation) and streams stalled on "Thinking";
          # 3 contexts still produced 9s stalls. Two contexts per runner -
          # runner minutes are free for a public repo, retries aren't.
          - project: webkit
            shard: 1/6
            workers: 2
          - project: webkit
            shard: 2/6
            workers: 2
          - project: webkit
            shard: 3/6
            workers: 2
          - project: webkit
            shard: 4/6
            workers: 2
          - project: webkit
            shard: 5/6
            workers: 2
          - project: webkit
            shard: 6/6
            workers: 2
    # Fail fast instead of burning ~6h of runner time if the browser/app hangs
    # (e.g. a Playwright bump whose webkit build never completes page load).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # npm's download cache, not node_modules: npm ci deletes node_modules
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      # The mock server runs outside Playwright so the browsers can be niced
      # below it: on a 2-vCPU runner the browser processes otherwise starve
      # the Python server (the SLOW log showed even GET / taking 3.8s).
      - name: Start e2e mock server
        run: |
          python tests/e2e-server.py > e2e-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8001/api/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8001/api/version

      # The browsers run in the Playwright image, which ships them with their
      # system deps. `playwright install --with-deps` pulled ~100 media
      # packages from the runner's apt mirror, which intermittently crawled at
      # KB/s and hung shards until the 30-min timeout (Oct 2026); the image
      # pulls in ~25s
      - name: Run E2E tests in Playwright container
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./web/package.json').devDependencies['@playwright/test']")
          docker run --rm --network host \
            -v "$PWD":/work -w /work/web \
            -e PW_BASE_URL=http://localhost:8001 \
            -e CI=1 \
            --ipc=host \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy" \
            nice -n 10 npx playwright test tests/e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}

      # Any request the mock server took >1s to answer - a starvation
      # suspect. Empty is the goal.
      - name: Mock server slow-request log
        if: always()
        run: grep -E 'SLOW |INFLIGHT ' e2e-server.log || echo "no slow requests"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/test-results/
          retention-days: 7

  # Visual regression tests run inside the Playwright Docker container so
  # font rendering matches the committed *-linux.png baselines exactly.
  # The mock server runs on the runner host (python 3.14); the container
  # reaches it via host networking. Baselines are (re)generated locally
  # with: make test-fe-visual-linux-update (requires Docker).
  frontend-visual-tests:
    name: Frontend Visual Tests
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 30
    steps:
      # lfs: true - visual baselines are stored in git LFS; without it the
      # checkout leaves pointer files and comparisons fail with
      # "Could not decode expected image as PNG"
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # npm's download cache, not node_modules: npm ci deletes node_modules
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Start e2e mock server
        run: |
          python tests/e2e-server.py &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8001/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8001/

      - name: Run visual tests in Playwright container
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./web/package.json').devDependencies['@playwright/test']")
          docker run --rm --network host \
            -v "$PWD":/work -w /work/web \
            -e PW_BASE_URL=http://127.0.0.1:8001 \
            -e CI=1 \
            --ipc=host \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy" \
            npx playwright test tests/visual --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: web/test-results/
          retention-days: 7
