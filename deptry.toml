# deptry (C2, `make lint`): every import is a declared dependency and every
# declared runtime dependency is imported. Its own file, not pyproject.toml:
# deptry reads dependencies from a pyproject [project] table when there is one,
# and ours lives in requirements.in / requirements-dev.in.
[tool.deptry]
requirements_files = ["requirements.in"]
requirements_files_dev = ["requirements-dev.in"]
known_first_party = ["src", "evals", "tests", "scripts"]
# The code sandbox image's own helpers: run inside the image, whose Dockerfile
# installs their imports (pdfplumber) - not dependencies of the app
extend_exclude = ["docker"]

[tool.deptry.per_rule_ignores]
# gunicorn: run by the systemd unit (gunicorn src.app:...), never imported.
# docker: imported by name (importlib) in src/agent/tools/docker_sandbox.py -
# a plain `import docker` resolves to the repo's docker/ directory in mypy.
# defusedxml: openpyxl parses through it when installed (Office uploads;
# test_office_text pins that it does)
DEP002 = ["gunicorn", "docker", "defusedxml"]
