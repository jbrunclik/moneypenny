<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App icon source of truth. The mark is the family bot reduced to its most
    recognizable element: two glowing eyes on deep indigo. The right eye is
    slightly shorter (a knowing half-blink) - that asymmetry is the icon's
    signature; keep it. Eyes stay inside the center 60% so the same art
    survives the maskable safe zone. Rasterized to static/icon-*.png by
    scripts/render_icons.mjs (Playwright).
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#11102e"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- halo behind the eyes -->
  <g filter="url(#glow)" opacity="0.55">
    <rect x="140" y="176" width="100" height="160" rx="50" fill="#818cf8"/>
    <rect x="272" y="196" width="100" height="140" rx="50" fill="#818cf8"/>
  </g>

  <!-- eyes: left open, right in a slight knowing blink -->
  <rect x="140" y="176" width="100" height="160" rx="50" fill="url(#eye)"/>
  <rect x="272" y="196" width="100" height="140" rx="50" fill="url(#eye)"/>

  <!-- catchlights -->
  <circle cx="172" cy="214" r="16" fill="#eef2ff" opacity="0.9"/>
  <circle cx="304" cy="232" r="14" fill="#eef2ff" opacity="0.85"/>
</svg>
