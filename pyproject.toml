[project]
name = "moneypenny"
version = "0.1.0"
description = "Moneypenny - personal AI assistant using Google Gemini APIs"
requires-python = ">=3.14"
# Dependencies live in requirements.in (ranges) and requirements.txt (the
# lock, `make lock`) - nothing installs this project as a package, so lists
# here only drifted (and drew Dependabot PRs for an unused package)

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings (includes W291, W293 for trailing whitespace)
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    # Added Oct 25 2026 (C3). Existing violations carry a `# noqa: CODE`
    # baseline that only shrinks (docs/conventions.md).
    "BLE",    # blind except (B5)
    "TRY400", # log exceptions with their traceback (B5)
    "G",      # logging format: extra=, not f-strings (S8)
    "LOG",    # logging misuse
    "T20",    # print (src only, see per-file ignores)
    "RUF",    # ruff-specific, incl. RUF100 unused noqa
    "SIM",    # simplifications
    "RET",    # return consistency
    "PERF",   # performance anti-patterns
    "N",      # naming, incl. N818 exceptions end in Error (B5)
    "PGH",    # specific type: ignore / noqa codes
    "TID",    # banned APIs: requests (B9)
    "C90",    # complexity (C1)
    "PLR0912",  # too many branches (C1)
    "PLR0915",  # too many statements (C1)
    "PLC0415",  # import inside a function: say why (B10; src only)
    "DTZ",      # aware datetimes only (B12; not tests, which build legacy naive values)
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode: Czech text is intended
]
# W291 = trailing whitespace
# W293 = blank line contains whitespace
# These are included in "W" but explicitly listed for clarity

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx - one HTTP client library (B9)"

[tool.ruff.lint.per-file-ignores]
# Tests assert constantly and use fake tokens/credentials by design; their
# output and the scripts' and evals' is meant for a terminal
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S110", "S311", "S603", "S607", "S608", "T20", "TID251", "PLC0415", "DTZ"]
"scripts/**" = ["S101", "S603", "S607", "T20", "PLC0415"]
"evals/**" = ["T20", "PLC0415"]
# The E2E server's entry point keeps the hyphenated name every caller launches
"tests/e2e-server.py" = ["N999"]
# SQL built from the module-constant conversation-type CASE expression, not user input
"scripts/analyze_costs.py" = ["S101", "S603", "S607", "S608", "T20", "PLC0415"]
# Column names in these queries come only from the PROGRAM_FEATURES registry
# or fixed strings - never user input (documented at each site)
"src/db/models/*" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.importlinter]
# B1/B3 (docs/conventions.md): imports point down the layers. No known
# violations: a new one is fixed, not baselined.
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "services never imports api or agent"
type = "forbidden"
source_modules = ["src.services"]
forbidden_modules = ["src.api", "src.agent"]

[[tool.importlinter.contracts]]
name = "db never imports api, agent or services"
type = "forbidden"
source_modules = ["src.db"]
forbidden_modules = ["src.api", "src.agent", "src.services"]

[[tool.importlinter.contracts]]
name = "agent never imports api"
type = "forbidden"
source_modules = ["src.agent"]
forbidden_modules = ["src.api"]

[[tool.importlinter.contracts]]
name = "utils imports no other layer of src"
type = "forbidden"
source_modules = ["src.utils"]
forbidden_modules = ["src.api", "src.agent", "src.services", "src.auth", "src.db"]

[[tool.importlinter.contracts]]
name = "routes make no outbound HTTP calls themselves"
type = "forbidden"
source_modules = ["src.api.routes"]
forbidden_modules = ["requests", "httpx"]
allow_indirect_imports = true

# Dead code (C2). 60% is vulture's lowest level: every unused function, class,
# method, attribute and variable. Framework entry points are ignored by
# decorator; what vulture can't see (Pydantic fields, interface methods, test
# seams) is listed in vulture_whitelist.py with the reason.
[tool.vulture]
paths = ["src", "evals", "scripts", "tests/e2e_server", "tests/e2e-server.py", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
    # Flask / APIFlask routes and request hooks
    "@*.route",
    "@*.before_request",
    "@*.after_request",
    "@*.teardown_request",
    "@*.errorhandler",
    "@*.error_processor",
    "@*.context_processor",
    # Pydantic validators run on model construction
    "@field_validator",
    "@model_validator",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.generativeai.*",
    "langgraph.*",
    "langchain.*",
    "langchain_google_genai.*",
]
ignore_missing_imports = true

# pillow-heif 1.7.0 (Sep 2026) ships py.typed but defines no __all__, so under
# strict mode's no_implicit_reexport mypy rejects `pillow_heif.register_heif_opener`
# even though it exists and is callable at runtime (this broke lint on main
# when requirements were still >= ranges). Scoped to the re-export rule (not a
# blanket ignore) so genuine API breakage in this package still surfaces.
[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/app.py"]

[tool.coverage.report]
# Ratchet (T2): about 2 points under actual (85.6% in CI, Oct 25 2026). Raise
# it as coverage grows; never lower it to get a change through.
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]
