summary: 'Uživatel řešil organizaci týdne, protože Klára měla být ve středu (9:00–17:30) na poradě v Brně.
  Asistent vypsal události z kalendáře *Rodina* (úterý 15:30–17:00 Anička keramika v DDM, třída 17. listopadu;
  středa 16:00–16:45 Matěj plavání na plaveckém stadionu; sobota 14:00–17:00 oslava Ondry v Bongu).


  Na žádost uživatele asistent rozplánoval středu s ohledem na jeho práci z domu, call (14:00–15:00),
  konec školy (Anička 13:40, Matěj 12:00, družina do 16:30) a 20minutovou cestu autem na plavání. Uživatel
  se rozhodl vyzvednout obě děti v 15:20 a vzít Aničku s sebou. Asistent tuto událost (15:20–15:35 *Vyzvednout
  Matěje a Aničku z družiny*) zapsal do kalendáře *Rodina*.


  Dále asistent přidal do Todoistu (projekt *Rodina*) dva úkoly:

  - *Zaplatit školní výlet Anička (450 Kč)* (sekce *Škola*, termín pátek, vysoká priorita).

  - *Přezůvky Matěj – větší velikost (31)* (termín čtvrtek), s tipem na nákup v Deichmannu či Decathlonu
  na Šantovce.


  Nakonec uživatel hledal dárek do 500 Kč pro 7letého Ondru (1. třída, kamarád ze školky), který má rád
  Lego a dinosaury. Asistent navrhl LEGO Creator 3v1 dinosaurus, LEGO Jurassic World, vykopávkovou sadu
  (200–350 Kč) nebo encyklopedii (kolem 300 Kč). Otevřeným úkolem zůstává výběr dárku a potvrzení, zda
  jej má asistent přidat do Todoistu na pátek.


  Uživatel potvrdil přidání dárku do Todoistu. Asistent proto vytvořil úkol **Dárek pro Ondru (narozeniny
  v sobotu)** s termínem v pátek, střední prioritou a popisem *„LEGO Creator 3v1 dinosaurus, do 500 Kč;
  záloha: vykopávková sada“*.


  Dále uživatel požádal o seznam věcí pro děti na prodloužený víkend na chatě v Jeseníkách (pátek–neděle,
  za dva týdny), kde jsou pouze kamna na dřevo a bojler. Asistent připravil přehled oblečení, hygieny,
  léků, zábavy a vybavení na chatu. Uživatel seznam předá Kláře a nechtěl jej ukládat do Todoistu. Na
  jeho žádost asistent také zkontroloval kalendář a potvrdil, že celodenní událost **Chata Jeseníky**
  (pátek–neděle, za 11 dní) tam již Klára zadala.


  Nakonec uživatel řešil objednání STK pro Octavii (platnost končí za měsíc). Asistent doporučil online
  rezervaci v Olomouci (ideálně ranní termíny 7:00–8:00) a připomněl nutnost vzít velký i malý technický
  průkaz a doklad o povinném ručení. Na přání uživatele pak asistent přidal do Todoistu (projekt *Rodina*)
  úkol **Objednat STK Octavia** s termínem na příští čtvrtek, protože tento týden to uživatel nestíhá.


  Uživatel se ptal na dnešní úkoly. Asistent zjistil, že v Todoistu je po termínu úkol **Vrátit knihy
  do knihovny** (Inbox) a bez termínu položky v projektu *Nákup* (**Mléko, chleba, jogurty**); kalendář
  byl na dnešek prázdný. Na žádost uživatele asistent označil vrácení knih jako splněné.


  Dále uživatel ověřoval zubaře pro Matěje na příští úterý. Asistent potvrdil událost **Zubař Matěj**
  (8:20–8:50, MUDr. Hrubá, Zikova 3) s tím, že do školy dorazí kolem 9:10–9:15. Uživatel odmítl připomínku
  na omluvenku s tím, že ji napíše rovnou do Bakalářů.


  Pro večerní vaření do 30 minut pro vybíravého Matěje asistent navrhl několik rychlých jídel, z nichž
  uživatel vybral **domácí pizzu na tortile**.


  Nakonec uživatel řešil vánoční kolo pro devítiletou Aničku (137 cm). Asistent doporučil velikost 24"
  (pro 125–145 cm) a zvážení bazarového nákupu u lehkých značek (Kubikes, Woom, Early Rider, Specialized).
  Uživatel se rozhodl podívat po bazarovém kole Kubikes. Asistent mu proto na neděli v 19:00 přidal do
  Todoistu (projekt *Rodina*) úkol **Probrat s Klárou kolo pro Aničku (Kubikes 24, bazar)**.'
