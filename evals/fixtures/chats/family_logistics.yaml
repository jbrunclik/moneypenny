      Hruba, Zikova 3"}]}
- role: user
  content: Ne to neni treba, napisu to rovnou do bakalaru. Jinak vecer budu varit a nevim co, deti chtej
    porad jen palacinky. Neco rychlyho do 30 minut, co sni i Matej, ten je hroznej vybirava.
- role: assistant
  content: 'Pár rychlých jídel, která vybíravé děti většinou snědí:


    1. **Kuřecí kousky v kukuřičných lupíncích** z trouby (20 min) – kuřecí prsa nakrájet na nudličky,
    obalit ve vajíčku a rozdrcených lupíncích, péct 15 min na 200 °C. K tomu brambory nebo rýže a mrkev
    na kolečka.

    2. **Těstoviny s rajčatovou omáčkou a schovanou zeleninou** (25 min) – do omáčky nastrouhat mrkev
    a cuketu, rozmixovat. Matěj nic nepozná.

    3. **Domácí pizza na tortile** (15 min) – tortila, protlak, šunka, sýr, 8 minut v troubě. Děti si
    ji můžou samy obložit, pak to i víc jedí.

    4. **Bramboráčky s jogurtem** – když chtějí „něco jako palačinky“.


    Pro vybíravé děti platí, že když si můžou samy něco nandat nebo obložit, sní víc. Pizza na tortile
    je v tom nejlepší.'
- role: user
  content: Pizza na tortile vyhrala :D Jeste me napadlo, Anicka chce na Vanoce novy kolo. Je ji 9, meri
    137 cm. Jaky velikosti kol? A je lepsi koupit novy nebo bazar?
- role: assistant
  content: 'Pro 137 cm vysokou devítiletou dívku:


    **Velikost:** kola 24" jsou pro výšku zhruba 125–145 cm, takže 24" je ideální. Kdyby rychle rostla,
    některé modely 26" mají malý rám (XS) od cca 140 cm – ale na 137 cm by to bylo zatím velké a hůř by
    ho ovládala.


    **Nové vs. bazar:**

    - **Bazar** dává u dětských kol smysl – vyrostou z nich za 2–3 roky. Dobré značky (Kubikes, Woom,
    Early Rider, Specialized) drží cenu, takže ho pak zase prodáte. Zkontroluj brzdy, řetěz a přehazovačku,
    ideálně si s ním projeď.

    - **Nové** dává smysl, pokud chcete lehké kvalitní kolo (Kubikes 24 nebo Woom 5 váží kolem 8–9 kg
    – na tom dítě jezdí úplně jinak než na 13 kg supermarketovém kole). Nová kolem 9–14 tisíc.


    Váha kola je u dětí to nejdůležitější: lehké kolo = víc jezdí a víc je to baví.'
