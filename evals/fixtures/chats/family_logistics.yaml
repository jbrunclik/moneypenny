- role: assistant
  content: 'Ano, v kalendáři je **Zubař Matěj** příští úterý 8:20–8:50, MUDr. Hrubá, Zikova 3.


    Do školy tak dorazí zhruba v 9:10–9:15. Doporučuju dát vědět paní učitelce předem přes Bakaláře nebo
    lísteček v žákovské, ať nečekají. Mám ti dát do Todoistu připomínku „Omluvit Matěje – zubař“ na pondělí?'
  metadata:
    tool_outputs: google_calendar({"action":"list_events","time_min":"{in_7_days}T00:00:00+01:00","time_max":"{in_9_days}T00:00:00+01:00","query":"zubar"})
