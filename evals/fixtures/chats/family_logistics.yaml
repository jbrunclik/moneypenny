  content: 'Na dnešek v Todoistu nemáš nic s termínem, ale je tam jeden **po termínu**:

    - **Vrátit knihy do knihovny** (Inbox, termín byl včera)


    A bez termínu v projektu Nákup: **Mléko, chleba, jogurty**.


    V kalendáři na dnešek nic. Pokud půjdeš kolem knihovny, můžeš to vzít s nákupem najednou.'
  metadata:
    tool_outputs: todoist({"action":"get_tasks","filter":"today | overdue"}) -> {"count":1,"tasks":[{"id":"t6","content":"Vratit
