    – i se zpožděním vlaku.


    Mezi tím máte hodinu na večeři; kdyby děti byly po plavání hladové, vezmi jim do haly svačinu (rohlík,
    jablko), ať nejsou v autě nevrlé. Mám zapsat do kalendáře „Vyzvednout Kláru – hlavní nádraží 18:40“?'
