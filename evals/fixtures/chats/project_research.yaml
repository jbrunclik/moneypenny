- role: user
  content: Posledni dotaz na dneska. Fotovoltaiku jsi zminoval. Dava smysl ji resit soucasne nebo az pozdeji?
- role: assistant
  content: 'Řešit **současně** to smysl dává v plánování, s realizací klidně později:


    **Proč plánovat spolu:**

    - FVE v zimě vyrobí málo (prosinec–leden 5–10 % roční výroby), takže na samotné topení moc nepomůže.
    Ale na ohřev vody v létě a na jaře/podzim ano.

    - Některé čerpadla umí řízení podle přebytků FVE (Aerona T9 má „PV ready“ vstup), takže je dobré to
    vědět při výběru.

    - Elektrikář může rovnou připravit rozvaděč na střídač a nemusí se to dělat dvakrát.


    **Proč realizaci později:**

    - Rozpočet – FVE 5–7 kWp s baterií je dalších 200–300 tisíc.

    - Dotace na FVE jsou samostatný program, můžete na ně žádat zvlášť.


    **Praktický postup:** při poptávce TČ se zeptejte, jestli je model PV ready a jestli firma dělá i
    FVE nebo s někým spolupracuje. Pak se k tomu můžete vrátit za rok, až uvidíte reálnou spotřebu čerpadla.'
- role: user
  content: Tak prvni tyden testu za nama. Kotel na 55, venku rano -3 az +4. Doma obyvak 21,5, loznice
    20, detsky pokoj jen 19,5 a deti si stezuji. Ten detsky pokoj je v rohu domu na severu. Mam jit na
    50 nebo to nechat?
- role: assistant
  content: 'Díky za data, to je přesně to, co potřebujeme. Shrnutí: při 55 °C a venku -3 až +4 °C je obývák
    i ložnice v pohodě, ale **dětský pokoj (severní roh) je limitující místnost** – 19,5 °C už je na hraně.


    **Co z toho plyne:**

    - Na 50 °C bych teď nešel – dětský pokoj by klesl pod 19 °C a pořádný mráz ještě nepřišel.

    - Zkontroluj v dětském pokoji termostatickou hlavici: musí být na maximu (5), ne na 3, a nesmí být
    zakrytá závěsem nebo nábytkem.

    - Odvzdušni radiátor v dětském pokoji – vzduch v radiátoru snižuje výkon o desítky procent.


    **Pro čerpadlo to znamená:** dětský pokoj je kandidát na **výměnu radiátoru za větší** (nebo nízkoteplotní
    s ventilátorem), jak se to u domů ze 70. let často dělá. Je to jeden radiátor za 5–8 tisíc
    s montáží, ne celý dům.


    Pokračuj na 55 °C a pošli mi data z prvního týdne, kdy bude ráno pod -5 °C. Zapisuj si k tomu i čas,
    kdy kotel nejvíc běží – podle toho poznáme, jestli dům v noci hodně chladne.'
summary_covers: 16
summary: 'Uživatel zvažoval výměnu 18 let starého plynového kotle za tepelné čerpadlo v zatepleném domě
  z roku 1976 (150 m², zateplení 10 cm před 6 lety, plastová okna). Roční spotřeba plynu činila 17 MWh
  (včetně vaření a ohřevu vody), deskové radiátory jely v mrazech na 55–60 °C. Venkovní jednotka by stála
  na zahradě (9 m od souseda, směrem k ložnici).


  Asistent potvrdil, že výměna dává smysl (odhad ceny 250–320 tis. Kč, dotace v roce 2025 byla 100 tis.
  Kč). Tepelnou ztrátu vypočítal na 6–7 kW (při -12 °C) a doporučil 8kW čerpadlo se spotřebou ~4,5 MWh
  elektřiny ročně. V tabulce ({artifact_0}) představil tři modely: **Aerona T9** (48 dB(A), nejlepší poměr
  cena/výkon), **Thermalis HP10** (52 dB(A), nejlevnější) a **Nordhaus Split 8** (SCOP 4,9, 45 dB, nejdražší).


  Asistent rozptýlil obavy partnerky Kláry z hluku (48 dB(A) odpovídá ve 4 m cca 28 dB, přes zavřená okna
  téměř neslyšitelné) a doporučil umístění mimo roh a okno ložnice, antivibrační podložky a noční režim.
  U elektřiny doporučil přechod ze sazby D02d na **D56d** (úspora 7–9 tis. Kč/rok), což vyžaduje revizi,
  žádost u distributora (2–4 týdny), výměnu elektroměru a případné navýšení jističe (např. z 3×20 A na
  3×25 A za cca 500 Kč/A).


  **Otevřené úkoly:** Uživatel by měl v zimě otestovat snížení teploty vody na 45–50 °C a ověřit ceny
  D56d u dodavatele; asistent přislíbil ověřit aktuální výši dotace.


  Uživatel se dotázal na celkovou roční úsporu oproti současným nákladům na plyn (32 000 Kč/rok). Asistent
  odhadl roční náklady s tepelným čerpadlem na 24–25 tis. Kč (20 tis. Kč za elektřinu v sazbě D56d při
  ~4,5 Kč/kWh, ~2,5 tis. Kč za vaření na indukci místo plynu, o 2–3 tis. Kč vyšší stálé platby za elektřinu),
  což znamená úsporu 7–8 tis. Kč ročně. Návratnost při investici ~280 tis. Kč (minus dotace 90–100 tis.
  Kč) vyčíslil na 23–27 let, případně 12–15 let oproti pořízení nového plynového kotle (80–120 tis. Kč).


  Uživatel následně zvažoval, zda není lepší koupit nový plynový kotel a počkat. Asistent shrnul argumenty:
  u plynu hrozí od roku 2027 zdražení o 10–20 % kvůli emisním povolenkám (ETS2), zatímco u TČ je nyní
  dostupná dotace a možnost budoucí kombinace s fotovoltaikou. Doporučil nejprve provést zimní test s
  nižší teplotou vody (45–50 °C).


  Uživatel s testem souhlasil a požádal o návod pro svůj kotel **Vaillant ecoTEC**. Asistent popsal postup:
  na předním panelu u symbolu radiátoru postupně snižovat teplotu ze 60–70 °C po 5 °C týdně (55 → 50 →
  45 °C) a zapisovat venkovní i vnitřní teploty (obývák, ložnice), ideálně v mrazech pod -5 °C, aby se
  ověřilo udržení 21 °C. Pokud mají prostorový termostat nebo ekvitermní regulaci, nastavuje se topná
  křivka v regulátoru.


  **Otevřené úkoly:** Uživatel provede zimní test kotle Vaillant ecoTEC a případně upřesní typ svého termostatu.'
