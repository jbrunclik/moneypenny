- role: user
  content: Ok to je uklidnujici. Dalsi vec, jak je to s tou elektrinou, my mame ted sazbu D02d. Musime
    menit?
- role: assistant
  content: 'Ano, změna sazby se rozhodně vyplatí. Při tepelném čerpadle máte nárok na **sazbu D56d**,
    která má **nízký tarif 22 hodin denně** (vs. D02d s jedním tarifem po celý den). Čerpadlo pak jede
    skoro celý den za levnější elektřinu.


    **Co je potřeba:**

    1. Revizní zpráva elektroinstalace a doklad o instalaci TČ (dodá montážní firma).

    2. Žádost u distributora o změnu sazby – vyřizuje se obvykle online, trvá 2–4 týdny.

    3. Výměna elektroměru za dvoutarifní (zdarma, dělá distributor).

    4. Může být potřeba navýšit hlavní jistič (např. z 3×20 A na 3×25 A) – to už se platí, cca 500 Kč
    za ampér.


    **Úspora:** při ~4,5 MWh ročně na čerpadlo a cenovém rozdílu mezi tarify kolem 1,5–2 Kč/kWh ušetříte
    ročně 7–9 tisíc oproti jednotarifu. Ověřte si i u svého dodavatele, kolik u něj D56d stojí – ceny
    se dost liší.'
- role: user
  content: A kolik bychom celkove usetrili rocne oproti plynu? Platime ted za plyn tak 32 tisic rocne.
- role: assistant
  content: 'Hrubý odhad (s cenami zhruba jako letos):


    **Teď:** plyn 17 MWh ≈ **32 000 Kč** ročně (podle vás, včetně stálých plateb).


    **S čerpadlem:**

    - Elektřina pro TČ: ~4,5 MWh (topení + voda) × ~4,5 Kč/kWh v nízkém tarifu D56d ≈ **20 000 Kč**

    - Vaření: plyn byste zrušili a vařili na indukci (~0,5 MWh elektřiny, ~2 500 Kč), nebo plyn nechali
    jen na vaření – pak ale platíte stálou platbu za plyn (~3 000 Kč ročně), což se nevyplatí.

    - Stálé platby za plyn odpadnou, ale za D56d jsou vyšší stálé platby za elektřinu (navíc ~2–3 tisíce
    ročně).


    **Celkem:** zhruba **24–25 tisíc** ročně, tedy úspora **7–8 tisíc ročně**.


    Při investici ~280 tisíc minus dotace 90–100 tisíc se to vrací zhruba za **23–27 let** jen z úspor.
    Hlavní argument pro TČ ve vaší situaci ale je, že kotel stejně brzy budete měnit – a nový plynový
    kotel by stál 80–120 tisíc. Pak se rozdíl vrací za ~12–15 let.'
- role: user
  content: Hm, to je delsi navratnost nez jsem cekal. Neni lepsi dat novej plynovej kotel a pockat?
- role: assistant
  content: 'Je to legitimní volba a záleží, co je pro vás důležité. Pro obě strany:


    **Pro nový kondenzační plynový kotel:**

    - Investice 80–120 tisíc, žádné velké stavební zásahy.

    - Vysoké teploty do radiátorů nevadí.

    - Plyn je teď relativně levný.


    **Proti:**

    - Ceny plynu jsou závislé na emisních povolenkách – od roku 2027 se začíná zpoplatňovat CO₂ z vytápění
    (systém ETS2), což může zvednout cenu plynu o 10–20 %.

    - Kotel vydrží 15–20 let, pak budete řešit to samé a dotace už možná nebudou.

    - Stálé platby za plyn i elektřinu.


    **Pro TČ teď:**

    - Dotace je ještě dostupná (i když nižší než loni).

    - Dům je zateplený – ideální stav.

    - Možnost kombinace s fotovoltaikou do budoucna (pak je úspora výrazně vyšší).


    Moje doporučení: pokud kotel ještě funguje, máte čas. Udělejte letos v zimě ten test s nižší teplotou
    vody do radiátorů – pokud dům vytopíte na 45–50 °C, TČ bude efektivní a dává smysl. Pokud ne, je to
    signál, že by se musely měnit radiátory a investice roste.'
- role: user
  content: Jo to s tim testem udelam. Jak mam presne nastavit kotel? Mame Vaillant ecoTEC, nevim kde se
    to nastavuje.
- role: assistant
  content: 'U Vaillant ecoTEC (většina modelů z let 2005–2012) se teplota vody do topení nastavuje na
    předním panelu kotle:


    1. Najdi otočný knoflík nebo tlačítka se symbolem **radiátoru** (ne kohoutku – ten je pro teplou vodu).

    2. Teď je asi nastavený na 60–70 °C. Snižuj ho **po 5 °C týdně**: 55 → 50 → 45.

    3. Pokud máte prostorový termostat nebo ekvitermní regulaci (čidlo venku), kotel teplotu mění sám
    podle počasí – pak se nastavuje „topná křivka“ v menu regulátoru, ne na kotli. Napiš mi typ termostatu
    a poradím.

    4. Každý týden si zapisuj: venkovní teplotu ráno a večer, teplotu doma v obýváku a ložnici, a jestli
    bylo někde chladno.


    Cílem je zjistit, při jaké nejnižší teplotě vody je doma ještě 21 °C i při mrazu. Až přijde první
    týden pod -5 °C, je to ten pravý test.'
- role: user
  content: Mame termostat Honeywell T4, ten je asi jen obycejnej. Nastavil jsem kotel na 55. Uvidime.
    Jinak jeste jak je to s tou dotaci, da se o ni zadat az po instalaci?
- role: assistant
  content: 'Honeywell T4 je běžný prostorový termostat (zapíná/vypíná kotel podle teploty v místnosti),
    takže nastavení na kotli je správná cesta. 55 °C je dobrý začátek.


    K dotaci, jak ji znám z loňska: žádost se dala podat **před realizací i po ní**, nejpozději do 2 let
    od uvedení do provozu. Podmínky, které platily a nejspíš platí dál:

    - čerpadlo musí být na **seznamu výrobků a technologií (SVT)**,

    - montáž musí udělat firma ze **seznamu odborných dodavatelů**,

    - je potřeba **odborný posudek** energetického specialisty.


    Výše podpory se ale mění – loni to bylo 100 tisíc na vzduch-voda, letos to může být jinak. Než budete
    objednávat, ověřte si aktuální podmínky výzvy, ať nepřijdete o peníze kvůli formalitě (typicky model
    mimo seznam SVT).'
- role: user
  content: Dobre. Mimochodem, posilam tabulku Klare a ona se pta, jestli ten Nordhaus split neni nejakej
    problem s tim chladivem, jestli to neni nebezpecny nebo jestli to nepotrebuje nejaky revize.
- role: assistant
  content: 'Dobrá otázka od Kláry. Split systém (jako Nordhaus Split 8) má venkovní a vnitřní jednotku
    propojené **chladivovým potrubím**, monoblok (Aerona, Thermalis) má celý chladivový okruh venku a
    do domu vede jen voda.


    **Co to znamená pro split:**

    - **Montáž** může dělat jen technik s certifikátem pro práci s chladivy (F-plyny). Seriózní firma
    ho má, ale je dobré se zeptat.

    - **Revize těsnosti:** záleží na množství chladiva. U menších domácích splitů (pod ~3 kg chladiva
    R32) povinná pravidelná kontrola těsnosti obvykle odpadá; u větších je kontrola 1× ročně. Zeptejte
    se dodavatele, kolik chladiva jejich model má.

    - **Bezpečnost:** chladivo R32 je mírně hořlavé, ale v domácích objemech a se správnou montáží je
    riziko velmi nízké. Vnitřní jednotka nemá být v malé uzavřené místnosti bez větrání.


    **Monoblok** je jednodušší na legislativu – žádná chladivová instalace v domě. Za to má o něco větší
    venkovní jednotku a v mrazech musí chránit vodu v potrubí před zamrznutím (glykol nebo ochranná funkce).


    Pro vás bych proto spíš volil monoblok (Aerona T9) – jednodušší servis a žádné starosti s F-plyny.'
- role: user
  content: 'Super, to dava smysl. Takze zatim: test s teplotou vody, a pak poptat 2-3 firmy na Aeronu
    T9. Co se mam firem ptat at me neodrbou?'
- role: assistant
  content: 'Přesně tak, dobrý plán. Otázky pro firmy:


    **Návrh:**

    1. „Uděláte výpočet tepelných ztrát, nebo jen odhad podle m²?“ – chcete výpočet (nebo aspoň výpočet
    ze spotřeby plynu, jak jsme dělali).

    2. „Jaký výkon navrhujete a proč?“ – pokud nabídnou 12 kW+, ptejte se proč; 8 kW vychází správně.

    3. „Jakou teplotu vody do radiátorů počítáte a je potřeba měnit radiátory?“


    **Dotace:**

    4. „Je model na seznamu SVT a jste v seznamu odborných dodavatelů?“ – chtějte to písemně.

    5. „Pomůžete s žádostí a posudkem?“ – mnoho firem to dělá v ceně.


    **Cena a servis:**

    6. „Co přesně je v ceně?“ – zásobník vody, akumulační nádrž, elektro práce, revize, uvedení do provozu,
    odvoz starého kotle.

    7. „Kdo dělá servis a za kolik? Jak rychle přijedete v zimě při poruše?“

    8. „Jaká je záruka na kompresor?“ – dobré značky 5–7 let.


    Porovnávejte nabídky položku po položce, ne jen celkovou cenu. Chceš, abych z toho udělal checklist
    do Todoistu?'
- role: user
  content: Jo, hod to do todoistu jako ukol s tema otazkama v popisu.
- role: assistant
  content: 'Přidáno do Todoistu: **Poptat 2–3 firmy na TČ Aerona T9** – v popisu všech 8 otázek (výpočet
