  pages:
    https://www.dotace-bydleni.example.cz/tepelna-cerpadla-2026: 'Dotace na tepelné čerpadlo 2026: výše
      podpory a podmínky


      Domů › Dotace › Vytápění › Tepelná čerpadla


      Aktualizováno 3. listopadu 2026 | Autor: redakce | Čtení na 6 minut


      Přihlaste se k odběru novinek a nezmeškejte žádnou výzvu! [Odebírat]


      Program podpory úsporného bydlení pokračuje i v roce 2026. Pro majitele rodinných domů, kteří chtějí
      nahradit stávající zdroj tepla tepelným čerpadlem, se ale od ledna mění pravidla i výše příspěvku.
      Shrnujeme, na kolik peněz můžete dosáhnout a co musíte splnit.


      Kolik dostanete

      Tepelné čerpadlo vzduch-voda pro vytápění a ohřev vody v rodinném domě: 90 000 Kč (do prosince 2025
      to bylo 100 000 Kč).

      Tepelné čerpadlo země-voda: 140 000 Kč.

      Tepelné čerpadlo jen pro ohřev vody: 30 000 Kč.

      Bonus za výměnu kotle na uhlí nebo dřevo (1. a 2. emisní třídy): +40 000 Kč. Při výměně plynového
      kotle se bonus NEPOSKYTUJE.

      Bonus pro rodiny s dětmi: +10 000 Kč na každé nezaopatřené dítě v trvalém bydlišti, maximálně však
      50 % celkových způsobilých výdajů.


      Podmínky

      - Dům musí být zkolaudovaný a sloužit k trvalému bydlení.

      - Tepelné čerpadlo musí být na seznamu výrobků a technologií (SVT) programu.

      - Instalaci musí provést firma zapsaná v seznamu odborných dodavatelů.

      - Žádost lze podat před realizací i po ní, nejpozději však do 2 let od uvedení do provozu.

      - Ke žádosti se dokládá odborný posudek (energetický specialista) a u domů nad 200 m2 i průkaz energetické
      náročnosti.


      Pozor na zálohovou variantu

      Domácnosti s nižšími příjmy mohou využít zálohové vyplácení až 100 % podpory předem. Pro ostatní
      se dotace vyplácí až po doložení realizace, obvykle do 3–4 měsíců od podání kompletní dokumentace.


      Nejčastější chyby

      Podle zkušeností poradců žadatelé nejčastěji chybují v tom, že objednají čerpadlo, které na seznamu
      SVT není, nebo nechají instalaci udělat firmou bez zápisu. Takovou žádost úřad zamítne bez možnosti
      nápravy.


      Kalkulačka dotace

      Zadejte typ zdroje, počet dětí a velikost domu a zjistěte orientační výši podpory. [Spočítat dotaci]


      Související články

      › Fotovoltaika 2026: co se mění

      › Zateplení fasády a dotace: kolik ušetříte

      › Výměna kotlů: poslední výzva pro kotlíkové dotace


      Diskuze (47) | Sdílet | Tisk


      © 2026 Dotace & bydlení. Informace mají orientační charakter, závazné jsou podmínky aktuální výzvy.

      '
    https://www.teplo-poradna.example.cz/clanky/hluk-venkovni-jednotky: 'Jak hlučné je tepelné čerpadlo?
      Limity a vzdálenost od souseda


      Teplo poradna › Články › Tepelná čerpadla


      Hluk venkovní jednotky je nejčastější důvod sousedských sporů kolem tepelných čerpadel. Výrobci
      přitom uvádějí čísla, která se těžko porovnávají: jednou akustický výkon (Lw), jindy akustický tlak
      (Lp) v určité vzdálenosti.


      Co říkají předpisy

      Hygienický limit pro chráněný venkovní prostor stavby (zjednodušeně u fasády souseda) je ve dne
      50 dB a v noci (22:00–6:00) 40 dB. V noci čerpadlo topí nejvíc a ventilátor běží na vyšší otáčky,
      proto je rozhodující noční limit.


      Akustický výkon vs. tlak

      Údaj v katalogu „48 dB(A)“ bývá akustický výkon ve zkušebních podmínkách. Akustický tlak klesá se
      vzdáleností zhruba o 6 dB s každým zdvojnásobením vzdálenosti. Orientačně: jednotka s akustickým
      výkonem 48 dB(A) má ve vzdálenosti 1 m tlak kolem 40 dB, ve 4 m kolem 28 dB. Jednotka s 55 dB(A)
      potřebuje k dodržení nočního limitu vzdálenost zhruba 6–8 m.


      Pozor: v létě přesto jiné hodnoty

      Některé výrobci uvádějí hluk jen v „tichém režimu“, který omezuje výkon. Při -10 °C ale čerpadlo
      tichý režim často opouští, aby dům udrželo v teple.


      Tipy pro umístění

      - Neumisťujte jednotku do rohu mezi dvě zdi ani pod okno ložnice (zvuk se odráží).

      - Antivibrační podložky a pružné připojení potrubí snižují přenos chvění do konstrukce.

      - Protihlukové kryty fungují, ale nesmí omezit proudění vzduchu.

      - Zeptejte se dodavatele na hlukovou studii – seriózní firmy ji udělají zdarma.


      Názor odborníka

      „Nejčastěji vidím jednotky postavené na úzké straně domu, metr od plotu souseda. Pak nepomůže ani
      nejtišší model,“ říká Ing. Pavel Šťastný, energetický auditor.


      Diskuze (12)

      Martin K.: My máme 52 dB a soused si stěžoval jen jednou, když byl mráz -15.

      Lucie: Doporučuju tichý režim na noc, u nás to šlo nastavit v aplikaci.

      '
    https://forum.stavime-dum.example.cz/t/tc-v-dome-ze-70-let-zkusenosti: 'TČ v domě ze 70. let - zkušenosti
      po první zimě


      Fórum Stavíme dům › Vytápění › Tepelná čerpadla


      jirka_k74 | 14. 4. 2026

      Ahoj, slíbil jsem, že po první zimě napíšu zkušenosti. Máme kostku z roku 1974, 140 m2, zateplenou
      12 cm EPS (2019), nová okna, strop do půdy 20 cm vaty. Původně plynový kotel, spotřeba plynu cca
      16 MWh ročně.


      Loni v září jsme dali TČ vzduch-voda 8 kW, monoblok, zásobník 200 l. Radiátory jsme vyměnili jen
      ve dvou pokojích (obývák a dětský pokoj) za větší, jinak původní litinové.


      Spotřeba elektřiny na TČ za topnou sezónu (říjen–duben): 6 800 kWh včetně ohřevu vody. Teplota vody
      do radiátorů většinu času 40–45 °C, v lednu při -12 °C až 52 °C. Doma 21–22 °C bez problému.


      Co bych udělal jinak: nechal bych si dřív udělat výpočet tepelných ztrát. Firma nám nejdřív nabízela
      12 kW, což by bylo předimenzované a cyklovalo by to.


      petra_olm | 14. 4. 2026

      Díky za sdílení! Kolik vás to stálo i s dotací?


      jirka_k74 | 15. 4. 2026

      @petra_olm Celkem 278 tisíc s montáží a radiátory, dotace byla tehdy 100 tisíc (letos už je to myslím
      míň). Elektřinu máme na sazbě D56d, takže s nízkým tarifem 20 hodin denně.


      tomas_r | 16. 4. 2026

      Pozor na to, že u litinových radiátorů to funguje, dokud je dům zateplený. U nás v nezatepleném
      domě jsme museli jet na 55 °C a SCOP spadl pod 3.


      jirka_k74 | 16. 4. 2026

      @tomas_r Přesně tak, bez zateplení bych do toho nešel.

      '
messages:
- role: user
  content: Ahoj, premyslime ze bychom vymenili plynovej kotel za tepelny cerpadlo. Mame barak z roku 1976,
    kostka, 150 m2, zatepleni 10 cm jsme delali pred 6 lety, okna plastova. Kotli je 18 let. Ma to vubec
    smysl a kolik to tak stoji?
- role: assistant
  content: 'U zatepleného domu se 150 m² a 18 let starým kotlem to smysl dává – kotel se blíží konci životnosti
    a zateplení s novými okny je přesně ten předpoklad, aby čerpadlo jelo efektivně.


    **Orientační čísla:**

    - Tepelné čerpadlo vzduch-voda 8–10 kW s montáží: **250–320 tisíc Kč**, podle značky a toho, jestli
    se mění radiátory.

    - Dotace na vzduch-voda pro rodinný dům: v roce 2025 to bylo 100 tisíc, aktuální výši ověřím.

    - Spotřeba elektřiny u podobného domu: 6–9 MWh ročně na topení i vodu.


    **Klíčové otázky, než půjdeme dál:**

    1. Jakou máte roční spotřebu plynu? Z ní spočítáme tepelné ztráty a velikost čerpadla.

    2. Jaké máte radiátory – litinové, deskové? A kolik stupňů na ně kotel v zimě posílá?

    3. Kde by stála venkovní jednotka a jak daleko je soused?


    Z toho se dá udělat docela přesný odhad.'
- role: user
  content: Plyn mame kolem 17 MWh rocne, ale to je i vareni a ohrev vody. Radiatory jsou deskovy, v obyvaku
    a v loznici vetsi. Kotel na ne v zime posila tak 55-60 stupnu, kdyz je mraz. Venkovni jednotka by
    sla na zahradu za dum, soused je tak 9 metru.
- role: assistant
  content: 'Díky, to jsou dobrá data.


    **Tepelná ztráta:** 17 MWh plynu, z toho vaření ~0,5 MWh a ohřev vody ~3 MWh, zbývá ~13,5 MWh na topení.
    U kotle s účinností ~90 % to dělá zhruba 12 MWh tepla ročně. Pro dům ve vaší oblasti to odpovídá tepelné
    ztrátě kolem **6–7 kW** při -12 °C. Čerpadlo **8 kW** (výkon při -7 °C) je tedy rozumná velikost –
    nabídky na 12 kW by byly předimenzované.


    **Radiátory:** 55–60 °C při mrazu je pro čerpadlo hodně. Čerpadlo jede efektivně do ~45 °C. Dobrá
    zpráva: kotel posílá vysokou teplotu často jen proto, že je tak nastavený. Zkuste letos v zimě postupně
    snižovat teplotu vody a sledovat, jestli je doma pořád teplo. Když 45–50 °C stačí, radiátory měnit
    nemusíte.


    **Hluk:** 9 m od souseda je pohodlná vzdálenost, s běžnou jednotkou noční limit splníte.


    **Spotřeba:** ~12 MWh tepla / SCOP ~3,5–4 = **3–3,5 MWh elektřiny na topení** + ~1 MWh na vodu.'
- role: user
  content: To zni dobre. Muzes mi najit nejaky konkretni modely co by sly? Ideálně neco co se da v CR
    dobre servisovat.
- role: assistant
  content: 'Našel jsem tři modely ve vašem výkonovém pásmu (7–9 kW při -7 °C), které mají v ČR servisní
    síť a jsou na seznamu výrobků pro dotace. Shrnul jsem je do tabulky: {artifact_0}


    - **Aerona T9** – dobrý poměr cena/výkon, 48 dB(A), servis přes síť partnerů po celé ČR.

    - **Thermalis HP10** – nejlevnější, ale nejhlasitější (52 dB(A)) a horší SCOP.

    - **Nordhaus Split 8** – nejúspornější (SCOP 4,9) a nejtišší, ale nejdražší a split vyžaduje chladivové
    potrubí do domu (montáž jen certifikovaným technikem).


    Pro váš dům bych se díval hlavně na Aeronu T9 nebo Nordhaus – rozdíl ve spotřebě mezi SCOP 4,6 a 4,9
    je zhruba 200 kWh ročně, tedy 1 000–1 500 Kč. Cenový rozdíl 33 tisíc se tak vrátí za 20+ let, takže
    Aerona vychází líp, pokud vám nevadí o 3 dB hlasitější jednotka.'
  metadata:
