- role: user
  content: Diky. Klara se boji ze to bude hlucny, mame loznici na zahradu. Je 48 dB hodne?
- role: assistant
  content: 'Obava je pochopitelná, ale 48 dB(A) v katalogu neznamená, že uslyšíte 48 dB v ložnici.


    To číslo je obvykle **akustický výkon** zdroje. Ve skutečnosti, co slyšíte, je **akustický tlak**,
    který klesá se vzdáleností – zhruba o 6 dB s každým zdvojnásobením vzdálenosti. Jednotka s 48 dB(A)
    má v 1 m kolem 40 dB a ve 4 m kolem 28 dB, což je úroveň šepotu. Přes zavřené plastové okno (útlum
    25–30 dB) uvnitř prakticky nic.


    Pro ložnici na zahradu doporučuju:

    - jednotku **nedávat pod okno ložnice** a ne do rohu mezi zdi (zvuk se odráží),

    - antivibrační podložky,

    - tichý noční režim, pokud ho model má.


    Pokud by vás to i tak trápilo, Nordhaus se 45 dB je o 3 dB tišší – to je pro ucho rozdíl zhruba jako
    „o třetinu tišší“.'
  metadata:
    tool_outputs: research({"question":"hluk venkovni jednotky tepelneho cerpadla 48 dB vzdalenost","queries":["hluk
      tepelne cerpadlo limit noc soused"]}) -> {"sources":[{"url":"https://www.teplo-poradna.example.cz/clanky/hluk-venkovni-jednotky","title":"Jak
