summary_covers: 24
summary: 'Uživatel si pořídil hodinky Garmin Fenix a domluvil se s asistentem na správě tréninků **Sila
  A** (pondělí) a **Sila B** (čtvrtek) v Garmin Connectu. Uživatel bude po každém tréninku hlásit výsledky
  a RPE poslední série, načež asistent upraví cíle přímo v hodinkách.


  Po pondělním tréninku **Sila A** uživatel hlásil dřep 4×5 na 80 kg (RPE 7), bench 4×6 na 65 kg (RPE
  8,5) a jednoruční přítahy 3×10 na 24 kg bez problémů. Asistent v hodinkách zvýšil dřep na **82,5 kg**
  a přítah na **26 kg**, bench ponechal na **65 kg**.


  Po čtvrtečním tréninku **Sila B** uživatel hlásil mrtvý tah 4×5 na 105 kg (RPE 7), shyby 5–5–5 a farmer
  carry (40 m s 24 kg) v pořádku. Při tlaku nad hlavu (4×6 na 40 kg) však cítil nebolestivý „divný pocit“
  v pravém rameni. Asistent v hodinkách zvýšil mrtvý tah na **107,5 kg**, u shybů naplánoval na příště
  **6–5–5** a tlak nad hlavu ponechal na **40 kg** s doporučením zaměřit se na techniku a 5minutovou rozcvičku
  (rotace hrudní páteře, wall slides, face pull 2×15). Pokud by se objevila bolest, cvik se vymění za
  landmine press.


  Na závěr uživatel uvedl, že u dřepů mu místo 2,5minutové pauzy lépe vyhovují 3 minuty. Asistent to schválil
  a v hodinkách změnil pauzu po dřepu na **3 minuty (180 s)**, zatímco u benche zůstaly **2 minuty**.


  Po pondělním tréninku **Sila A** (dřep 82,5 kg 4×5 RPE 8, bench 65 kg RPE 7,5, přítahy 26 kg, plank
  45 s) asistent v hodinkách zvýšil dřep na **85 kg** a bench na **67,5 kg**, přítahy nechal na **26 kg**.


  Uživatel (74 kg, sedavé zaměstnání, rostoucí břicho) se ptal na stravu. Asistent doporučil mírný kalorický
  přebytek (+200–300 kcal), 130–150 g bílkovin denně, nárůst váhy max. 0,25 kg/týden, 7–8 tisíc kroků,
  7+ hodin spánku a sledování obvodu pasu.


  Po čtvrteční **Sile B** (mrtvý tah 107,5 kg RPE 7,5, shyby 6–5–5, carry v pořádku) uživatel hlásil nepohodlí
  v rameni při tlaku nad hlavu (40 kg). Asistent v hodinkách zvedl mrtvý tah na **110 kg**, tlak ponechal
  na **40 kg** s doporučením jet jen 3 série, případně přejít na **landmine press**, a důsledně zařadit
  rozcvičku ramen. Na žádost uživatele pak detailně popsal techniku cviků **face pull** (2×15) a **wall
  slides** (2×10).


  Asistent schválil a do preferencí zapsal sobotní 30minutový kettlebell (swingy 16 kg 5–8×10–15, TGU
  3–5/strana) bez zápisu do hodinek.


  K dotazu na kreatin (otec měl ledvinové kameny) asistent doporučil 3–5 g denně, ale až po krevních testech
  (kreatinin, eGFR) u praktika, s čímž uživatel souhlasil.


  Kvůli rodinné situaci příští čtvrtek asistent doporučil přesunout Silu B na **pátek** (a vynechat či
  odlehčit sobotní kettlebell), případně na **sobotu** s posunem Sily A na úterý.'
