- role: assistant
  content: '10 dní bez činek tě o sílu nepřipraví – síla se drží několik týdnů i při výrazně sníženém
    tréninku. Klidně to ber i jako vítaný deload. Abys ale udržel návyky a rameno:


    **2–3× za těch 10 dní, 30 minut:**

    - Bulharské dřepy (zadní noha na židli) 3×10–12 na nohu

    - Kliky s nohama na vyvýšené podložce 3× do RPE 8

    - Hip thrust na jedné noze 3×12

    - Přítahy s gumou (nebo stolní přítahy pod stolem) 3×12

    - Face pull a rotace s gumou 2×15 – pro rameno

    - Plank 3×45 s


    A hlavně hodně choď – na horách to půjde samo. Po návratu dáme první týden na 90 % vah a pak navážeme.'
