- role: assistant
  content: 'Dobře, že jsi šel – lehký trénink po špatné noci je přesně to, co tělo zvládne a pomůže mu.


    Opasek: u tvých vah (dřep 85, mrtvý tah 110) to **zatím není nutnost**, ale ani chyba. Opasek nepodpírá
    záda, dává břichu něco, do čeho tlačit – pomáhá ti udržet bracing pod těžkou vahou.


    Můj návrh:

    - Rozcvičkové a lehčí série **bez opasku**, ať se tvoje vlastní zpevnění dál učí.

