      "Spremljajte najnovejše informacije o delu SOS, aktualni
      zakonodaji, razpisih, dogodkih, dobrih praksah občin ter pomembnih domačih in mednarodnih pobudah
      za lokalne skupnosti.


      Za občine smo pripravili aplikacijo za vizualizacijo občinskih podatkov, ki omogoča primerjavo in
      pregled prihodkov ter odhodkov občin. Podatke lahko analizirate po posameznih področjih in spremljate
      trende skozi čas.


      SOS povezuje in zastopa slovenske občine ter spodbuja sodelovanje, izmenjavo dobrih praks in skupno
      reševanje izzivov lokalne samouprave.


      Primerjajte ključne kazalnike slovenskih občin na pregleden in interaktiven način. Dostopajte do
      podatkov, analiz in grafičnih prikazov za lažje spremljanje razvoja lokalnih skupnosti.


      SOS občinam nudi strokovno podporo pri pravnih, kadrovskih in organizacijskih vprašanjih ter izvaja
      skupna javna naročila in storitve zunanjega pooblaščenca za varstvo osebnih podatkov (DPO).


      Spodbujamo razvoj kakovostnih lokalnih okolij s programi in priznanji, kot so Mladim prijazna občina,
      Branju prijazna občina in Občina brez plastike za enkratno uporabo na dogodkih.


      Postanete član družine občin, ki presega meje Slovenije


      Aktivno sodelujete in soodločate o prihodnosti občin v Sloveniji in regiji


      Pridobite zanesljivega partnerja, ki vam pomaga pri delovanju vaše občine


      Dostopate do nenehno ažurirane baze znanja


      Pridobite nasvet izkušenih strokovnjakov, si zagotovite odgovore na strokovna vprašanja, ki se nanašajo
      na delovanje vaše občine


      Dobite pomoč pri pripravi vaših pravnih aktov, s kadrovskega, organizacijskega ali drugega področja


      Brezplačno sodelujete na dogodkih in izobraževanjih SOS ali se jih udeležite po nižjih, članskih
      cenah


      Sodelujete v skupnih javnih naročilih, ki zagotavljajo nižje cene in administrativno razbremenitev
      vaše občinske uprave


      Volite in ste izvoljeni v organe SOS ter s tem dajete pobude in predloge v zvezi z delovanjem SOS


      Ste redno obveščeni o novostih in dogodkih SOS


      Aktivo sodelujete v mrežah, komisijah, delovnih skupinah in področnih strokovnih dialogih SOS


      Se udejstvujete kot predstavnik občin članic SOS v mednarodnih institucijah in mrežah, katerih članica
      je Skupnost občin Slovenije (Odbor Regij, Svet Evrope, Svet Evropskih občin in regij, NALAS, Zveza
      Alpe-Jadran)


      V času podnebnih sprememb, vročinskih valov, življenjske ogroženosti narave in človekovega zdravja
      ter izgubljanja biotske pestrosti so mesta in lokalne skupnosti pred vse večjimi razvojnimi izzivi.
      Ob pritiskih na javni in odprti prostor postaja ozelenjevanje urbanega okolja ena ključnih poti
      do bolj odpornih, zdravih in kakovostnih mest. Konferenca...


      Lokalne volitve in začetek novega mandata občinskih organov odpirajo tudi številna kadrovska in
