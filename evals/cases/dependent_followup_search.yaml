    https://www.letour.fr/en/news/2026/van-der-poel-and-pogacar-illuminate-paris/1356643:
      "**The final
      stage of the Tour de France 2026 delivered fireworks and crowned champions who already occupy a
      very special place in the history of the event. Clad in yellow as he rode towards a record-tying
      fifth overall triumph, Tadej Pogacar (UAE Emirates XRG) indulged himself with a flurry of attacks
      on the Côte de la Butte Montmartre. After the third and final ascent, only Mathieu Van der Poel
      (Alpecin-Premier Tech) was with him at the front. The duo collaborated to fend off the bunch in
      a most thrilling finale. As Pogacar faltered, Van der Poel covered the last 600 metres alone and
      resisted with a mere margin the sprinters, led by his teammate Jasper Philipsen at the line. Third
      on the day, Mads Pedersen (Lidl-Trek) is the first Danish conqueror of the green jersey, and the
      sixth rider to win the points standings in all three Grand Tours. Richard Carapaz (EF Education-EasyPost)
      takes both the polka dot jersey and the Super Combativity award, as he did in 2024. Third overall,
      Isaac del Toro (UAE Emirates XRG) also takes home the white jersey as the winner of the young rider
      standings. The roll of honour also features the USA national champion Quinn Simmons (Lidl-Trek),
      named the best teammate of this edition.**


      After a presentation in Thoiry, the riders head to Paris and the Champs-Élysées to start the final
      stage of the Tour de France 2026. The route was adapted due to the exceptional circumstances currently
      affecting France. The race is entirely held in Paris, with seven laps on the Champs-Élysées circuit
      and then three laps on the loop featuring the Côte de la Butte Montmartre for a total distance of
      88.7 kilometres. After more than 3,000 kilometres of racing since the Grand Départ in Barcelona,
      this marks the 116th stage finish in Paris, and the 51st on the Champs-Élysées.


      **First attacks**


      The first few laps serve as a celebration of the accomplishments of the riders who survived three
      weeks of battle. The action really kicks off when Baptiste Veistroffer (Lotto Intermarché) attacks
      75 kilometres from the finish. The French baroudeur still has a bit of energy left but his several
      moves are covered by the fast-paced bunch.


      As the riders enter the final three laps, the times for the GC are taken and the peloton head to
      the Côte de la Butte Montmartre (1 km at 6.5%). Xabier Mikel Azparren (Pinarello Q36.5) and Thibault
      Guernalec (Total Energies) are the first to tackle it. But Mads Pedersen (Lidl-Trek) unleashes his
      power and leads the way to the summit.


      **Pogacar ups the ante**


      The differences after this first ascent are minimal, and around 100 riders get back together for
      the penultimate lap. Onto the second ascent up the Côte de la Butte Montmartre, UAE Emirates XRG
      up the ante and Tadej Pogacar (UAE Emirates XRG) attacks.


      Only Mathieu Van der Poel (Alpecin-Premier Tech) can follow the Maillot Jaune all the way to the
      summit. Remco Evenepoel (Red Bull-Bora-Hansgrohe) rapidly closes the gap. Then Mads Pedersen (Lidl-Trek)
      joins them 23 kilometres from the finish. The peloton trail by 15 seconds but Decathlon CMA CGM
      react. Back together with 19 kilometres to go.


      **Van der Poel takes it home**


      Van der Poel puts in a strong attack on the final ascent of the Tour de France 2026. Pogacar follows
      him. And the duo open a gap of up 15 seconds on a same group of chasers, with the peloton right
      behind them. Decathlon CMA CGM are still up there, as well as NSN and Cofidis.


      The gap decreases: 10 seconds with 3 km to go, 5 when they enter the final kilometre… As Pogacar
      falter, Van der Poel accelerates with 600 metres to go. Sprinters swoop on him but the Flying Dutchman
      narrowly edge them. His teammate Philipsen finishes second ahead of Mads Pedersen (Lidl-Trek).


      Eventually 30th at the finish, Pogacar secures his fifth overall victory after the 2020, 2021, 2024,
      and 2025 editions. He ties the record set by Jacques Anquetil, Eddy Merckx, Bernard Hinault, and
      Miguel Indurain."
