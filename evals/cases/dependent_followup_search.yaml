    https://www.kam.si/obcina-komenda/: "Published: 2006-10-23


      Vsebina:


      **Pokrajina:** Gorenjska


      **Statistična regija:** Osrednjeslovenska


      - **Prebivalci:** 6800 (1. 1. 2026, SURS)

      - **Površina:** 24 km²

      - **Število naselij:** 15

      - **Sedež:** Komenda


      Občina Komenda leži na ravnini severno od glavne ceste Kranj-Mengeš, med Kamnikom in Vodicami. Meri
      24 kvadratnih kilometrov, v 15 naseljih pa je 1. 1. 2026 živelo 6800 ljudi. Središče Komenda ima
      1026 prebivalcev, največje naselje pa so Moste. Občina je nastala leta 1994 z izločitvijo iz občine
      Kamnik, število prebivalcev pa v zadnjih letih hitro raste. Med naselji je tudi poslovna cona Žeje
      brez stalnih prebivalcev.


      Komenda je staro cerkveno središče, saj se župnik prafare sv. Petra omenja že leta 1147. Ime kraja
      pomeni posest viteškega reda, malteški vitezi so tu imeli posest vse do 19. stoletja. Njihov grb
      krasi gotsko znamenje iz leta 1510 ob robu pokopališča. Sedanjo baročno cerkev sv. Petra so zgradili
      v letih od 1726 do 1729, po potresu leta 1895 pa so jo obnovili in povečali. Glavni oltar in prižnico
      je zasnoval slikar Franc Jelovšek.


      Peter Pavel Glavar, nezakonski sin malteškega komendatorja, je postal oskrbnik in zakupnik viteškega
      posestva, leta 1751 pa župnik v Komendi. V beneficiatski hiši je hranil knjižnico s približno 2000
      knjigami in ustanovil šolo za nadarjene revne učence. Prevedel in dopolnil je Janšev Pogovor o čebelnih
      rojih. Premoženje je zapustil revnim in bolnim, iz tega denarja so leta 1804 v Komendi zgradili
      Glavarjev špital.


      Malteški vitezi so v Komendi in okolici pospeševali konjerejo, konjske dirke pa imajo tu tradicijo
      že iz Valvasorjevih časov. Ohranila se je do danes s konjeniškim klubom in hipodromom. Valvasor
      omenja tudi konjsko procesijo, ki je potekala po vsej župniji. V Mostah, skozi katere teče Tunjščica,
      so bila značilna obrt ščetarstvo in slamnikarstvo. S Komendo je povezanih več znanih osebnosti,
      med njimi pisatelj Ivan Sivec in kolesar Tadej Pogačar.


      Breg pri Komendi, Gmajnica, Gora pri Komendi, Klanec, Komenda, Komendska Dobrava, Križ, Mlaka, Moste,
      Nasovče, Podboršt pri Komendi, Potok pri Komendi, Suhadole, Žeje pri Komendi, Poslovna cona Žeje
      pri Komendi.


      **Zunanje povezave:**


      Uradna občinska stran: www.komenda.si


