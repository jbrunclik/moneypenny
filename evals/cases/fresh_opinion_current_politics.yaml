      "Published: 2026-02-03


      Odhodlání, potlesky ve stoje a sněhobílé košile a později černá trička s logem hnutí, tak vypadala
      atmosféra ve smíchovském hubu Next Zone. Přišly sem klíčové osobnosti Kubova týmu. Mezi nimi i jeho
      choť, rodačka ze slovenského Bardejova. „Manžela plně podporuji, jeho projektu a politické vizi
      věřím. Sama se stanu členkou hnutí, ale větší angažmá neplánuji, máme doma malé dítě, takže to je
      priorita,“ řekla Deníku.cz Denisa Kubová.


      Nebrání se ovšem ani představě budoucího přesunu do Prahy, pokud by to manželova kariéra vyžadovala.
      Na dotaz, zda by chtěl být premiérem, **Martin Kuba** odpověděl: „Když jdete do politiky, takovou
      ambici musíte mít, ale není to cíl, jen nástroj, jak mít vliv na dobrou správu země.”


      Organizační strukturu a program Našeho Česka Kuba v úterý neprozradil. „Jsme na samém začátku, do
      sněmovních voleb zbývají tři a půl roku, nechte nám čas vše promyslet a připravit reálné koncepty,”
      sdělil. Obsah se bude utvářet postupně na programových konferencích po celé zemi. „Nejde nám o počet
      členů, ale o podporu osobností, které v dané obci, městě nebo kraji mají respekt a dívají se na
      svět jako my,” dodal.


      ## Komunální i senátní volby


      Naše Česko se letos v říjnu zúčastní komunálních a senátních voleb. „Především to bude v Jihočeském
      kraji, ale nejen tam, byť třeba o pražský magistrát skoro určitě usilovat nebudeme,” upřesnil. O
      mandát v horní komoře v jeho barvách zabojuje **Tomáš Fiala**, v jednání je kandidatura královéhradeckého
      senátora **Jana Holáska**.


      Kuba odmítal otázky na případné koaliční partnery nebo spolupráci s ANO. „Musíme mít dobrý program,
      s ním oslovit voliče, uspět ve volbách. Teprve pak budou na místě otázky, s kým je možné jít do
      vlády. Znovu opakuji, že v Jihočeském kraji jsem s ANO do koalice nešel,” konstatoval.


      V aktuálním rozhovoru pro Deník.cz pak rozvinul svoji představu o politické práci a komentoval i
      současné dění."
