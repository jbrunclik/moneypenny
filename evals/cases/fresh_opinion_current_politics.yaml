      napříč politickým spektrem. V minulém volebním období vedl sněmovní výbor pro vzdělávání, kulturu,
      mládež a tělovýchovu a stejnou pozici by měl zastávat i nyní.


      Na sjezdu mimo jiné uvedl, že chce TOP 09 připravit na návrat do vlády a posílit její odborné zázemí
      i zapojení mladých lidí. Zdůraznil, že strana má být smysluplnou opozicí s nabídkou alternativy,
      která se opírá o proevropské a pravicové hodnoty. Zmínil také, že považuje za důležité nadále podporovat Ukrajinu.
      *„Chtěl bych být předsedou TOP 09, která vyniká odborným přístupem, směřuje k vyšším volebním ziskům
      – i v těch nejbližších volbách – a dává prostor osobnostem i mladým lidem z celé země,“* řekl **Havel**
      ve svém projevu, ve kterém vznikající vládu hnutí ANO, SPD a Motoristů označil za „koalici prospěchářství“.


      Na dnešním sněmu strany v Praze získal Havel podporu 120 ze 171 hlasujících delegátů, tedy mírně
      přes 70 procent. Protikandidáta neměl, bývalý předseda TOP 09 Jiří Pospíšil se nominace z regionů
      vzdal. Delegáti ho nakonec zvolili prvním místopředsedou.


      Nový předseda TOP 09 má k Hradci Králové dlouhodobě silný vztah. Narodil se zde, maturoval na Gymnáziu
      J. K. Tyla a vystudoval Univerzitu Hradec Králové. Jako učitel působil nejprve na Biskupském gymnáziu
      a ve svých třiceti letech se stal ředitelem Gymnázia J. K. Tyla. Od roku 2021 je poslancem, v roce
      2023 se stal místopředsedou TOP 09 a před rokem byl zvolen také do krajského zastupitelstva. Osmatřicetiletý
      politik s manželkou vychovává pět dětí, ve volném čase se věnuje skautingu a hře na varhany.


      Ještě před svým zvolením do čela TOP 09 byl **Matěj Ondřej Havel** hostem našeho podcastu. Pokud
      se tedy o jeho názorech a plánech chcete dozvědět víc, poslechněte si rozhovor na našem webu, YouTube
      nebo v aplikaci Spotify.


      Zdroj: salonkyhk.cz, Tomáš Kulhánek"
    https://www.top09.cz/co-delame/medialni-vystupy/novy-predseda-top-09-musime-byt-schopni-existovat-samostatne-slouceni-s-ods-neni-na-stole-32672.html:
      "Published: 2026-10-19


      # Nový předseda TOP 09: Musíme být schopni existovat samostatně, sloučení s ODS není na stole


      Nový předseda TOP 09 Matěj Ondřej Havel chce dál sázet na témata národní bezpečnosti, prozápadního
      ukotvení a zodpovědného hospodaření. Za cíl si dává, aby strana byla schopná existovat samostatně
      i mimo koalici Spolu. Slučování s ODS proto podle něj není na stole. Novinkám to řekl v rozhovoru
      krátce po jeho sobotním zvolení do čela strany.


      **Jak vnímáte, že jste neměl žádného protikandidáta? Co to vypovídá o stavu TOP 09?**


      Všude jsem říkal už před tou volbou, že si představuji vedení TOP 09 jako týmovou spolupráci. Asi
      to delegáti vyslyšeli a asi to nějak takhle respektovali.


      **Není to signál, že máte personální nouzi? Proč se do toho některým lidem nechtělo?**


      Je to velmi zodpovědná funkce. Když vystoupáte nahoru, tak tam hodně fouká. Určitě je to tak, že
      některým lidem se do toho nechce a já to nechci zlehčovat. Delegáti, kraje, všichni spolu mluví
      dny a týdny před sněmem, tak to takhle vyhodnotili, že jim tahle cesta dává smysl. Znovu říkám,
      zvu ke spolupráci všechny.


      **Jaké měřitelné cíle si dáváte? Podle čeho vás můžeme za pár let vyhodnotit jako úspěšného nebo
      neúspěšného předsedu?**


      Chci, aby TOP 09 byla stabilně v preferencích volitelná do Sněmovny nad pěti procenty. Máme teď
      velký úkol, a to jsou senátní volby. Budeme stavět vlastní kandidáty, obhajující senátory, budeme
      pro ně chtít dohodnout podporu a taky budeme ochotni dohodnout se na podpoře pro jiné demokratické
      kandidáty. Chceme zabránit tomu, aby do Senátu přišla nová vlna populistů, extremistů a dezinformátorů.


      Chtěl bych, abychom rozhodně obhájili počet senátorů, který máme teď. Mohli bychom nyní postavit
      samostatný senátorský klub a chtěl bych, abychom tuto možnost měli do budoucna.


      V komunálních volbách pro nás bude úkolem, a to si taky dávám za svůj cíl, abychom přitáhli nové
      osobnosti na kandidátky. V komunálu to je o osobnostech mnohem víc než o stranách a značkách.


      A ještě mám jeden takový cíl, chci se mnohem víc, než se mi to dařilo v minulém období, kdy jsem
      dělal místopředsedu, věnovat členské základně a objíždět kraje. Seděli jsme v obstruované Sněmovně,
      nemohli jsme pryč. Když by teď byla někdy příležitost a doufám, že bude častěji, protože my nebudeme
      destrukční opozicí, tak se chci věnovat i svým straníkům v regionech.


      **Takže chcete, aby členů TOP 09 přibývalo?**


      Jednoznačně chci, aby členů TOP 09 přibývalo. Už situace po prohraných volbách vedla k tomu, že
      nám se hlásí lidé do strany, máme zvýšený zájem o členství. Na tom budeme pracovat a to chci podpořit.
      Pozvat nové lidi do TOP 09.


      **Když mluvíte o pěti procentech, o volitelnosti TOP 09, jak chcete změnit fakt, že se pohybujete
      přinejlepším na její hranici?**


      Každá poctivá strana oslovuje své voliče pravdivou komunikací. Je to někdy složitější a jsem z toho
      smutný, když vidím, kolik voličů dokáže někdo přilákat populismem a extremismem nebo dezinformacemi.
      My budeme komunikovat vždy pravdivě a nabízet taková řešení. Musíme identifikovat z našich témat
      ta zásadní.


      Já si myslím, že to je jednoznačně geopolitická bezpečnost, Západ, euro. Je to vzdělaná společnost
      do budoucna, rozpočtová odpovědnost a propodnikatelské prostředí. To jsou věci, o kterých jsme přesvědčeni,
      že vedou k blahobytu a bezpečné a prosperující společnosti, ve které má každý rovnost šancí. A tato
      témata se budeme muset snažit srozumitelně a jazykem moderního člověka komunikovat.


      **Nejsou to příliš velká témata? Po volbách zaznívalo, že koalice Spolu nedosáhla dobrého výsledku,
      protože jste se zaměřili příliš na téma Západ versus Východ.**


      To si někdo může myslet, volby ještě vyhodnocujeme. TOP 09 má už dávno v programu recepty na veškeré
      oblasti našeho veřejného života. Ale jsou témata zásadní a jsou témata méně důležitá. A ta zásadní
      témata, jako je třeba národní bezpečnost, rozpočtová odpovědnost, že u nás příliš málo lidí podniká.
      To jsou věci, které jsou velké a které, pokud by nefungo"
    https://www.top09.cz/o-nas/celostatni-snemy/snem-2025/vedeni-top-09-omladlo-predsedou-je-matej-ondrej-havel-32664.html:
      "#
      Vedení TOP 09 omládlo. Předsedou je Matěj Ondřej Havel


      ## Usnesení 9. celostátního sněmu TOP 09


      **TOP 09 povede v příštích dvou letech dosavadní místopředseda strany, poslanec Matěj Ondřej Havel.
      Do funkce 1. místopředsedy byl zvolen Jiří Pospíšil. Dalšími místopředsedy se stali Ondřej Müller,
      Lukáš Otys, Kateřina Pastorková a Marek Ženíšek. Své nové vedení si strana určila na 9. volebním
      sněmu v pražském hotelu Don Giovanni.**


      **Matěj Ondřej Havel** silný mandát 120 ze 171 hlasů. V kandidátském projevu apeloval, aby se nové
      předsednictvo soustředilo na posílení významu TOP 09 jako strany výrazných odborníků v otázkách
      zdravých veřejných financí, jednoznačně formulované zahraniční politiky, demytizované environmentální
      politiky, promyšlené vzdělávací politiky a dalších.


      Varoval také před rostoucími snahami podkopávat demokratické principy země a vyzval k důrazné obraně,
      třeba i aktivizací občanské společnosti: *„Brzy nejspíš budeme čelit mnohem promyšlenější snaze
      oslabit svobodu slova a svobodné šíření informací než dříve, a to snahou podmanit si a v případě
      potřeby i omezit nezávislá, veřejnoprávní média.“*


      *„Opět se objevuje velká snaha přesvědčit lidi, aby se nestarali o správu věcí veřejných. Lhostejnost
      a nezájem o veřejné dění, o kroky vlády, Parlamentu a podobně jsou dobrým podhoubím pro klid na
      práci při demontáži svobody salámovou metodou. To bude riskantní pro celou zemi a naše úloha v Parlamentu
      je proto nezastupitelná,“* pronesl dále **Havel**. *„TOP 09 v minulosti mnohokrát prokázala, že
      dokáže být v takových bouřích pevným a viditelným hodnotovým majákem, a bude to muset prokázat i
      nyní.“*



      Poslanec a bývalý předseda strany **Jiří Pospíšil**, v souladu se svými dřívějšími prohlášeními,
      nominaci na předsedu TOP 09 z osobních důvodů odmítl. V průběhu sněmu byl proto vyzván ke kandidatuře
      na 1. místopředsedu, kterou přijal a na jejímž základě byl do funkce následně i zvolen 110 hlasy.


      Také on v kandidátském projevu apeloval k aktivní práci v kontextu povolebního vývoje politické
      situace v zemi. *„Vládnou ti, kteří zpochybňují polistopadový vývoj, nadržují putinovskému Rusku,“*
      uvedl. *„Nemáme prostor lízat si rány z prohraných voleb.“*


      **Ondřej Müller**, krajský manažer TOP 09 a pardubický zastupitel, **Lukáš Otys**, krajský předseda
      TOP 09 v Karlovarském kraji a někdejší místopředseda, a **Kateřina Pastorková**. Mandát obhájil
      ministr pro vědu, výzkum a inovace a také jeden ze zakládajících členů strany **Marek Ženíšek**.


      Sněm byl rovněž oficiálním rozloučením s dosavadní předsedkyní **Markétou Pekarovou Adamovou**,
      která stranu vedla uplynulých 6 let a znovu již nekandidovala.


      *„Nevracejte se k minulosti jako k všespásnému léku, veškeré návraty ke kořenům jsou jen brnkání
      na strunu nostalgie. Dívejte se mnohem víc dopředu,“* doporučila straníkům na úvod sněmu **Pekarová
      Adamová**. *„To neznamená, že se z minulosti nepoučíme, nebo že bychom ji snad ignorovali. Svět
      kolem nás se ale velmi rychle mění a my nesmíme ustrnout.“*


      ## Nové vedení TOP 09


      ### Předseda


      Matěj Ondřej Havel


      ### První místopředseda:


      Jiří Pospíšil


      ### Řadoví místopředsedové:


      Ondřej Müller


      Lukáš Otys


      Kateřina Pastorková


      Marek Ženíšek


      ## Usnesení 9. celostátního sněmu TOP 09


      ### 1. Celostátní sněm vzal na vědomí:


      Zprávy předsednictva, výkonného výboru, poslaneckého klubu, senátorů, europoslanců, smírčího výboru,
      celostátní revizní komise a zprávu o hospodaření.


      ### 2. Volby


      Celostátní sněm:


      2.1. Zvolil předsedou Matěje Ondřeje Havla.


      2.2. Zvolil 1. místopředsedou Jiřího Pospíšila.


      2.3. Schválil počet dalších místopředsedů, a to čtyři.


      2.4. Zvolil místopředsedy, kterými se stali: Ondřej Müller, Lukáš Otys, Kateřina Pastorková a Marek
      Ženíšek.


      2.5. Schválil počet dalších členů předsednictva, a to devět.


      2.6. Zvolil členy předsednictva, kterými jsou: Tomáš Aberl, Martin Horák, Jakub Lepš, Martin Leška,
      Martin Neřád, Herbert Pavera, Jiří Slavík, Vlastimil Válek a Radka Vaňousová.


      2.7. Zvolil dalších patnáct členů výkon"
