    https://ct24.ceskatelevize.cz/clanek/domaci/ods-si-zvoli-nove-vedeni-do-cela-strany-chteji-kupka-a-ivan-369318:
      "Published:
      2026-01-17


      Občanští demokraté v sobotu na kongresu v Praze zvolili novým lídrem strany dosavadního místopředsedu
      Martina Kupku, po dvanácti letech vystřídal v čele strany expremiéra Petra Fialu. Neuspěl Kupkův
      protikandidát, kterým byl místostarosta městského obvodu Ostrava-Jih Radim Ivan. Strana si v sobotu
      zvolila také prvního místopředsedu, kterým se stal starosta Prahy 9 Tomáš Portlík.


      Kupku, který měl jedenáct krajských nominací, před kongresem podpořil i Fiala, jemuž nový předseda
      strany bezprostředně po zvolení poděkoval za práci, kterou v čele ODS odvedl. Delegáti odevzdali
      při volbě předsedy 508 platných hlasů, z nichž 327 získal právě Kupka. Ivana podpořilo 138 hlasujících.
      „Je to jasné slovo kongresu: Ano, to je předseda, kterému chceme věřit, který povede ODS dál,“ řekl
      Kupka k síle svého mandátu po vyhlášení výsledků. Fiala novému předsedovi pogratuloval. „Věřím,
      že se ti podaří naplnit tvé vize a posunout stranu kupředu. ODS bude v dobrých rukou. Hodně štěstí,“
      napsal.


      Kupka předpokládá, že bude intenzivně spolupracovat právě s Fialou, aby spolu ukazovali směr pro
      českou pravici. Před hlasováním o dalším složení předsednictva Kupka nechtěl nikoho jmenovat jako
      svého favorita. Sestava nominací, jak je určily regionální sněmy, je podle něj silná a je připravený
      pracovat s týmem, který kongres vybere.


      ODS se podle Kupky nyní musí zaměřit na práci v opozici. „Je na nás, abychom posílili značku, nutně
      budeme spolupracovat s dalšími stranami v opozici, je to ale čas, abychom představili naše reformy,“
      uvedl k pokračování koalice SPOLU, kterou tvoří občanští demokraté, lidovci a TOP 09. ODS chce Kupka
      prezentovat jako srozumitelnou a jasnou kotvu.


      Změny s velkou pravděpodobností nastanou ve vedení poslaneckého klubu ODS, jehož předsedou je nyní
      Marek Benda. „Vedení se určitě převolí, objeví se tam určitě noví lidé. Kdy by se to jednání poslaneckého
      klubu mělo odehrát, to teď nevím, ale bude to v poměrně krátké době po kongresu,“ potvrdil Kupka
      záměr, o kterém poslanecká frakce informovala už v době, kdy se po volbách formovala.


      Kupkův protikandidát ve volbě předsedy strany Ivan poděkoval za podporu a oznámil, že bude pokračovat
      v práci názorové platformy ODS Česko plus. Nevyloučil, že se o vedení strany bude ucházet i za dva
      roky.


      ## Nominační projevy kandidátů na předsedu


      Ještě před volbou předsedy vystoupili oba kandidáti s nominačními projevy. Jako první hovořil Ivan.
      „Abychom se posunuli dopředu a mohli zase růst a vítězit, musíme si umět pojmenovat problém,“ řekl
      na úvod kandidát, podle něhož ODS „neroste a nevítězí“. „Já vám slibuji, že pokud se stanu předsedou,
      tak vám budu říkat vždycky pravdu, ne po dvanácti letech,“ prohlásil Ivan v reakci na bilanční projev
      Fialy, který se několik desítek minut předtím loučil po dvanácti letech jako předseda. „Voliči nám
      aktuálně nevěří, že máme vizi pro budoucí generace,“ dodal. Končící vedení podle Ivana podřídilo
      vše strachu, že vládu SPOLU nedotáhne do konce. Kritizoval například zvýšení daní.


      ODS se podle Ivana přestala zabývat přípravou reforem, stále se koncentruje na vítězství v jednotlivých
      volbách, nikoli na vzdálenější budoucnost. „Možná se máme dobře, ale jde o to, aby tu žili spokojení
      lidé za deset, dvacet let, abychom zvládli transformaci země, až budou odcházet do důchodu Husákovy
      děti,“ řekl k výkonu bývalé vlády. „Sedli jsme si. Hráli jsme na pohodu. Pojďme se zvednout, být
      aktivní,“ vyzval s tím, že jako mladý nabízí aktivitu a změnu.


      Voliče by ODS podle Ivana měla přestat poučovat, naopak by podle něj měla víc dát na konstruktivní
      zpětnou vazbu, a to například od podnikatelů. To samé má platit ve vnitřním životě strany, míní.
      Proti Fialovi, který varoval své spolustraníky před praním špinavého prádla na veřejnosti, se vyslovil,
      když označil za správné vyříkat si spory na sociálních sítích.


      Kupka v kandidátském projevu prohlásil, že v ODS „jsme přirozeným domovem pro liberály, kteří chtějí
      otevřenou ekonomiku, inovace a svobodu jednotl"
