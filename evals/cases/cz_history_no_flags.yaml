      "Svůj netypický tvar získal Radobýl vlivem těžby
      kamene. Západní stěna je dnes odtěžena a v oblasti někdejšího kamenolomu jsou vidět pozoruhodné
      čedičové sloupce. Vrch Radobýl však nebyl v minulosti využíván jen pro těžbu kamenu. V oblasti kolem
      Radobýlu byly totiž už ve 14. století vybudovány vinice. Král Karel IV. totiž v roce 1359 věnoval
      městu Litoměřice vrch Radobýl právě za účelem pěstování vinné révy. Víno se pod Radobýlem pěstuje
      dodnes. Vinice, u kterých se nyní nacházíte, patří vinařství Víno Hrabkovský a spadají pod vinařskou
      obec Žalhostice. Vína z oblasti kolem Radobýlu jsou vlivem netypického složení půdy unikátní. Víno
      Hrabskovský nabízí jak sudová, tak lahvová vína, a to od vín jakostních až po výběry z hroznů. Mezi
      odrůdami jsou zastoupeny jak tradiční Müller Thurgau a Ryzlink rýnský, tak také Chardonnay, Hibernal
      a Muškát moravský (tzv. MOPR). Z modrých odrůd jsou zde pěstovány např. Dornfelder, Modrý Portugal
      nebo Svatovavřinecké.


      Relativně nedávno (v roce 2012) vzniklo na úpatí Radobýlu další a zatím poměrně malé vinařství,
      které nese název Vinařství pod Radobýlem. Toho vinařství disponuje tradičními odrůdami, jako jsou
      Ryzlink rýnský či Rulandské bílé, dále má ale také méně tradiční odrůdy pro tuto oblast, jako je
      např. Fratava. Třetím vinařstvím v těsné blízkosti Radobýlu je vinařství Milan a Miroslav Singer.
      Tito malovinaři obhospodařují menší vinice v trati Nad Školou a v trati Pod Radobýlem. Produkce
      vinařství je velmi malá (necelý 1 hl za rok), a tak jsou vína určená jen pro rodinu a blízké či
      pro speciální příležitosti, jako jsou výstavy a košty.


      ## Radobýl


      Radobýl je mimo vinic také zajímavým turistickým cílem. Na samotný vrchol vede žlutá turistická
      stezka a to buď ze Žalhostic, nebo z Litoměřic. Vrcholná část Radobýlu je místem, ze kterého je
      dobrý rozhled do širokého okolí, a to na všechny světové strany. Je možné spatřit většinu Českého
      středohoří, města Litoměřice a Lovosice, bájnou horu Říp nebo také Píšťanské (Žernosecké) jezero.
      Radobýl je také atraktivní z hlediska fauny a flóry. Vzhledem k výskytu chráněných rostlin (jako
      je např. kozinec bezlodyžný, bělozářka liliovitá nebo divizna brunátná) a živočichů (např. motýlů)
      byla zdejší krajina již od roku 1966 chráněna. Od roku 1992 je pak Radobýl přírodní památkou. Též
      z geologického hlediska je Radobýl zajímavý. Skalní stěny bývalého lomu jsou tvořeny pozoruhodnou
      sloupcovitou odlučností čediče. Zajímavostí také je, že pod vrcholem Radobýl se v minulosti nacházela
      podzemní nacistická továrna Richard.


      ## KUDY DÁL?


      Dalším zastavením Litoměřické vinařské stezky jsou vinice Klášterních vinných sklepů Litoměřice
      mezi vinařskými obcemi Žalhostice a Velké Žernoseky. Pokračujte tedy dále po stezce, a těšte se
      na návštěvu Velkých Žernosek.


      Pokud jste právě vystoupali směrem od Žalhostic, můžete pokračovat na samotný vrchol Radobýlu a
      dále do Litoměřic, kde vás Litoměřická vinařská stezka zavede do litoměřického hradu s expozicí
      o českém vinařství.


      ## Tipy na turistické cíle v okolí


      - **Naučná stezka Hlinná - Kamýk**

      - **Bílé stráně**

      - **Katedrála sv. Štěpána na Dómském náměstí v Litoměřicích**"
    https://www.novinky.cz/clanek/cestovani-tipy-na-vylety-radobyl-kopec-nad-litomericemi-ze-ktereho-si-karel-hynek-macha-dobehl-pro-smrt-40377750:
      "Published: 2021-11-12


      ###### Článek


      Najednou ve městě pod sebou spatří požár. Rozbíhá se, aby pomohl hasit. Běh se mu stává osudným.
      Uřícený, z jedné strany prudký žár ohně, z druhé promočený od stříkající vody. Má žízeň, pije, a
      to se mu zřejmě stává osudným (voda mohla být zdrojem jeho infekčního onemocnění). Dál dochází do
      kanceláře, ale je mu velmi špatně... Vyčerpaný Mácha 6. listopadu umírá.


      ## Pravděpodobná příčina úmrtí


      V úmrtním listě je příčina uvedena jako Brechdurchfall, tedy cholerina, lehčí forma cholery. Ta
      tehdy řádila i v Praze, kde byl básník krátce před svým skonem, aby viděl svého syna. Možná ovšem
      byla zdrojem nákazy zmíněná voda na hašení.


      ## Po básníkovi ani stopa


      Na vrcholu vulkanického čedičového kopce (399 m n. m.), který vznikl ve třetihorách, se tyčí velký
      kovový kříž. Předchozí v roce 1992 zničil blesk. Od kříže, v pořadí už osmého, je vidět zrovna jako
      v Máchových dobách kol dokola. Jen přibyla sídliště, železnice, a hlavně haly fabrik a rozličných
      skladů.


      Po jediné značené cestě, turistické žluté značce, se dostanete od asfaltky vedoucí z Litoměřic do
      Michalovic. Cesta je dlouhá necelý kilometr, zpočátku půjdete po mírně svažité stepní louce, od
      úpatí kopce lesní cestou vinoucí se v traverzovitém stoupání na vrchol. Převýšení je asi 80 metrů.
      Ale panoramata určitě stojí za trochu zadýchání se.


      Mácha hodně cestoval, navštěvoval s oblibou zříceniny, ale pěšky se vypravil i do Itálie. Na řadě
      našich památek najdete většinou na tabulích zmínku, že se tu Mácha zastavil. Nikoliv ale na Radobýlu.
      Přitom ve městě je v ulici nesoucí básníkovo jméno světnička, kde pobýval. I hrob, ve kterém přes
      sto let ležel, tu je označen, ale kopec, který ho stál život, mlčí...


      Možná tu tabule není z obavy před zničením nebo zcizením. Básník, kterého jsme si vzali za symbol
      mládí, lásky, jehož pozdější pohřeb na vyšehradském Slavíně se stal celonárodní protiněmeckou manifestací,
      na Radobýlu připomenut není.


      ## Ač mlád, přesto nesmrtelný


      Bylo mu pouhých 26 let, přitom jeho dílo je nesmrtelné. Máj byla jediná kniha, která za jeho krátkého
      života vyšla. Narodil se jako Ignác Mácha, jméno Karel si přidal v duchu tehdejšího obrozenectví,
      Ignáce na Hynka si změnil pár let před skonem.


      ## Zemský ráj to napohled


      Z vrcholu Radobýlu, se otevírá nádherné panorama Českého středohoří. Přes řeku začouzené Lovosice,
      Žernosecké jezero, dvojvrch Lovoše, tady se tvrdě bojovalo v sedmileté válce, Milešovka, Boreč,
      Oltářík, Házmburk, Říp, v oparu se občas objevilo Ralsko, Polabí k Mělníku… Krajina přímo rajská,
      pokud si odmyslíme industriální zásahy, a není jich málo.


      Na druhé straně vidíte zříceninu Kamýka, vpravo na Labi místo zvané Porta Bohemica (Brána Čech),
      vše pokračuje pahorky přecházející k Ústí nad Labem.


      Severozápadní stěna je lomově odtěžena, odkryl se nádherný pohled na čedičové výlevy, dá se sejít
      do Žalhostic, kolem několika oskeruší, jeřábu, který se vyskytuje hlavně na Slovácku a má výborné
      jedlé plody.


      Velký kus kopce ukousl ze strany přivrácené k Lovoši kamenolom, který byl jedním z největších v
      severních Čechách. V odtěžené stěně se objevily různě směřující sloupce čediče. Na úpatí je velké
      kamenné pole z malých čedičových sloupů.


      ## Podzemí neslo smrt


      Koncem druhé světové války umíraly pod Radobýlem tisíce vězňů, kteří dřeli v nacistických tajných
      podzemních továrnách.


      Obří plocha mezi vrchy Radobýlem a Bídnicí skrývá vchody do podzemí. Bývalá továrna Richard I. -
      III. se začala budovat v roce 1944, vyráběly se tu tankové motory, posléze snad i součásti proudové
      stíhačky Me 262, pracovali tu převážně vězni KL Terezín a Litoměřice plus totálně nasazení. Podzemí
      je zavřené.


      Na konci Litoměřic narazíte na podlouhlou budovu a komín. Bývalé krematorium, kde v plamenech skončily
      tisíce zemřelých z podzemních fabrik. Pietní místo s pomníkem zoufalství a utrpení. Vždycky smutné
      místo, nyní ale ve stavu naprostého nezájmu. Vždyť je to tak dávno…


      Cestou k Radobýlu narazíte ještě na jedno místo hrůzy. Stojí v"
