      **zahrada Čech** — Zdejší ovocnářství dosáhlo tak vysoké úrovně, že se dnes Českému středohoří přezdívá
      zahrada Čech. Z rovin vystupují obdivuhodné vulkanické kupy.


      **nejvyšší hora Českého středohoří** — Na Milešovce je každoročně zaznamenáno nejvíce bouří na našem
      území, proto se jí často přezdívá Hromová hora.


      **zřícenina s typickou dvouvěžovou siluetou** — Nepřehlédnutelná dominanta dolního Poohří. Ze zříceniny
      jsou fantastické výhledy do krajiny Českého středohoří.


      **Brána Čech** — Kaňonovité údolí, kterým řeka Labe vstupuje do Českého středohoří. Břehy lemují
      skály s vyhlídkami  do samotného kaňonu a okolní vulkanické kopce. Z této oblasti pochází proslulé
      žernosecké víno.


      **křížem krážem Českým středohořím z Ústí nad Labem do Bíliny** — Přibližně 127kilometrový trek
      sopečnou krajinou CHKO České středohoří. Mj. navštívíte hromovou horu Milešovku, mystický vrch Raná,
      12metrový Vaňovský vodopád, kaňon Labe Porta Bohemica, svezete se motorovou lodí a možná si odnesete
      i české granáty.


      **jediný český štít** — Kopec s natolik exponovaným vrcholovým hřebínkem, že jeho přechod se dá
      srovnat s poměry na hrotech mnoha tatranských štítů. Pravděpodobně jediné místo v ČR, které se pyšní
      titulem „štít“.


      **symbol češství** — Nejvýznamnější místo a symbol české národní historie. K Řípu se váže základní
      pověst o příchodu našich předků vedených praotcem Čechem do Čech.


      **poutní místo na strmém sopečném kopci** — Kalvárie si zahrála ve filmech jako Mág či 3 sezóny
      v pekle. Mmonumentální schodiště poutního místa kdysi poutníci zdolávali po kolenou.


      **průvodce severočeskou industriální krajinou** — Zvu vás na offroad safari – zážitkové poznávací
      vyjížďky severočeskou industriální krajinou. Dostanu vás do míst, kam se běžný turista nepodívá.


      **skalní vyhlídka nad meandrem Labe** — Skvělý výhled do údolí Labe a na východní část Českého středohoří.
      Na vyhlídce stojí několikametrový kovový kříž. Na dohled odsud je Porta Bohemica – Brána Čech."
