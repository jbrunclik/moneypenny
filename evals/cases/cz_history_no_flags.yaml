      "Published: 2024-09-06


      ###### Článek


      Na vrcholu příjemně pofukuje. Zářijové slunce sice stále neúprosně praží, ale dopolední teplota
      přece jen ještě nestihla vyšplhat tak vysoko. Trocha nepohodlí navíc za místní výhledy stojí, ačkoli
      řadu vzdálenějších dominant halí mlžný opar. Dobře jsou vidět Lovosice a za nimi i silueta hradu
      Hazmburk, směrem na sever se pak rýsuje malebné kaňonovité údolí Labe zvané brána Čech či Porta
      Bohemica. Dohlédnout lze i na bájný Říp.


      Samotný Radobýl patří v Českém středohoří mezi nižší vrchy; měří 399 metrů a nejvyšší Milešovce
      s jejími 837 metry tak konkurovat rozhodně nemůže. Přesto je v okolí králem, byť nekorunovaným.
      Není to jen vlivem jeho ikonického tvaru, ale především díky zmiňovanému titulu nejseverněji položených
      vinic v Česku. Ty tu rostou od středověku díky Karlu IV., jenž okolní pozemky k pěstování révy daroval.


      Původní vinice jsou už samozřejmě dávno zaniklé, nahradily je však nové. Táhnou se od úpatí Radobýlu
      směrem na sever přes Velké Žernoseky. Nedaleké Litoměřice byly ve středověku druhým největším vinařským
      městem hned po Praze, tradice pěstování révy je tedy v okolí skutečně dlouhá. Dnes však stojí oblast
      ve stínu Moravy, což je škoda, protože České středohoří se pyšní neméně okouzlujícími panoramaty.


      Když na chvíli skončím s kocháním se krajinou, upřu svůj zrak k vysokému ocelovému kříži, který
      na vrcholu Radobýlu stojí. Je v pořadí už osmý. První, který byl z dubového dřeva, tu vztyčili 3.
      května 1622 a vydržel stát dlouhých 250 let. Kříž je patrný i při pohledu od úpatí neovulkanické
      hory.


      ## Křovím na vrchol


      Cesty na vrchol vedou dvě a obě mají svá pro a proti. Nejkratší trasa je ze Žalhostic přímo z nádraží
      a je tedy dost strmá. Obklopuje ji navíc velmi divoký porost, který je v končícím létě už dost suchý,
      a tak pěkně píchá do nohou. Tato konkrétní trasa, značená žlutou barvou, vede po stráních v místech,
      kde stávaly původní středověké vinice. Druhá možná cesta je z Litoměřic. Je delší, pozvolnější,
      ale část vede po silnici, což není po pravdě nic příjemného.


      Při chůzi ze Žalhostic se navíc turisté dostanou přímo pod západní svah Radobýlu, kde jsou vlivem
      těžby kamene vidět čedičové sloupce. Z několika informačních tabulí se dozvídám, že je okolí významné
      také z hlediska fauny a flóry. Vyskytují se zde chráněné rostliny jako třeba kozinec bezlodyžný
      či bělozářka liliovitá, ale také vzácné druhy motýlů, mimo jiné okáč metlicový nebo modrásek východní.


      Pod odtěženým svahem a v začínajícím lesním porostu se nacházejí také ruiny budov. Vzhledem k historii
      oblasti odhaduji, že jde o někdejší důlní zařízení, patrně využívaná i nacisty.


      Radobýl je nicméně spojen také s básníkem Karlem Hynkem Máchou, který v nedalekých Litoměřicích
      žil. V neděli 23. října 1836 upravoval na vrcholu hory, ve stínu kříže, svou poslední báseň Cesta
      z Čech, když si povšiml, že v jeho domovském městě hoří. Běžel tedy zpět, aby pomohl s hašením.
      Nalokal se však přitom vody, která mohla být zdrojem jeho následného infekčního onemocnění, na nějž
      o dva týdny později, 6. listopadu, zemřel.


      ## Největší v Česku


      Poskočme o zhruba sto let dopředu, tedy do období druhé světové války. To pod nedalekým vrchem Bídnice
      vznikla zmiňovaná podzemní továrna nacistů. Komplex B5-Richard postavili Němci ze tří bývalých hlubinných
      vápencových dolů a daleko od fronty tu vyráběli vybavení, včetně spalovacích motorů pro tanky či
      stíhačů tanků.


      K výstavbě komplexu se uchýlili z důvodu, že se továrny na povrchu čím dál častěji stávaly terčem
      amerických a britských náletů. Hitlerův dvorní architekt Albert Speer tak přišel s nápadem, jak
      výrobu zachovat. V celé rozpadající se říši začaly vznikat podzemní továrny, Richard byl tou největší
      na českém území.


      Práce na továrně začaly na jaře roku 1944 a bylo na ně nasazeno 1200 civilních zaměstnanců i vězni
      z nedalekého koncentračního tábora v Terezíně a z litoměřické pobočky tábora Flossenbürg. Pro třetí
      říši šlo o významný projekt, což dokazuje, že do útrob komplexu vedl"
