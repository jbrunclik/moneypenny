      **Autor článku:** Luboš Moravec | poslední aktualizace: 14. října 2013


      **Kategorie:** Zajímavosti


      V neděli 23. října 1836 Karel Hynek Mácha na Radobýlu psal svoji **poslední báseň** *Cesta z Čech.*
      Během psaní si **všiml požáru** v nedalekých Litoměřicích, kam se okamžitě rozběhl a celý uřícený
      **pomáhal s hašením.** Při hašení se nalokal vody, z které se nakazil cholerinou; ta společně se
      silným nachlazením vedla k Máchově smrti – **zemřel** 6. 11. 1836.


      Dne 24. 10. 1836 si Mácha **do svého deníku zapsal:** *„V neděli večer jsem ležel na Radobýlu, na
      jednom velkém vrchu za Litoměřicemi, už byla tma; a v tom vyšel v Litoměřicích oheň. To jsem viděl
      z toho vrchu. Tak jsem běžel honem do Litoměřic; asi 3/4 hodiny jsem měl co běžet než jsem tam doběhl,
      a přece jsem byl jeden z nejprvnějších u ohně. To byl ale oheň; jedenáct stodol, samé obilí, najednou
      hořely, a vítr do toho foukal až hrůza…“*


      Na západní straně Radobýlu se v minulosti těžil **čedič s výraznou sloupcovitou odlučností;** čedičové
      sloupce se vozily až do Nizozemska jako odolný materiál pro **zpevňování hrází.** Bývalý kamenolom
      je dnes součástí přírodní památky *Radobýl.*


