    https://www.litomerice.cz/aktuality-infocentrum/litomerice-nabizi-novou-trasu-pro-rodiny-s-detmi-laka-na-hadanky-a-objevovani:
      "Published: 2025-02-05


      Město Litoměřice nabízí originální pěší trasu určenou především rodinám s malými dětmi. Vydat se
      na ni mohou jak návštěvníci města, tak i místní obyvatelé. Děti během procházky čeká plnění úkolů
      a řešení tajenky.


      Nenáročná trasa o délce přibližně dva a půl kilometru vznikla ve spolupráci s odborem komunikace,
      marketingu a cestovního ruchu. Její autorkou je Lucie Nachtigallová, tvůrkyně populárního Deníku
      fejsbukové matky, která se dlouhodobě věnuje přípravě krátkých a atraktivních výletů pro rodiny
      s malými dětmi po celé republice. Tyto výlety si oblíbili také prarodiče, kteří je rádi absolvují
      se svými vnoučaty.


      Trasa výletu s názvem *Za K. H. Máchou a pány kluky do Litoměřic* začíná na Mírovém náměstí a vede
      kolem památníku Karla Hynka Máchy, katedrály, přes Rybářské a Mariánské náměstí, dále k hvězdárně
      a hradu a končí opět na Mírovém náměstí.


      „Při krátké procházce městem budeme hledat domovní znamení a také světničku, kde žil básník Karel
      Hynek Mácha. Potkáme draka, jelena, rytíře, hrad i jedno kamenné dvojče,“ popisuje autorka Lucie
      Nachtigallová.


      Výlet s tajenkou obsahuje kreslenou mapu, doplňovačku s tajenkou, praktické rady na cestu, zábavné
      úkoly a doprovodný text. Materiály jsou k dispozici ke stažení na webových stránkách města Litoměřice **tomto
      odkazu**"
    https://www.vsude.cz/litomerice-kalich-hrad-podzemi-vylet/: "Published: 2026-06-14


      **Litoměřice na jeden den zvládnete pěšky: Mírové náměstí s domem U Kalicha, vyhlídková věž ve tvaru
      vinného kalichu, gotický hrad s expozicí českého vinařství a katedrála sv. Štěpána na Dómském pahorku
      leží v historickém centru jen pár minut chůze od sebe.** Výlet se hodí pro milovníky památek a vína,
      pro rodiny s dětmi, které baví věže a podzemní chodby, i pro všechny, kdo chtějí den na soutoku
      Labe a Ohře spojit s návštěvou Terezína.


      O plánu dne rozhodují hlavně prohlídky s průvodcem. Na věž Kalich i do podzemní expozice Důl Richard
      se chodí jen s průvodcem z informačního centra a ve věži je místo nejvýš pro dvanáct lidí. Hrad
      si naopak projdete sami kdykoli během otevírací doby. Auto je nejlepší nechat na parkovišti pod
      hradbami, náměstí patří do nejdražší parkovací zóny.


      ## Ve zkratce


      - **Kde:** historické centrum Litoměřic nad soutokem Labe a Ohře, infocentrum s vchodem na věž Kalich
      je v přízemí radnice na Mírovém náměstí.

      - **Věž Kalich:** 80 Kč dospělí, 30 Kč děti od 6 do 15 let, 50 Kč studenti, důchodci a držitelé
      ZTP, jen s průvodcem, nejvýš 12 osob.

      - **Hrad Litoměřice:** 150 Kč dospělí, 135 Kč studenti a senioři, 100 Kč děti do 15 let, vstupné
      platí pro všechny expozice.

      - **Podzemí:** expozice Důl Richard pod radnicí s průvodcem z infocentra a v létě historické sklepy
      pod vinárnou Radniční sklípek.

      - **Vyhlídky:** věž Kalich, parkány José Rizala, věž na Mostné hoře a zvonice u katedrály.

      - **Doprava:** placené parkovací zóny, v neděli a o svátcích zdarma, MHD bez jízdného.


      ## Co v Litoměřicích stihnete za jeden den


      Jádro výletu tvoří čtyři místa v okruhu několika set metrů. Rozlehlé Mírové náměstí s renesančním
      domem U Kalicha a vyhlídkovou věží, bývalý královský hrad u Tyršova náměstí s expozicí českého vinařství,
      Dómský pahorek s barokní katedrálou sv. Štěpána a litoměřické podzemí pod domy kolem náměstí. Zdarma
      jsou náměstí, Dómský pahorek i parkány, platí se věž, hrad a podzemí.


      ## Mapa a recenze návštěvníků


      Dům U Kalicha s vyhlídkovou věží a městským informačním centrem stojí na Mírovém náměstí v historickém
      centru Litoměřic, hrad je u Tyršova náměstí a katedrála na Dómském pahorku, vše pár minut pěšky.
      Do města se dostanete vlakem do stanice Litoměřice město nebo Litoměřice horní nádraží, autem nejlépe
      na parkoviště u hradeb Na Valech nebo v Mezibraní.


      **Recenze a hodnocení:** hodnocení návštěvníků a jejich fotky ukazuje karta místa v mapě. Recenze
      čtěte podle data, protože ceny a otevírací doba se mění.


      ## Mírové náměstí a dům U Kalicha


      Podle Města Litoměřice tvoří náměstí jádro města už od první třetiny 13. století, kdy vládl Přemysl
      Otakar I. Má nepravidelný obdélníkový tvar, měří zhruba 75 až 90 krát 180 až 195 metrů a zabírá
      asi dva hektary. Tak velká plocha dokládá význam středověkého města, náměstí sloužilo jako hlavní
      tržiště. Většina domů je v jádře gotická, na fasádách i uvnitř ale najdete projevy všech slohů od
      gotiky po 20. století.


      ### Kdo postavil dům U Kalicha


      Dům, který podle města patří mezi nejoriginálnější národní kulturní památky v Česku, postavil Ital
      Ambrosio Balli pro rod Mrázů z Milešovky a stavba byla hotová v roce 1581. Mrázové zastávali úřad
      perkmistra hor viničních, proto dům zakončuje věž s bání ve tvaru sklenice na víno. Po Bílé hoře
      připadl dům městu, později v něm sídlil solní úřad a škola a od 19. století slouží jako radnice.
      V přízemí je infocentrum s bezbariérovým vstupem.


      ## Vyhlídky: věž Kalich, parkány a Mostná hora


      Věž Kalich zpřístupňuje informační centrum Města Litoměřice a podle infocentra je z ní vidět celé
      město, hrad Hazmburk i hora Říp. Chodí se výhradně s průvodcem, ve skupině je místo nejvýš pro dvanáct
      lidí a prohlídka trvá zhruba půl hodiny. Její součástí je výstava v krovu otevřená v roce 2022 po
      dvouleté obnově, se starým hodinovým strojem, který poháněl hodiny až do roku 1991.


      ### Kdy je věž Kalich otevřená


      V letní sezóně je věž přístupná denně a přesné časy prohlídek určuje personál informačního centra.
