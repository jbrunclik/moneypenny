    https://zatecky.denik.cz/zpravy-region/medovinobrani-a-dalsi-expozice-zapomenuty-zamek-v-patku-chce-vic-lakat/:
      "Published:
      2019-10-03


      První vlaštovkou je rozšířená otevírací doba až do října a sobotní medovinobraní na zámku. „Chtěli
      bychom, aby zámek ožil. Aby se zvýšila jeho propagace a zároveň aby toho turistům nabídl víc,“ sdělil
      místostarosta Peruce Jan Vnouček. Vlastníkem zámku je právě městys Peruc, pod kterou Pátek nad Ohří
      spadá. Od druhé poloviny 20. století jej obec využívá spolu s tamními zemědělci.


      Od roku 2003 byla památka vždy o prázdninových víkendech otevřena veřejnosti díky Mileně Hubičkové,
      dobré duši páteckého zámku. Letos se stal správcem zámku Petr Rasken Chaloupka, který má zkušenosti
      z jiných památek. „Přesvědčil nás svou koncepcí, jak zámek oživit. Sami se tím zabývat nemůžeme,
      v současné době řešíme prioritnější věci. Nový správce nás moc nestojí, jeho plat z velké části
      hradí Úřad práce. Městys přispívá menší částkou,“ vysvětlil perucký místostarosta.


      Petr Rasken Chaloupka se pustil s vervou do práce, která spočívá hlavně ve vyklízení a oprav dosud
      nevyužívaných místností zámku. „Chtěl bych je dát do podoby, kterou mohly mít zhruba před sto lety.
      Vystavíme tam historický nábytek z mých sbírek, který mám zapůjčený,“ vysvětlil.


      Má ale i další plány, sám je prý zvědavý, co přinese sklepení, které se postupně vyklízí. Nově mohou
      zájemci na zámku nebo v jeho zahradě také přespat. „A kdo chce, může nám pomoc,“ pousmál se nový
      správce.


      Zámek začal s pořádáním akcí pro širší veřejnost, dřív tam probíhaly výstavy a koncerty.


      ## Medovina a víno už v sobotu


      První akce se chystá tuto sobotu, jde o medovinobraní. K ochutnání bude medovina i víno, chystá
      se program v historickém duchu. „Zazní dobová hudba, vystoupí skupina historického šermu, alchymista,
      kouzelník, hadí mág, komentovanou prohlídku svých nástrojů chystá kat. Děti si budou moci vyzkoušet
      historické kostýmy a možné budou samozřejmě prohlídky zámku, kde je několik výstav,“ popsal Petr
      Rasken Chaloupka.


      V současné době jsou tam k vidění staré hračky, historické vybavení domácnosti a oblečení z přelomu
      19. a 20. století, výtvarné práce malířky Hany Štroblové, ilustrace výtvarnice Kateřiny Brabcové,
      fotografie krajiny Jany Kučerové, část expozice je věnována významným páteckým osobnostem a historii
      zámku a obce. Další akci pro veřejnost zámek chystá v adventním čase v prosinci, na příští rok se
      plánují noční karneval nebo menší country festival.


      Městys Peruc před několika lety nechal opravit střechu zámku, v plánu je výměna oken. „Rozpočet
      na okna je přibližně milion korun, uvidíme, jak na to budeme mít peníze,“ doplnil perucký místostarosta.


      Zámek v Pátku vznikl na místě tvrze, která stála na ostrohu řeky Ohře. První písemná zmínka je z
      roku 1374, na zámek se přestavěla v polovině 16. století. Po únoru 1948 byla v zámku okresní politická
      škola, později zemědělský archiv. Od roku 1961 v něm byly kanceláře místního národního výboru, knihovna
      a vývařovna zemědělského družstva, stanice SNB a později školka."
