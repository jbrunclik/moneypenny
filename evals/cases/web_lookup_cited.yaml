      "## What moves the bitcoin price\n\nBitcoin pays no dividends\
      \ and has no company or central bank behind it, so its price is simply what buyers and sellers agree\
      \ on at any moment. Six forces have done most of the moving in recent years.\n\n1. **Supply and\
      \ the halving:** New bitcoin only enters circulation as a reward to miners, and that reward is cut\
      \ in half every 210,000 blocks, about every four years. Since April 2024 the network has created\
      \ about 450 new BTC a day, and after the next halving that falls to about 225. Less new supply does\
      \ not guarantee a higher price, but it means more of any new demand has to be met by existing holders\
      \ choosing to sell.\n2. **Spot ETF flows:** US spot bitcoin exchange-traded funds started trading\
      \ on 11 January 2024 and are now one of the largest sources of daily buying and selling. They had\
      \ taken in a net $57.3 billion by 13 October 2026, according to Farside Investors, but the flows\
      \ run both ways: on 7 October 2026, investors pulled a net $484.9 million out in a single day.\n\
      3. **Interest rates and the economy:** Bitcoin has tended to move with other risky assets when borrowing\
      \ costs change. Higher rates make cash and bonds pay more, which can pull money away from speculative\
      \ assets. That pattern was clear in 2022, when the US Federal Reserve raised rates quickly and bitcoin\
      \ fell about 78% from its 2021 peak. On 16 September 2026 the Fed raised its target range by a quarter\
      \ point to 3.75% to 4%, its first increase since 2023. Whether bitcoin protects against inflation\
      \ over longer periods is still debated; we look at the evidence in is bitcoin a hedge against inflation?\n\
      4. **Companies holding bitcoin:** A growing number of listed companies buy bitcoin for their balance\
      \ sheets, using cash or money raised by selling shares and debt. The largest, Strategy, held 848,250\
      \ BTC on 11 October 2026, about 4.2% of all bitcoin in circulation, according to its filing with\
      \ the US Securities and Exchange Commission. Steady buying from these companies adds demand. If\
      \ their share prices fall and raising money gets harder, that demand can dry up.\n5. **Regulation:**\
      \ Rules decide who can buy bitcoin, through which products, and how easily banks and funds can offer\
      \ it. In the US, the CLARITY Act, which would set out how digital assets are regulated, passed the\
      \ House of Representatives in July 2025. On 15 September 2026, a Senate vote to move it forward\
      \ failed by 49 votes to 50, short of the 60 it needed. Decisions like these can move the price on\
      \ the day they land.\n6. **Leverage:** A large share of bitcoin trading happens through futures\
      \ and other borrowed positions. When the price moves sharply, platforms close leveraged positions\
      \ automatically, and those forced sales or purchases can push the price further in the same direction\
      \ within minutes.\n\n## Bitcoin price history and all-time high\n\nBitcoin has gone from less than\
      \ a tenth of a cent to more than $126,000 in 17 years, with at least three falls of more than 75%\
      \ along the way. The table lists the milestones people ask about most. Data providers record slightly\
      \ different highs and lows, because each draws on a different set of exchanges, so every figure\
      \ names its source.\n\n| Date | Milestone | Price | Source | \n|---|---|---|---|\n| **22 May 2010**\
      \ | Laszlo Hanyecz pays 10,000 BTC for two pizzas, the first known purchase of goods with bitcoin\
      \ | No market price yet | Bitcointalk forum | \n\nFor the year-by-year story, with charts and the\
      \ four-year cycles, read our full bitcoin price history.\n\n## Bitcoin in brief\n\nBitcoin is a\
      \ digital currency that runs on a public network of computers instead of a bank or government. It\
      \ was launched on 3 January 2009 by the pseudonymous Satoshi Nakamoto, two months after a white\
      \ paper describing it was published, and its rules cap the supply at 21 million coins. Our guide\
      \ what is Bitcoin? explains how it works.\n\nNew coins, and the security of every transaction, come\
      \ from mining: computers compete to add the next block of transactions to the"
