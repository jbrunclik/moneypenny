      **Centrum stavitelského dědictví NTM v Plasích**


      Moderní muzeum stavitelství naleznete v opraveném hospodářském areálu památkově hodnotného kláštera
      v Plasích. Atraktivní formou seznamuje s jednotlivými etapami stavby domu, ale i středověkými stavebními
      stroji. V rozsáhlém areálu se pořádají vzdělávací a vědecké akce.


      **Navštívit**Dnes zavřeno


      **Železniční depozitář NTM v Chomutově**


      Depozitář je umístěn v původním železničním depu a muzeum ho otevírá pro veřejnost na letní sezónu.
      Naleznete zde téměř 100 kolejových vozidel nejrůznějších typů: lokomotivy, salonní, osobní i motorové
      vozy, elektrické a motorové lokomotivy i historické drezíny.


      **Navštívit**Dnes zavřeno


      **Letenský kolotoč v Praze**


      Kolotoč se nachází v Letenských sadech již od roku 1894. Je jedním z nejstarších podlahových kolotočů
      v Evropě a unikátní je díky figurám koní, které jsou potažené pravou koňskou kůží. NTM kolotoč po
      celkové opravě zprovoznilo v roce 2022.


      **Navštívit**Připravujeme


      **Muzeum železnice a elektrotechniky v Praze**


      Národní technické muzeum připravuje v prostorách nejstaršího nádraží v Praze, v památkově chráněných
      objektech bývalých dílen Masarykova nádraží, velký expoziční projekt věnovaný tématům železnice
      a elektrotechniky.


      *Dokončení Muzea železnice a elektotechniky Národního technického muzea je plánováno na rok 2030.*


