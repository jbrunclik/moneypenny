    https://www.ntm.cz/:
      "Výstava originálním způsobem prezentuje příběh moderní kolejové dopravy jako
      jednoho z klíčových motorů proměny světa. Návštěvníci díky autentickým exponátům, interaktivním
      prvkům i uměleckým dílům objeví její počátky, technické inovace a dopady na každodenní život společnosti.


      Výstava přivádí návštěvníky do imaginárního elektrotechnického závodu v pražském Karlíně kolem roku
      1920. Nabízí pohled na Františka Křižíka jako člověka, který dokázal technické vize proměňovat ve
      skutečnost a jehož odkaz zůstává důležitou součástí českých dějin techniky.


      Národní technické muzeum nově získalo do svých sbírek 15 cenných vozů značky Praga ze soukromé sbírky
      Emila Příhody. Výběr osmi z nich nyní představuje ve výstavě umístěné v Dopravní hale.


      Výstava Národního technického muzea a Státního oblastního archivu v Praze ukazuje příběhy ukryté
      v domech, které vyprávějí archivy.


      Výstava přibližuje příběh firmy Hainz, který není jen podnikatelskou cestou od řemeslných počátků
      k moderní průmyslové výrobě hodin, ale zrcadlí v sobě také proměny a dramatické zvraty české společnosti.
      Připomíná ho také péče o významné historické hodinové stroje, včetně Staroměstského orloje, o jehož
      chod se stará již od 19. století."
