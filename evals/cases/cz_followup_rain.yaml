      "# Tipy, jak\
      \ zabavit děti, když venku prší\n\n#### **Za vědou a poznáním** \n\nZábavní vědecký park VIDA! nabízí\
      \ téměř 180 interaktivních exponátů, které vám i vašem dětem pomohou poznat svět kolem nás. Stálá\
      \ expozice má šest tematických celků: Planeta, Civilizace, Člověk, Mikrosvět, Venkovní expozice\
      \ (otevřená pouze od května do září) a Dětské science centrum pro nejmenší návštěvníky od 2 do 6\
      \ let. V Dětském centru si děti mohou vyzkoušet hrát na obrovské piano, otestovat své smysly nebo\
      \ využít model vesmírné rakety. Část exponátů je nyní přesunuta do třetího patra parku z důvodu\
      \ rekonstrukce.\n\nMůžete si vyzkoušet zmrazit vlastní stín, prozkoumat model obřího srdce, rozpoutat\
      \ tornádo, postavit si magnetickou sochu a mnoho dalšího. V Divadle vědy si děti užijí science show\
      \ nebo třeba promítání 3D filmů. Součástí doprovodného programu jsou také dílny s pokusy, šifrovačka\
      \ nebo Bastlírna. VIDA! Roboti nabídne zábavný program s přehlídkou robotů a workshopy pro děti.\
      \ Za rodinné vstupné dáte 650 korun.\n\nZa poznáním můžete s dětmi vyrazit i na Kraví horu do Hvězdárny\
      \ a planetária Brno. Brněnská hvězdárna se od svého otevření rychle zařadila mezi špičkové instituce\
