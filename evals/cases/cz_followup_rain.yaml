    https://www.punkevni.caves.cz/: "# Punkevní jeskyně


      Z kouzelného světa propasti po tajemných vodách


      **cca 50 min**


      **7–8 ˚C**


      **99 %**


      **1250 m**


      **198**


      Punkevní jeskyně leží v severní části Moravského krasu v kaňonu Pustého žlebu, v národní přírodní
      rezervaci Vývěry Punkvy. Suchá část byla zpřístupněna již v roce 1909. V březnu 1921 byla zprovozněna
      první vodní část jeskyně s plavbou loděmi. Aktuálně jde o jedinou fungující plavbu motorovými loděmi
      v přírodní jeskyni v kontinentální Evropě. Návštěvníci se podívají i na dno 138 metrů hluboké propasti
      Macocha.


      **Prohlídka je s průvodcem.** V letní sezóně a celoročně o víkendech doporučujeme si vstupenky zakoupit
      předem online, případně si je předem rezervovat přes infocentrum na Skalním Mlýně!


      - Součástí **Exkluzivního okruhu** od dubna do října je i návštěva unikátního Masarykova dómu na
      vodní plavbě.


      ## Jak k nám


      Auto či autobus zaparkujete na placených parkovištích na Skalním mlýně (denně) nebo u propasti Macocha
      (více informací o provozní době zde). Ze Skalního mlýna buď pěšky po rovině 1,7 km či silničním
      vláčkem od propasti Macocha lanovkou či pěšky 1,7 km s převýšením 130 m.


      V zimě je třeba využít parkoviště na Skalním mlýně – lanovka od propasti Macocha je I-III mimo provoz.


      **Punkevní jeskyně nejsou bezbariérové**. Vozíčkáři mohou navštívit suché části Punkevních jeskyní.
      Ale z technických důvodů je to možné jen při první či poslední prohlídce v daný den a **je třeba
      se s dispečinkem jeskyní domluvit na rezervaci a podmínkách předem**. Prohlídka s dětskými kočárky
      není možná vůbec.


      Stojany na kola jsou u vstupní budovy. Za odložená kola nenese Správa jeskyní zodpovědnost.


      Autobusová zastávka Blansko, Skalní mlýn a následně sil. vláček či 1,6 km pěšky; nejbližší vlak
      Blansko (7,5 km).


