      \ sledovat aktuální program. Snížené vstupné do digitária je 150 korun za osobu a za plné zaplatíte\
      \ 200 korun.\n\nObzory dětem rozšíří i Technické muzeum v Králově poli. Stálé expozice nabízí zajímavosti\
      \ o železářství, parních strojích nebo mechanické hudbě. Velkým lákadlem je nepochybně Technická\
      \ herna, která svojí zábavnou a interaktivní formou seznamuje se zákony fyziky. To ale není vše.\
      \ Muzeum se pyšní řemeslně-technickou dílnou, kde si děti mohou vyzkoušet tradiční řemeslné techniky.\
      \ Za rodinné vstupné zaplatíte 350 korun.\n\n#### **Když se chcete trochu hýbat**\n\nPokud máte\
      \ starší děti, které chtějí vybít nahromaděnou energii, tak se nabízí laser game. V Tron Laser Aréně\
      \ na Jugoslávské. Jedna hra trvá patnáct minut a v jednu chvíli může hrát až 16 hráčů, takže se\
      \ můžete domluvit s dalšími rodinami a vyrazit společně. Vybrat si můžete i hudbu, která vás bude\
      \ provázet hrou a v nabídce je i extra mlha, abyste se mohli lépe skrývat před spoluhráči. Pro studenty\
      \ a děti do 15 let je vstup za 140 korun. Plné vstupné je o 15 korun dražší. Pokud to vašim dětem\
      \ stále nestačí a nechce se jim zpět domů, tak je vezměte na bowling do Židenic. Bowling Brno nabízí\
      \ dvacet bowlingových drah a restauraci, pokud by vám po celém zážitku vyhládlo. Cena za dráhu se\
      \ odvíjí dle doby návštěvy a času, kdy vyrazíte.\n\nAni jedno vaše ratolesti neláká? Zkuste motokáry.\
