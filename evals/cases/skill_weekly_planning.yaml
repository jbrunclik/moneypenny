id: skill_weekly_planning
description: A weekly planning session request loads the weekly-planning skill
integrations:
  todoist:
    projects:
      - {id: p1, name: Work}
      - {id: p2, name: Personal}
    sections:
      - {id: s1, project_id: p1, name: Active}
      - {id: s2, project_id: p2, name: Errands}
    tasks:
      - {id: t1, content: "Send quarterly report", project_id: p1, section_id: s1}
      - {id: t2, content: "Buy birthday gift for Anna", project_id: p2, section_id: s2}
user: "Let's do my weekly planning session."
expect:
  rubric: >
    Starts a structured weekly planning session (reviews current tasks and
    what is coming, asks about priorities for the week) rather than a generic
    reply.
  required_tools: [load_skill]
  required_skill: weekly-planning
