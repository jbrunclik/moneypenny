    https://www.tnp.si/en/visiting-park/activities/hiking/mountain-safety/:
      'You should be well equipped
      and well prepared when you head to the mountains. HERE you can find are some recommendations you
      should follow for a safe trip to the mountains to make planning your alpine and hiking tours easier.


      Certainly, many images of the Slovenian mountains capture the breathtaking beauty you''d love to
      share with the world. However, it is crucial to prioritize safety, fitness, and careful planning
      before embarking on your journey. An old Slovenian saying wisely states, "The mountain isn''t crazy,
      the person climbing it is." This especially applies to those who are not adequately equipped and
      thus unprepared. Numerous hazards in the mountains can transform a wonderful experience of communing
      with nature into an ordeal, leading to suffering, injury, or worse.


      HERE you can find the latest information on current conditions in Triglav National Park, Slovenia’s
      only national park.



      Tell someone in the valley where you are going, what your destinations are and when you plan to
      return.


      Write in the summit log books, as this can be useful to mountain rescuers in case they need to look
      for you.


      Book your accommodation in a mountain hut in advance. If you are not going on the hike, cancel your
      reservation. You can find a list of Slovenian mountain huts, their contact details and other useful
      information HERE. Below, you can also view the mountain huts on the map provided by the Alpine Association
      of Slovenia.


      ### Choosing a trail


      Choose trails suited to your **psycho-physical abilities, knowledge** and **experience,** and adapt
      to the weakest participant on the tour.


      <u>A route plan</u> is the first step towards safer mountain visits. Walking on ''spur of the moment''
      is discouraged.


      **DON''T GO OFF-TRAIL!** If you get lost, retrace your steps and look for the signpost.


      **DO NOT continue into the unknown!**



      **The Knafelč sign** marks mountain trails in Slovenia:





      <u>Mountain trails are classified according to **difficulty** as:</u>


      **Easy trails**


      They are suitable for walking with trekking poles and do not require the use of your hands.


      **Difficult trails**


      There are parts where you need to use your hands to help yourself. Steel cables and other equipment
      to increase safety are on the trail. The use of a helmet is recommended.


      **Very difficult trails**


      Use our hands to move forward is mandatory. Steel cables, iron pegs, and other equpment are on the
      trail to facilitate upward movement. The use of a helmet, climbing harness and self-protection kit
      is recommended.


      You can check the current condition of mountain trails on the Alpine Association of Slovenia’s map
      below.


      ### Check the weather before you go


      Always check the weather forecast before you go to the mountains. Weather conditions in the mountains
      are very variable and extreme, even in summer.


      Temperatures can change quickly, especially at higher altitudes. Even in the summer months we can
      be surprised by very low temperatures, especially at night. Make sure you have enough warm clothes
      with you.


      In the summer months, afternoon thunderstorms are common in mountainous areas. Plan your trips so
      that you return to the valley before the afternoon, when storms are most likely. Watch out for approaching
      storm clouds.


      ### Equipment in the mountains


      We go to the mountains wearing <u>**quality soled mountaineering boots, semi-high or high**</u>,
      to protect our ankles.


      <u>Sandals, trainers and other lighter footwear can cause accidents!</u>



      Whether walking, running or cycling, mountain equipment should always be in your rucksack:


      - personal first aid kit

      - head torch and spare batteries

      - an aluminium foil or large black bag or bivy sack (for thermal protection in case of an accident
      or unplanned bivouacking)

      - mobile phone with full battery

      - mountain map and compass

      - iron food (food with high energy value and long shelf life)

      - sufficient amount of water


