      \ regime stipulated in the Triglav National Park Act (Official Gazette of RS, No. 52/10, 46/14-ZONC\
      \ and 60/17), which prohibits flights of aerial vehicles under 1,000 feet (304.8m) above the current\
      \ location or an obstacle detected during flight.\n\nThe use of UAVs without a previously acquired\
      \ permit is allowed only for the purpose of protection, rescue and assistance in natural and other\
      \ disasters, for the purpose of state defence, and for the purpose of the execution of police tasks.\n\
      \nOn the basis of the consent obtained from the national park managing authority, the use of UAVs\
      \ is permitted only for the purpose of:\n\n- **scientific and research activities,**\n- **land surveying,\
      \ and**\n- **recording of films, videos and documentaries.**\n\nThe use of UAVs for film and video\
      \ recording is allowed in areas of infrastructure and in settlements with previously obtained consent.\
      \ In the natural environment UAVs can only be used for the purpose of recording documentary and\
      \ promotional films which are intended for the promotion of the park and its local communities subject\
      \ to the limitations on noise for such devices and the height of flight above the areas which are\
      \ classified as particularly sensitive areas of nature and where such use has no significant effect\
      \ on the elements of animate nature of the national park.\n\nThe use of UAVs is also subject to\
