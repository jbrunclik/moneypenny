      "Mountain peaks, wild
      and deep gorges, a wealth of flora, a cultural landscape with mountains and picturesque villages
      with a rich cultural heritage invite you to visit. Getting to know the nature, the cultural landscape
      and the people of the park is an extraordinary experience, but one that must take into account the
      fundamental objectives of nature conservation.


      Triglav National Park is the only national park in Slovenia. In this beautiful and delicate natural
      environment and cultural landscape, we visitors are only guests.


      We want your experience of the Triglav National Park and its thematic routes to be authentic and
      rich. At the same time, visitors, remember that you are only guest in this delicate environment.


      Did you know that Triglav National Park comprises 134 quiet areas, which are, by definition, essential
      for the conservation of plant and animal species? Visitation and other activities are regulated
      in terms of time and space. Quiet zones are designated to protect raised bogs and species such as
      capercaillie, rock ptarmigan, black grouse, and chamois.


      **GENERAL GUIDELINES FOR VISITING**


      #### Be a respectful guest


      You are entering a sensitive world of nature. Peace and tranquillity should be the privilege of
      the park's inhabitants and visitors.



      #### Use marked routes


      The sensitive natural environment requires an aware visitor, so walking off the marked trails is
      not recommended.



      #### Burning of fire is forbidden


      Burning fires is prohibited in natural environment. Exceptionally, it is allowed in specially designated
      places and for agricultural and forest protection purposes.



      **ACTIVITIES IN THE PARK**


      #### Use of drones is prohibited


      The use of drones is prohibited in the natural environment without the prior consent of the national
      park.



      #### Swimming in high mountain lakes and streams is prohibited


      High mountain lakes and streams are sensitive and vulnerable habitats where swimming is not allowed.
      Dogs are also prohibited from swimming.



      #### Prohibited driving in natural environment


      Driving, stopping and parking of motor vehicles is prohibited in the natural environment of the
      park.



      **CAMPING AND TENTING**


      #### Overnight stays outside the designated areas are not permitted


      Tenting and sleeping outside the designated areas is not allowed. There are enough beds in the mountain
      huts.



      #### Camping is not allowed outside the designated areas


      Camping and overnight stays outside the designated areas are not allowed.


      **IN THE PARK WITH YOUR DOG**


      #### Dogs must be kept on a leash in the natural environment of the park


      Let's visit with a non-intrusive presence, ensuring the dog is always on a leash.



      #### Stay away from livestock in pastures


      For your own safety and the safety of your dog, do not approach livestock in pastures. Keep dogs
      on a leash.



      #### Dogs are prohibited from swimming in high mountain lakes and streams


      High mountain lakes and streams are sensitive and vulnerable habitats where dogs are not permitted
      to swim.



      **Was this page helpful?**


      **Thank you**


      Thank you."
