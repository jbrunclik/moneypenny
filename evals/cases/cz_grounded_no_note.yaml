id: cz_grounded_no_note
description: Grounding-check precision - a fully sourced answer gets no unsourced annotations
user: "jaky je dnes kurz eura podle CNB?"
expect:
  rubric: >
    Gives today's (or the latest published) Czech National Bank EUR/CZK rate,
    taken from a source it read this turn. It FAILS if the grounding check
    marks the rate (or any claim) [UNSOURCED], [PARTLY SOURCED] or
    [CONTRADICTED BY SOURCE]: a single rate read from the CNB page is fully
    supported, so any such mark is a false flag.
  required_tools: [research, web_search, fetch_url]
  forbidden_tools: [delegate_task]
