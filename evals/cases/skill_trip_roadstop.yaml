      z celé oblasti dělá praktickou zastávku na oběd i pro cestující.


      ## Parkování a jak se do Modřic dostat


      U restaurací v obci i v nákupní zóně se dá zpravidla zaparkovat v okolí podniku, u zóny pak na velkých
      parkovištích u obchodů. Konkrétní podmínky a kapacita se liší podle místa, proto s parkováním v
      době polední špičky počítejte s tím, že blízká místa mohou být obsazená.


      Bez auta se do Modřic dostanete z Brna tramvají 2, jejíž konečná smyčka je přímo v Modřicích, nebo
      autobusem 49 se zastávkou Modřice-náměstí. Spojení z Brna je časté a cesta krátká, takže na oběd
      do Modřic dojedete i městskou dopravou. Restaurace v centru obce jsou od zastávek v pohodlné docházkové
      vzdálenosti.


