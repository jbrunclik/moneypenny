      "Published:\
      \ 2024-07-09\n\n# Kde se najíst na cestách: dětsky přátelské restaurace podél D1 a cestou na Slovensko\n\
      \n**Kde se najíst s dětmi na cestách? Nejlépe tam, kde je kromě jídla i prostor na proběhnutí: v\
      \ parku, u hřiště nebo v zoo kousek od dálnice.** Léto je ve znamení dlouhých cest autem k babičce,\
      \ na hory nebo k moři. Připravili jsme tipy na zastávky podél D1 a cestou na Slovensko, kde se děti\
      \ najedí a protáhnou a rodiče si dají kávu.\n\n## Proč hledat dětsky přátelské podniky\n\n**Na dlouhé\
      \ cestě je oběd hlavní přestávka, a když se povede, zbytek cesty jede jako po másle.** Děti po hodinách\
      \ v sedačce potřebují běhat, ne sedět další hodinu u stolu. Proto se vyplatí plánovat zastávky tam,\
      \ kde je hřiště, park nebo atrakce, a jídlo k tomu.\n\nDálniční odpočívadla jsou rychlá, ale v létě\
      \ přeplněná. Pár minut sjezdu z dálnice často znamená klidnější restauraci, stín a lepší jídlo.\
      \ Zastávku si naplánujte předem: podívejte se, u kterého exitu budete zhruba v době oběda, a vyberte\
      \ podnik s hřištěm nebo parkem nablízku. Ušetříte hledání na poslední chvíli, kdy jsou děti hladové\
      \ a unavené. Kavárny pro rodiny s dětmi podél trasy najdete v mapě Kid.ooo.\n\n## Co dělá podnik\
      \ family-friendly\n\n**Rodinný podnik poznáte podle dětského koutku, dětského menu a toho, že vás\
      \ nikdo nepopohání.**\n\n- **Dětský koutek nebo hřiště:** ideálně venku a na dohled od stolu.\n\
      - **Dětské menu:** menší porce a jednoduchá jídla bez zbytečného koření.\n- **Dětské židličky:**\
      \ pro batolata nutnost.\n- **Přebalovací pult:** v čisté toaletě, ne jen na dámské.\n- **Rychlá\
      \ obsluha:** hladové dítě nečeká.\n\n## Kde se najíst s dětmi: zastávky podél D1 a cestou na Slovensko\n\
      \n**Nejvíc zastávek s parkem, zoo nebo hřištěm najdete na Moravě mezi Brnem a Kroměříží.** Než vyrazíte,\
      \ vždy si ověřte aktuální otevírací dobu na webu daného místa.\n\n| Zastávka | Trasa | Co tam je\
      \ | Odbočka z dálnice | Ceny | \n|---|---|---|---|---|\n| Velké Meziříčí | D1 Praha–Brno | náměstí\
      \ s restauracemi | krátká | nízké | \n| IKEA Brno | D1 u Brna | restaurace, dětský koutek | krátká\
      \ | nízké | \n| Zámek Slavkov | D1 Brno–Vyškov | zámecký park, kavárna | krátká | zdarma | \n| Zoopark\
      \ Vyškov | D1 Brno–Olomouc | zvířata, hřiště, občerstvení | krátká | střední | \n| Dinopark Vyškov\
      \ | D1 Brno–Olomouc | dinosauři, občerstvení | krátká | střední | \n| Kroměříž | D1 Brno–Ostrava\
      \ | zahrady, restaurace v centru | střední | nízké | \n| Lednice | D2 na Bratislavu | zámecký park,\
      \ restaurace | střední | zdarma | \n| Budatínsky hrad | D1 v Žilině | hradní park | krátká | nízké\
      \ | \n\nCeny: nízké = oběd nebo vstup do cca 150 Kč na osobu, střední = cca 150–400 Kč. U slovenských\
      \ míst orientačně v přepočtu na Kč, ceny se mění.\n\n### D1 Praha–Brno\n\nV polovině cesty se vyplatí\
      \ sjet do **Velkého Meziříčí**, kde na náměstí najdete restaurace, cukrárny a místo na protažení.\
      \ U Brna je hned u dálnice **IKEA Brno** s restaurací, dětskými židličkami a koutkem, což je osvědčená\
      \ rychlá zastávka.\n\n### D1 Brno–Ostrava\n\nHned za Brnem leží **Zámek Slavkov** s rozlehlým parkem,\
      \ kde se děti proběhnou. Ve Vyškově je u dálnice **Zoopark Vyškov** s domácími zvířaty a hřištěm\
      \ a vedle něj **Dinopark Vyškov**. Delší pauzu si zaslouží Kroměříž, kde **Arcibiskupský zámek a\
      \ zahrady** nabízejí stín i prostor na hraní.\n\n### Cestou na Slovensko\n\nPo D2 směrem na Bratislavu\
      \ stojí za krátkou odbočku **Zámek Lednice** s obrovským parkem a restauracemi v obci. Na slovenské\
      \ D1 se v Žilině zastavte u Budatínského hradu, kde sídlí **Považské múzeum** a kolem je park.\n\
      \n## Sezónní speciality měsíce\n\n**V červenci vsaďte na lehká jídla: ovocné knedlíky, saláty, polévky\
      \ a domácí limonády.** Těžká jídla v horku děti v autě unaví. Zmrzlinu si nechte až na konec zastávky,\
      \ ne před další hodinou jízdy. Na Slovensku děti často nadchnou bryndzové halušky nebo palacinky.\n\
      \n## Tipy pro klidný oběd s dětmi\n\n**Nejlepší je jíst dřív, než děti dostanou opravdový hlad,\
      \ a nejdřív je nechat proběhnout.**\n\n- Obědvejte kolem jedenácté, kdy jsou restaurace ještě poloprázdné.\n\
      - Objednejte dětem hned"
    https://d1koliba.cz/: "#### Dotazy, rezervace?


      (+420) 212 812 530


      **Stylová restaurace „WILLIAM KOLIBA Restaurant D1** – 58 km je umístěn na nejvytíženější dálnici
      v České republice, na dálnici D1, odpočívka KALNÁ, 58 km směr Brno-Praha v blízkosti benzínové čerpací
      stanice Shell.


      Stylová restaurace s domácími výrobky a kuchyní vám nabízí **příjemné posezení v moderním a zároveň
      stylovém prostředí s možností odpočinku** i pro vaše děti. Uvnitř areálu se nachází venkovní dětské
      hřiště. V případě špatného počasí vaše děti jistě potěší i vnitřní dětský koutek ve 2.NP. Do budoucna
      se můžete na naší kolibě podívat a pohladit si zvířátka, která kdysi byla u nás v každé chalupě.
      Stylová restaurace s možností oddělení prostor pro školení a jednání zajišťuje svým hostům celoročně
      výjimečné prostředí a dobré podmínky pro volné chvíle i pracovní schůzky.


      **Skvělé prostředí pro tradiční akce jako jsou opékání vepřového, stylové zabijačky či firemní akce.**


      Stylově vybavené prostory v kombinaci s výbornou dostupností, jsou vynikajícím předpokladem pro
      pořádání stylových a firemních akcí právě v Restauraci Koliba William.


      Kapacita Koliby, vnitřních prostor je celkem až 150 osob (s venkovním prostorem až 300 osob).


      V prostorách Restaurace Koliba William je i stylové dětské venkovní a vnitřní hřiště. V případě
      akcí pod širým nebem jsme však schopni zorganizovat akce až pro 1000 účastníků.


      Vynikajícím doplňkem firemních i společenských akcí jsou volnočasové aktivity, které u nás můžete
      využít. Rádi zorganizujeme pro Vás i doprovodný program.


      Oblíbené jsou tematické teambuildingy, včetně ochutnávek, stylové zabijačky, opékání prasat, jehňat
      i volů. Můžeme Vám k tomu zprostředkovat také živou hudbu.


      **Stylová restaurace s celoročním provozem** s možností oddělení prostor pro školení a jednání.
      Naleznete zde odpočinek, výjimečné prostředí a vynikající podmínky pro volné chvíle i pracovní schůzky.


      **Otevírací doba:**


      Pondělí – Úterý: Zavřeno


      Středa – Neděle: 10:30 – 19:00


      Nabízíme vám možnost stát se součástí úspěšného provozu a příležitost pracovat s kompletně nově
      vybudovanými prostory se zajištěným ubytováním přímo na KOLIBĚ !


      Pracovní prostředí založené na čestnosti a poctivosti a dobrých mezilidských vztazích je našim cílem,
      jak uspět v náročném a stresujícím prostředí gastronomie. Nabízíme další vzdělávání, možnost podílet
