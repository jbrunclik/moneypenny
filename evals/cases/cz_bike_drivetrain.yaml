    https://www.velozine.nl/reviews/test-11-42t-cassette-op-shimano-grx-groep-dankzij-wolf-tooth-goat-link/:
      "Published:
      2025-02-24


      *Tekst: Remco van den Heuvel // Foto’s: Arjan Kruik*


      *Met speciale dank aan onze fijne vrienden van Klein Tweewielers voor hun assistentie bij het prepareren
      van de testfiets.*


      ## Vrijwel álle gravelbikes zijn *overgeared…*


      We hebben het op deze site al vaker gezegd en we zullen het blijven zeggen: in onze optiek zijn
      vrijwel álle gravelbikes *overgeared*. Wat we daarmee bedoelen? Simpel: de zware versnellingen op
      de huidige gravelbikes hebben zijn te zwaar. Kijk maar eens goed op welke snelheden je uitkomt als
      je bij een gemiddelde cadans de kleinste drie kransjes schakelt. Maar wie rijdt er werkelijk zó
      snel op een gravelbike?


      Aan de andere kant merken we dat we in steile buitenlandse beklimmingen regelmatig tekortkomen.
      Ja, we fietsen hier op de redactie graag en veel. Maar we hebben ondanks dat niet de bovenbenen
      van André Greipel of het talent van Tadej Pogačar. Als je het fijne wilt weten over het versnellingengebeuren
      op gravelbikes, dan loont het de moeite het artikel even te lezen dat collega Jeroen daarover heeft
      geschreven!


      Alhoewel ik met een dikke 10 duizend kilometer per jaar best wel een veelfietser ben en ik over
      de kracht die m’n benen kunnen leveren eigenlijk niks te klagen heb, overkomt het ook mij zo nu
      en dan dat ik een tandje lichter zou willen schakelen dan m’n versnellingssysteem toelaat. Ik rij
      op een Trek Checkpoint met een Shimano GRX 800-groep. Aan de voorkant zit een dubbel met buiten
      een 48 en binnen een 31. En achteraan is een 11/34-cassette gestoken. Helemaal niks mee op de Brabantse
      zand- en boswegen, mijn gebruikelijke jachtgebied. En ook prima in bijvoorbeeld het Limburgse Heuvelland.
      Maar verder weg, als de beklimmingen langer en steiler worden, dan loop ik met m’n GRX-groep soms
      tegen m’n grenzen aan.



      ## Shimano GRX 800 met 11/42t-cassette?


      Als ik me heb ingeschreven voor de 11 Stuwmerentocht, een tocht van 210 kilometer door de Belgische
      en Duitse Eifel, besluit ik dat ik m’n fiets hiervoor wil uitrusten met lichtere verzetten. Immers,
      die tocht in het midden van de natte en koude herfst is ook met passende versnellingen al zwaar
      genoeg! Maar hoe maak ik de versnellingen op m’n Checkpoint lichter? Natuurlijk, een cassette bestellen
      met grotere kransen is simpel zat. Maar wordt de grootste krans groter dan 34 tanden, dan kan m’n
      GRX 800-derailleur het niet meer aan. Terwijl ik het liefst een 11/40t of zelfs 11/42t-cassette
      zou monteren.


      Een Goat-Link van de Amerikaanse *tuner* Wolf Tooth blijkt de oplossing. Dit aluminium koppelstukje
      tussen de deraileurhanger en de derailleur brengt deze laatste iets verder naar achteren en naar
      benden dan het originele verbindingselement. Daardoor zou de derailleur wél in staat zijn de ketting
      rond grotere kransen te leggen. Wolf Tooth brengt zelfs meerdere Goat-links: de Goat-link 10 is
      iets langer dan de originele Shimano-link, de Goat-link 11 is op zijn beurt weer iets langer dan
      de Goat-link 10. Hoe langer de link, hoe groter de kransen die je derailleur aan zou moeten kunnen.
      De Goat-link 10 zou kransen tot 42 tanden aankunnen, de Goat-link 11 zelfs kransen tot 44 tanden!
      Het onderdeeltje kost 35 euro.


      Naast de twee Goat-links heb ik ook twee cassettes besteld. Een 11/40t en 11/42t, beide van het
      Taiwanese Sunrace. Al eerder had collega Arjan hier goede ervaringen mee opgedaan op zijn 10-speed-gravelbike.
      In de werkplaats van mijn vaste fietsenmaker Klein Tweewielers heb ik alle potentieel zinvolle combinaties
      uitgeprobeerd. Om te beginnen natuurlijk de 11/40t-cassette met de originele derailleur, daarna
      de 11/40t-cassette met een Goat-link 10, dan de 11/42t-cassette met een Goat-link 10 en vervolgens
      diezelfde cassette met de iets langere Goat-link 11.



      ## Snelle een eenvoudige installatie


      Het verruilen van de originele cassette voor een groter exemplaar van Sunrace is uiteraard een routineklusje.
      Maar ook het monteren van de Goat-link is een werkje van niks. Twee inbusbouten loshalen en weer
      vastzetten, dat is all"
