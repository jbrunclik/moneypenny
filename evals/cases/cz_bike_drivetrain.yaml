    https://www.bike-forum.cz/forum/1x11-grx-810-nebo-812:
      "Ahoj, na cyklokrosce potřebují vyměnit Ultegru
      šaltr, za grx a teď jaký

      810,nebo 812, vzadu zůstane kazeta 34z, což dá i 810, ale ta 812 má nějak

      jinak kladku horní? Díky za info


      Chápu to rozdělení, jen nevím zda tam není něco víc za rozdíl

      v těch šaltrech, našel jsem něco o excentrické kladce u 812. Mě jde

      o to abych tam nedával zbytečně dlouhé ramínko , (třeba dnes by to tahal

      v písku ve Veselý zbytečně ????) protože jsem hádal rozdíl jen v délce

      ramének, ale jistý si nejsem, tak si nechám tady rád poradit????


      Obě ramínka jsou hodně dlouhá. Excentrická kladka 812 je tam kvůli

      lepšímu kopírování tvaru 40+ kazety v režimu jednoplacky. Pokud nemáš

      40z+ zubovou kazetu, použij 810 jak doporučuje výrobce.


      No já jsem mu vyndal Ultegrové kliky a dál grx, stim že mu to

      zjednoduším v krosu a ono mu to už 2× spadlo během závodu z toho

      převodníku, po prvním spadnutí,jsem tam dal vodítko a ono to dokáže

      zapadnout mezi něj a převodník a nejde to vyndat a nasadit zpátky do zubů

      ???? tak snad to vyřeší ta hazka"
    https://bike-forum.cz/forum/gravel-1x11-1x12:
      'Zamiloval jsem se do jízdy na gravelu u nás v Jizerkách..
      super

      požitek, kdy si naplno užiju přejezdy na silnici, panelové cesty, šotolinu,

      perk a štěrk a zážitek nezkazí ani občasný kořen, šutr nebo

      drenážní žlab.


      Mám Giant Revolt Advanced 1 a jediné co mě začíná trápit je

      řazení – malý rozsah převodů. Shimano GRX RX600, převody 1×11,

      převodník 40 zubů, kazeta Shimano M7000, 11–42 zubů.


      Na silnicí z kopce chybí fakt těžký převod, v terénu do kopce bych

      zase ocenil o trochu lehčí převod.


      Přemýšlím tedy o přechodu z 11s na 12s, asi ideálně s co

      největším rozsahem (třeba 10–52?).


      Nemám s takovým upgradem žádnou zkušenost – neměl byste někdo

      prosím tipy / triky / zkušenosti jak to nejlépe nakonfigurovat?


      Takže i se spotřebákem máš pod 4 litry vyřešený lehký převody.

      Z kopce zapracuj na kadenci šlapání a nad 50 km/h nech pracovat gravitaci.

      Nebo dej ještě větší převodník, ale to ti zase ubere ty lehké

      převody.


      Doporučuji použít jeden z mnoha kalkulátorů převodů. Protože počet

      kombinací převodů nezaručuje, že krajní převody nebudou dostačovat.

      O progresivního, lineárním, nebo degresivní odstupňování zpřevodovaním

      nemluvě.


      To musíte spočítat sám. Rozhodně není možné si poskládat kazetu tak

      jako za dob 2×9 , stejně rám má omezení jak minimalni tak maximální

      velikosti převodníku. Stejně není normální menší pastorek než 10z a

      největší je omezený přehazovačkou. A to ten 10z pastorek počítá

      ještě s jiným ořechem/nábojem.


      Není problém si to dát do Excelu a spol a vybrat jednu z možných

      variant.


      Vyměnit vodítko na saltru a dat kazetu s větším rozsahem, ale zachovat

      11s. Pak nejtěžší převod doladit prevodnikem. Sram řešení je, nevím

      jestli je to i na Shimano


      Tragédie to není, ale nesmíš být tlustý a musíš mít něco naslapano.

      Jezdil jsem tak několik let. Teď s plus třemi lety, plus patnácti kily a

      mínus 3000km za rok jsem rád za 40/10–44. ;)


      42 prevodnik a 10–42T kazeta je uplna pohoda na normalni jezdeni i pro

      hobika, nevidim sebemensi problem, pokud to kolo nevazi tunu a nejezdi se dlouhe

      stojky. A ten minimalismus a funkcnost je top.


      Tohle je prostě hodně individuální. Desítky let jsem zvyklý točit na

      silnici 11–25 na desítce a teď 11/28 na jedenáctce, což je úplně to

      stejné, jen s jedním pastorkem navíc. Takže větší skoky pak vnímám

      okamžitě a po letošní hodně silniční sezoně mi najednou hodně začala

      vadit i 12 spd kazeta na MTB.


      Rozsah 1× 9,10,11,12 vůbec nevypovídá jestli převodový poměr je

      vyhovující. Zatímco u starého 9×3(9×2) šlo skládat převody velice

      dobře u nového třeba 1×12 omezenim na straně rámu = omezený výběr

