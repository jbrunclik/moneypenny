id: schedule_reminder_confirm
description: >
  After the reminder card, the user's typed yes approves it before the turn
  (the server stores the reminder); the reply confirms the time without
  calling schedule again
proposals:
  - kind: schedule_item
    summary: 'Reminder: "Zavolat instalatérovi"'
    details:
      When: "Wed 15 Mar 2028 08:00 (Europe/Prague)"
      Ends: "then done"
    label: "Set it up"
    payload:
      kind: reminder
      text: "Zavolat instalatérovi"
      next_run_at: "2028-03-15T07:00:00+00:00"
      when: "Wed 15 Mar 2028 08:00"
      ends: "then done"
history:
  - role: user
    content: "Připomeň mi prosím 15. března 2028 v 8 ráno, ať zavolám instalatérovi."
  - role: assistant
    content: "Navrhuji připomínku na středu 15. 3. 2028 v 8:00: „Zavolat instalatérovi“. Potvrď ji na kartě nebo odpověz ano."
user: "Ano."
expect:
  rubric: >
    Confirms in Czech that the reminder to call the plumber is set for
    15 March 2028 at 08:00. Must not claim failure or ask again. A note that
    notifications are off on the user's devices is fine.
  forbidden_tools: [schedule]
  max_tool_rounds: 1
