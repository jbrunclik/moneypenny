id: sports_weather_decision
description: Weather-aware indoor/outdoor training decision
mode: sports
program_kv:
  "cycling:routine": "vikend: 3h venku zona 2"
user: "zitra ma byt pres 33 stupnu. ma vubec smysl jet ty 3 hodiny ven, nebo to mam radsi odjet na trenazeru?"
expect:
  rubric: >
