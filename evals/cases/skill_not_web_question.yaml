      \ of the Czech Armed Forces.<sup>\\[2\\]</sup>\n\nThe presidency has largely been shaped by its\
      \ inaugural holder, Tomáš Garrigue Masaryk, who assumed the office after the Czechoslovak declaration\
      \ of independence was proclaimed in 1918. The 1920 Constitution granted the president substantial\
      \ powers and Masaryk's political strength and popularity enabled the presidency to exert considerable\
      \ influence over the Czech public life.<sup>\\[3\\]</sup><sup>\\[4\\]</sup><sup>\\[5\\]</sup><sup>\\\
      [6\\]</sup> In modern times, the president is largely a ceremonial figure with limited powers as\
      \ the day-to-day business of the executive government is entrusted to the prime minister, and  many\
      \ of the president's actions require prime ministerial approval. Nevertheless, as the bearer of\
      \ the nation's \"Truth prevails\" motto, the presidency is widely viewed to be a significant source\
      \ of prestige, power and moral authority in both domestic and foreign affairs.<sup>\\[7\\]</sup><sup>\\\
      [8\\]</sup><sup>\\[9\\]</sup> The president, seated at the Prague Castle, has oftentimes been perceived\
      \ through the prism of the nation's monarchical past.<sup>\\[10\\]</sup><sup>\\[11\\]</sup> The\
      \ office has retained the power to grant full pardons, commute criminal penalties and issue amnesties.\
      \ The president possesses with a suspensory veto power which can be overridden by an absolute majority\
      \ of the Chamber of Deputies.\n\nThe Constitution provides that the president cannot be held responsible\
      \ for his own conduct, except in cases of treason or high violation against the Constitution.<sup>\\\
      [12\\]</sup> The Parliament maintains the sole power of impeachment and the president may only be\
      \ removed from office by a trial before the Constitutional Court.<sup>\\[13\\]</sup> The president\
      \ is solely responsible for appointing the prime minister, the Cabinet ministers, as well as the\
