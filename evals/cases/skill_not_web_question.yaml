    https://vlada.gov.cz/en/media-centrum/aktualne/the-czech-republic-has-a-new-president--petr-pavel-took-office-204424/:
      "#
      The Czech Republic has a new president. Petr Pavel took office


      **The new President of the Czech Republic, Petr Pavel, took the oath of office on Thursday 9 March
      2023. This took place at a joint meeting of both chambers of Parliament in Vladislav Hall, which
      was also attended by members of the Czech Government, including Prime Minister Petr Fiala.**


      On Thursday, 9 March, shortly after 2 pm, the new president, Petr Pavel, took the oath of office
      to the Constitution of the Czech Republic and thus became the new president. Prime Minister Petr
      Fiala wished the new highest constitutional official to be a successful president and to fulfil
      the great expectations that people have placed in him.


      “President Petr Pavel wants to unite society, respect the Constitution and its spirit, and clearly
      advocates the pro-Western orientation of our country. I look forward to our cooperation and I believe
      that we will work together for the benefit of the Czech Republic and its citizens,” said Prime Minister
      Petr Fiala.


      The ceremonial act of inauguration of the new Czech President was concluded with a Te Deum opus
      by Antonín Dvořák in the Cathedral of St Vitus, Wenceslas and Vojtěch at Prague Castle, accompanied
      by a ceremony honouring the memory of St Wenceslas, the patron saint of the Czech Republic.


      The term of office of the current Czech President Miloš Zeman expired at the stroke of midnight
      on Wednesday, 8 March, to Thursday, 9 March 2023. Thus, his ten years as the highest constitutional
      official of the Czech Republic were completed."
