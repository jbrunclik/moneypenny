      \* Jahresvignette: 106,80 Euro für Pkw | 42,70 Euro für Motorräder


      \* Zwei-Monats-Vignette: 32,00 Euro für Pkw | 12,80 Euro für Motorräder


      \* Zehn-Tages-Vignette: 12,80 Euro für Pkw | 5,10 Euro für Motorräder


      \* 1-Tages-Vignette: 9,60 Euro für Pkw | 3,80 Euro für Motorräder


      Kauf ab 1. Jänner 2027 (plus zwei Prozent):


      \* Jahresvignette: 108,90 Euro für Pkw | 43,60 Euro für Motorräder


      \* Zwei-Monats-Vignette: 32,64 Euro für Pkw | 13,10 Euro für Motorräder


      \* Zehn-Tages-Vignette: 13,10 Euro für Pkw | 5,20 Euro für Motorräder


      \* 1-Tages-Vignette: 9,80 Euro für Pkw | 3,90 Euro für Motorräder


