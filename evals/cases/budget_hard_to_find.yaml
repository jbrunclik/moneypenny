      'Published: 2026-10-25


      - 25.10.2026, 10:05:32

      - /

      - OTS0013


      Valorisierung bleibt mit zwei Prozent bewusst unter der Inflation – neuer Preis erst ab 1. Jänner
      2027 gültig


      Es ist ein klares Zeichen im Sinne der Kundinnen und Kunden beim Umstieg auf die ausschließlich
      Digitale Vignette ab 1. Dezember 2026: Die Preisanpassung der Vignette wird für das kommende Jahr
      mit lediglich zwei Prozent deutlich geringer ausfallen als die aktuelle Teuerung.


      Damit soll der Übergang von der Klebevignette zur Digitalen Vignette zusätzlich erleichtert werden.
      Besonders wichtig: Der neue Vignettenpreis gilt erst ab 1. Jänner 2027. Wer seine neue Digitale
      Vignette 2027 bis spätestens 31. Dezember 2026 kauft, profitiert somit noch vom bisherigen Tarif
      von aktuell 106,80 Euro für die Jahres-Vignette. Das gilt auch für Kundinnen und Kunden mit einem
      bestehenden Vignetten-Abo.


      **Früh umsteigen, günstiger fahren**


      Mit dem Ende der Klebevignette setzt Österreich ab 1. Dezember 2026 vollständig auf das digitale
      System. Um diesen Wechsel möglichst kundenfreundlich zu gestalten, haben alle Autofahrerinnen und
      Autofahrer bis 31. Dezember 2026 die Möglichkeit, die Digitale Vignette für das kommende Jahr noch
      zum bisherigen Preis zu erwerben. Ab 1. Jänner 2027 erfolgt die Preisanpassung um lediglich zwei
      Prozent – damit wird die Jahres-Vignette ab dann 108,90 Euro kosten.


      Die ASFINAG verbindet damit zwei Ziele: einen einfachen, sicheren Umstieg auf das neue System und
      eine Entlastung der Kundinnen und Kunden in der Übergangsphase.


      **Digitale Vignette bereits Standard**


      Schon heute sind mehr als drei Viertel aller Jahres-Vignetten digital. Ab 1. Dezember 2026 werden
      keine Klebevignetten mehr verkauft, ab 1. Februar 2027 gilt auf Österreichs Autobahnen und Schnellstraßen
      ausschließlich die Digitale Vignette.


      Für die Nutzerinnen und Nutzer bleiben alle gewohnten Vignettenprodukte erhalten, die Preisanpassung
      betrifft somit auch lediglich die Vignetten. Gleichzeitig bietet die Digitale Vignette mehr Komfort
      durch die kennzeichenbezogene Verwaltung, den Wegfall des Klebens und Abkratzens sowie einfache
      Änderungen bei Fahrzeug- oder Kennzeichenwechseln.


      Die ASFINAG bereitet den Umstieg auf die Digitale Vignette mit einem umfassenden Ausbau des Vertriebssystems
      und einer Informations-Kampagne vor. Der Verkaufsstart für die Digitale Vignette für das kommende
      Jahr erfolgt Anfang November 2026. Ab dann gekaufte Vignetten sind jedoch erst ab 1. Dezember 2026
      gültig.


