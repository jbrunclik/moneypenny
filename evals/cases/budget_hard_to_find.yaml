    https://vignetteregister.com/slovenia/faq/: "# Slovenia Vignette FAQ


      Frequently asked questions about the Slovenian e-vignette (e-vinjeta)


      For a standard car (height ≤1.3 m, class 2A) the 2026 DARS e-vignette (e-vinjeta) prices are: 7
      days €16, 30 days €32, and 1 year €117.50. Motorcycles (class 1) are cheaper; taller vehicles over
      1.3 m (class 2B) pay more. There is no 1-day option — 7 days is the shortest.


      For a class 2A car: 7 days (€16), 30 days (€32) and annual (€117.50). The 7-day vinjeta is ideal
      for most visits and transit (e.g. Austria↔Croatia). There is no daily vignette in Slovenia.


      A vignette is required on all Slovenian motorways (avtoceste) and expressways (hitre ceste). Key
      corridors include the A1 (Šentilj–Koper), A2 (Karavanke–Ljubljana–Obrežje), and routes around Ljubljana.
      Ordinary national and regional roads do not require a vignette.


      Yes. Motorcycles are subject to the vignette obligation in Slovenia, but they fall under a separate
      lower-price category (class 1). The price for motorcycles is different from that of passenger cars
      — our registration form will guide you through the correct category.


      No. Electric vehicles registered as passenger cars must purchase a vignette at the same rates as
      petrol or diesel vehicles. Vehicles over 3.5 tonnes are exempt from the vignette (they use a separate
      DarsGo transponder system), as are emergency and state vehicles.


      The on-the-spot fine for driving without a valid e-vignette on Slovenian motorways is €300 for passenger
      vehicles. Enforcement is continuous — there is no grace period. The automated camera system flags
      vehicles without a registered vignette in real time.


      For the 7-day and 30-day options you choose your start date at purchase — the vignette is valid
      from that date. For the annual vignette purchased through our service, validity starts on your selected
      date. There is no mandatory waiting period after purchase.


      Slovenia uses height-based categories: class 2A for vehicles up to 1.3 m (standard passenger cars),
      and class 2B for vehicles over 1.3 m (high-roof vans, SUVs with roof boxes, motorhomes). Class 2B
      vignettes are priced higher. When registering, make sure to select the correct height category for
      your vehicle.


      DARS (Slovenian Motorway Company) operates a fully digital camera-based enforcement system. Cameras
      installed at motorway entry points read your license plate and check it against the vignette database
      in real time. There is no physical sticker — your plate number is your proof. Traffic police can
      also perform checks using handheld devices.


      Yes. The Slovenian motorway approach (A2) to the Karawanken Tunnel requires a Slovenian e-vinjeta.
      The Austrian side requires a separate Austrian vignette, and the tunnel itself has its own toll.
      The vinjeta covers the Slovenian motorway, not the tunnel toll.


      The e-vinjeta is fully electronic since 2021 — buy it online at evinjeta.dars.si before travel,
      or at petrol stations and kiosks near the border (Karawanken, Obrežje, Fernetiči). No sticker; your
      plate is active within minutes.


      Cars rented in Slovenia normally include a valid vinjeta — confirm with the rental company. A car
      rented abroad (e.g. Austria, Italy or Croatia) will NOT have one, so register before using Slovenian
      motorways (avtoceste).


      Enter your plate in the checker at evinjeta.dars.si to see the active class, period and expiry.
      Make sure you bought the right height class (2A vs 2B) — buying 2A for a 2B vehicle counts as having
      no valid vignette. The price is the same for foreign plates."
