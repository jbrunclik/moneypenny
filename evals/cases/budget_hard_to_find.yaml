    https://autoscena.cz/clanky/elektronicka-dalnicni-znamka-ceny-pravidla:
      "Published: 2026-11-18\n\n\
      **Ceny dálničních známek pro osobní auta zůstávají v roce 2027 stejné jako v roce 2026: roční 2\
      \ 570 Kč, 30denní 480 Kč, 10denní 300 Kč a jednodenní 230 Kč. Jednodenní známka od 1. 1. 2027 platí\
      \ 24 hodin od zvoleného začátku, ne jen do půlnoci. Roční známka se vyplatí zhruba od dvanáctého\
      \ dne jízdy po zpoplatněných úsecích za rok.**\n\n## Co platí teď a co se mění od 1. ledna 2027\n\
      \nDo konce roku 2026 platí ceník, který je v e-shopu státu uvedený s platností od 1. 1. 2026. Jednodenní\
      \ známka platí podle starých pravidel do konce zvoleného kalendářního dne. Dnes platí jen do půlnoci\
      \ dne, pro který je koupená.\n\nNovelu zákona č. 13/1997 Sb., o pozemních komunikacích, schválila\
      \ Poslanecká sněmovna ve třetím čtení a klíčovou změnou je konec automatického zdražování. Sněmovna\
      \ hlasovala 23. 9. 2026 a prezident novelu podepsal 4. 11. 2026. Účinnost je od 1. 1. 2027.\n\n\
      Novela mění dvě věci:\n\n- **Ceny:** ruší se automatická každoroční valorizace. Pro rok 2027 platí\
      \ stejné sazby jako v roce 2026 (2 570 / 480 / 300 / 230 Kč).\n- **Jednodenní známka:** od účinnosti\
      \ novely platí 24 hodin od zvoleného začátku. Kdo vyjede večer a přejede půlnoc, nemusí kupovat\
      \ druhou známku.\n\nZrušení valorizace neznamená, že ceny nikdy nevzrostou. Změnit je může další\
      \ novela zákona. Pro rok 2027 jsou ale sazby dané.\n\n## Ceník dálničních známek a ekologické slevy\
      \ (k 18. 11. 2026)\n\nCeny pro osobní auta do 3,5 tuny jsou podle oficiálního e-shopu stejné pro\
      \ rok 2026 (ceník od 1. 1. 2026) i pro rok 2027 (od 1. 1. 2027, podle novely). Sloupec „1 den /\
      \ 24 h\" znamená v roce 2026 jednodenní známku do půlnoci, v roce 2027 známku na 24 hodin.\n\n|\
      \ Pohon vozidla | Roční | 30denní | 10denní | 1 den / 24 h | \n|---|---|---|---|---|\n| Benzín,\
      \ nafta, LPG (standardní palivo) | 2 570 Kč | 480 Kč | 300 Kč | 230 Kč | \n| CNG a LNG (neplatí\
      \ pro LPG) | 1 280 Kč | 240 Kč | 150 Kč | 110 Kč | \n| Biometan | 1 280 Kč | 240 Kč | 150 Kč | 110\
      \ Kč | \n| Plug-in hybrid (CO₂ max 50 g/km) | 640 Kč | 120 Kč | 70 Kč | 50 Kč | \n| Elektromobil,\
      \ vodík | 0 Kč | 0 Kč | 0 Kč | 0 Kč | \n\nZdroj: oficiální ceník eDalnice.gov.cz, údaje k 18. 11.\
      \ 2026; ceny 2027 podle tiskové zprávy Ministerstva dopravy o schválené novele.\n\n### Jak slevy\
      \ fungují\n\nCNG, LNG a biometan mají 50% slevu. Platíte tedy polovinu standardní ceny. Sleva se\
      \ netýká LPG. Plug-in hybridy s emisemi CO₂ nejvýše 50 g/km platí 25 % standardní ceny, což je sleva\
      \ 75 %. Podle e-shopu státu u ročního poplatku činí sazba pro plug-in hybrid 640 Kč.\n\nPodmínkou\
      \ slevy u plug-in hybridu je emisní hodnota 50 g/km nebo méně. U vozu s vyšší hodnotou platí standardní\
      \ sazba. O tom, proč se laboratorní a reálné emise plug-in hybridů liší, píšeme v samostatném článku\
      \ o reálných emisích CO₂ plug-in hybridů oproti WLTP.\n\nNovela podle ministerstva slevy pro plug-in\
      \ hybridy a vozidla na CNG a LNG zachovává. Pro elektromobily a vodík se také nic nemění.\n\n##\
      \ Koho se povinnost týká a kdy je auto osvobozeno\n\nElektronická známka je povinná pro motorová\
      \ vozidla nejméně se čtyřmi koly a s nejvyšší povolenou hmotností nejvýše 3,5 tuny. Nevztahuje se\
      \ na přípojná vozidla a motocykly. Známka platí pro konkrétní registrační značku, ne pro řidiče.\n\
      \n### Automatické osvobození (vozidla registrovaná v ČR)\n\nPodle přehledu osvobozených vozidel\
      \ na eDalnice.gov.cz jsou v ČR osvobozena:\n\n- vozidla výlučně na elektřinu nebo vodík,\n- vozidla\
      \ přepravující držitele českého průkazu ZTP nebo ZTP/P, pokud je provozovatelem postižená osoba\
      \ nebo osoba jí blízká,\n- vozidla k přepravě nezaopatřených dětí léčených pro zhoubný nádor nebo\
      \ hemoblastózu,\n- historická vozidla se zvláštní registrační značkou a průkazem historického vozidla.\n\
      \nU elektromobilů a vodíkových aut registrovaných v ČR se sazba 0 Kč uplatní automaticky. Nemusíte\
      \ nic kupovat ani posílat. Pokud elektromobil teprve vybíráte, orientační nabídku najdete v článku\
      \ o ceně MG4 EV Urban v Česku.\n\n### Oznamované osvobození (vozidla registrovaná v zahraničí)\n\
      \nPro vozidla registrovaná v zahraničí je nutné podat oznámení osvoboz"
    https://usetril.cz/dalnicni-znamka/:
      "Published: 2026-11-13\n\n**Roční dálniční známka bude v roce\
      \ 2027 stát stejně jako letos: 2 570 Kč.** Novela zákona o pozemních komunikacích, kterou prezident\
      \ podepsal 4. 11. 2026, zrušila každoroční automatické zdražování a ceny zapsala přímo do zákona.\
      \ Nejkratší známka za 230 Kč se od 1. 1. 2027 mění z jednodenní na 24hodinovou. Níže najdete všechny\
      \ ceny, přepočet, kdy se vám vyplatí roční a kdy krátká známka, srovnání se Slovenskem a Rakouskem\
      \ a postup, jak známku koupit bez zbytečných poplatků.\n\n## Ceny dálničních známek 2027\n\nSazby\
      \ platí od 1. 1. 2027 podle nového znění § 21 odst. 3 až 5 zákona č. 13/1997 Sb. (sněmovní tisk\
      \ 246). Jsou totožné s ceníkem platným od 1. 1. 2026, který dnes uvádí e-shop eDálnice i Česká pošta.\
      \ Týkají se vozidel do 3,5 tuny.\n\n| Pohon vozidla | Roční | 30denní | 10denní | 24hodinová | \n\
      |---|---|---|---|---|\n| Benzín, nafta, LPG a ostatní | 2 570 Kč | 480 Kč | 300 Kč | 230 Kč | \n\
      | Zemní plyn (CNG, LNG) a biometan | 1 280 Kč | 240 Kč | 150 Kč | 110 Kč | \n| Plug-in hybrid s\
      \ emisemi CO₂ do 50 g/km | 640 Kč | 120 Kč | 70 Kč | 50 Kč | \n| Čistý elektromobil nebo vodík |\
      \ 0 Kč | 0 Kč | 0 Kč | 0 Kč | \n\nV přepočtu vychází roční známka na **7,04 Kč za den**, respektive\
      \ zhruba 214 Kč za měsíc. U aut na zemní plyn je to polovina, u plug-in hybridů s nízkými emisemi\
      \ čtvrtina.\n\n### Co se v roce 2027 opravdu mění\n\n- **Konec automatického zdražování.** Dosud\
      \ se cena každý rok přepočítávala podle inflace a přírůstku kilometrů dálnic. Novela tyto odstavce\
      \ zákona ruší, takže další zdražení by musel schválit parlament.\n- **Známka na 24 hodin místo jednodenní.**\
      \ Dnes platí nejkratší známka jen do půlnoci zvoleného dne. Od ledna 2027 bude platit 24 hodin,\
      \ cena zůstává 230 Kč.\n- **Žádné sdělení ministerstva o nové ceně.** Přechodné ustanovení, účinné\
      \ od 30. 11. 2026, říká, že ministerstvo dopravy letos cenu na příští rok nevyhlašuje.\n\nPro srovnání:\
      \ do roku 2023 stála roční známka 1 500 Kč, v roce 2024 2 300 Kč, v roce 2025 2 440 Kč a v roce\
      \ 2026 2 570 Kč. Za tři roky tedy podražila o 1 070 Kč, tedy o 71 %. Rok 2027 je tak první rok bez\
      \ zdražení od roku 2023.\n\n## Kdy se vyplatí roční a kdy krátká známka\n\nProtože se cena v lednu\
      \ nemění, nemusíte řešit „poslední den za starou cenu“. Rozhoduje jen to, kolikrát za rok po dálnici\
      \ opravdu jedete. Spočítali jsme, kde leží hranice:\n\n| Když jezdíte… | Krátké známky | Roční 2\
      \ 570 Kč | Vyplatí se | \n|---|---|---|---|\n| 1× za rok na dovolenou | 1× 10denní = 300 Kč | 2\
      \ 570 Kč | 10denní, ušetříte 2 270 Kč | \n| dovolená + Vánoce u rodiny | 2× 10denní = 600 Kč | 2\
      \ 570 Kč | 10denní, ušetříte 1 970 Kč | \n| 8 výjezdů za rok (každý do 10 dnů) | 8× 300 = 2 400\
      \ Kč | 2 570 Kč | ještě krátké, rozdíl 170 Kč | \n| 9 a více výjezdů za rok | 9× 300 = 2 700 Kč\
