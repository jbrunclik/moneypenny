      **Roční dálniční známka bude od 1. ledna 2027 stát 2 570 korun, stejně jako letos. Novela totiž
      ruší automatické zdražování podle inflace a ceny píše přímo do zákona. Jednodenní známka za 230
      korun nově zůstane platná 24 hodin od zakoupení, ne jen do půlnoci.**


      **Video: Dálniční známka 2027 jasně a srozumitelně**


      **Kolik jednotlivé známky stojí**


      Podle přehledu Cebie se ceny nemění u žádné z běžných známek. Roční zůstává na 2 570 Kč, 30denní
      na 480 Kč, 10denní na 300 Kč a jednodenní na 230 Kč.


      Od roku 2025 se cena přepočítávala každý rok podle inflace a délky sítě. Roční známka stála do roku
      2023 1 500 Kč, v roce 2024 2 300 Kč, v roce 2025 2 440 Kč a letos 2 570 Kč. Novela tento mechanismus
      od ledna 2027 ruší. Další zdražení bude muset projít samostatnou změnou zákona.


      **Co se mění u jednodenní známky**


      Dnes jednodenní známka platí jen do půlnoci zvoleného dne. Kdo ji koupí večer, má z ní jen pár hodin.
      Od 1. ledna 2027 bude platit 24 hodin od koupě, případně od pozdějšího začátku, který si zvolíte
      nejpozději 30 dní po zaplacení.


      Změna pomůže hlavně řidičům, kteří vyjíždějí odpoledne nebo večer a vracejí se druhý den. Jak přesně
      půjde začátek nastavit v e-shopu eDalnice.gov.cz, web zatím neuvádí. Ceník pro rok 2027 tam také
      zatím chybí, ukazuje ceny platné od 1. ledna 2026, které jsou stejné.


      **Elektromobily a hybridy**


      Osvobození elektromobilů zůstává. U aut registrovaných v Česku platí automaticky, u zahraniční registrace
      je nutné ho oznámit Státnímu fondu dopravní infrastruktury. Plug-in hybridy s emisemi do 50 g CO₂/km
      platí nižší ceny: roční 640 Kč, 30denní 120 Kč, 10denní 70 Kč a 24hodinová 50 Kč. Auta na plyn platí
      roční 1 280 Kč, 30denní 240 Kč, 10denní 150 Kč a 24hodinovou 110 Kč. Přehled registrací elektroaut
      v Česku ukazuje, že mají zatím 7,4 procenta.


      **Jak novela prošla a proč se ceny nezvyšují**


      Novelu zákona o pozemních komunikacích podepsal prezident 4. listopadu 2026 a účinná je od 1. ledna
      2027. Poslanecká sněmovna ji schválila a 29. září ji postoupila Senátu. Podle Cebie Senát novelu
      neprojednal a nepřijal k ní žádné usnesení. Protože se do 30 dnů nevyjádřil, platí za přijatou.
      Zdroje v této části nejsou jednotné, proto doporučujeme sledovat Sbírku zákonů.


      Ministr dopravy Ivan Bednárik podle ČTK uvedl, že česká roční známka je zhruba o 1,5 eura levnější
      než rakouská. S dalším automatickým zdražením by byla od ledna 2027 asi o 200 korun dražší. Rakousko
      přitom od dálničního roku 2027 zavádí jen digitální známku za 108,90 eura.


      **Kdy kupovat novou**


      Roční známka platí rok od dne, který si zvolíte, a není vázaná na kalendářní rok. Pokud vám končí
      v listopadu nebo prosinci, kupte novou s navazující platností. Začátek jde nastavit až 30 dní dopředu.
      Jízda bez platné známky vyjde na pokutu do 5 000 Kč na místě a do 20 000 Kč ve správním řízení.
      Na dálnici navíc dávejte pozor i na pravidla pro levý pruh.


