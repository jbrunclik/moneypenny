      ### Ovládací prvky výpisu


      **11**položek celkem


      Skládací kola jsou v současnosti velkým hitem a kola značky Brompton tomu velmi napomáhájí, neboť
      se jedná o tradiční výrobek, který se vyrábí již více než 35 let. Značka Brompton sídlí a vyrábí
      svá kola v Anglii, což je sice důvodem vyšší ceny, ta je však výsledkem prvotřídního ručního zpracování
      materiálů. Navíc jsou tato anglická skládací kola velmi elegantní a stylová, jezdci na Bromptnu
      často jezdí v obleku s cilindrem, dámy v retro pumpkách nebo šatech. Brompton komunita se pravidelně
      účastní závodů skládacích kol Brompton v Londýně nebo podniká expedice, zkrátka být Bromptnista
      je hrdost. Toto skládací kolo je také ověnčeno cenou britské královny Alžběty II. za přínos v zahraničním
      obchodu.


      **Proč si vybrat skládací kolo Brompton**


      Jednoduchost, funkčnost, rychlost, variabilita a nízká poruchovost. To jsou všechno faktory, které
      zaručeně přesvědčí zákazníky o koupi skládacího kola Brompton. V jedné minutě svižné kolo, s kterým
      nemusíte stát kolonu cestou na vlakové nádraží, a za dalších 10 sekund složené kolo o velikosti
      větší nákupní tašky, které se vejde do kufru i malého auta, nepřekáží ve vlaku a dobře ho uskladníte
      i v malém bytě. Veškeré prvky na této skládačce dávají smysl a jsou důmyslně propracované pro pohodlné
      a časté používání. Aby složený Brompton nepadal, má na rámu návarky s připevněnými kolečky, a tak
      i složené kolo můžete vézt a není třeba ho nosit. Pokud se Brompton složí jen částečně a nechají
      se nesložená řídítka, lze díky zmíněným kolečkům táhnout skládačku za sebou jako kufr na kolečkách,
      což ocení zvláště dámy na dlouhých nástupištích nebo třeba v supermarketu.


      Cyklisté, kteří používají jízdní kolo jako dopravní prostředek, potřebují i přepravní prostor. Na
      to samozřejmě u Bromptna mysleli, a tak lze kolo již rovnou zakoupit s originálním zadním nosičem,
      šikovně je i vymyšleno připevňování přední brašny S-bag nebo skládacího košíku na adaptér s nacvakáváním.
      Pro jezdce z vyšší postavou nad 190 cm doporučujeme teleskopickou sedlovou trubku a pro pohodlnou
      přepravu kola lehký obal. Žádný z doplňků nebrání skládání tohoto v pravdě geniálního skládacího
      kola.


      Ačkoli má skládací kolo Brompton odpruženou zadní stavbu, lépe se hodí do měst a na rovné povrchy
      silnic a cest, kde určitě oceníte velmi nízký valivý odpor a snadnou, rychlou jízdu. Kvalita zpracování
      je prvotřídní s důrazem na dlouhodobou životnost veškerých komponentů. Skládačky Brompton mají minimum
      závad a reklamací, a tak lze směle říci, že toto je skládací kolo na celý život!"
