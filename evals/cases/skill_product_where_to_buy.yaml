      **Typ M** s výše posazenými řídítky vyhovuje většině uživatelů. Výška řídítek je 1015 mm.




      **Typ H** nabízí nejvíce vzpřímený posed a je tak vhodnou volbou pro vyšší postavy. Výška řídítek
      je 1075 mm.





