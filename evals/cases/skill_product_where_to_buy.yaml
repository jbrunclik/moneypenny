      Velikost jízdního kola se odvíjí od výšky řídítek. V nabídce jsou zpravidla tři typy, ze kterých
      můžete vybírat.




      **Typ S** má rovná řídítka a je vhodný pro jezdce menšího vzrůstu nebo ty, kteří preferují více
