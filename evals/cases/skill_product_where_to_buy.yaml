      ## Skládací kolo Brompton C Line 12Speed, Black/Black


      **Brompton C Line 12Speed je špičkové skládací kolo**, které kombinuje ikonický design značky **Brompton**
      a široký rozsah převodů. Je ideální pro městské dojíždění, delší výlety a kombinaci s veřejnou dopravou.


      **Za méně než 20 sekund se promění z dopravního prostředku na malý kompaktní balíček**. Snadno se
      zvedá, přenáší i skladuje. Můžete si ho vzít do vlaku, zastrčit do kufru auta nebo pod stůl v restauraci.
      Můžete na něj přidat zavazadla, nosič a dokonce i uložit sadu nářadí uvnitř rámu.


      **Spojením 3stupňové nábojové převodovky a 4stupňové přehazovačky vznikl rozsah převodů 402 %**,
      který se vyrovná klasickým trekingovým kolům. S tímto kolem zvládnete prudká stoupání i městské
      sprinty bez kompromisů.


      Přenositelnost klasického kola Brompton posouvá na zcela novou úroveň díky pokročilému zadnímu rámu,
      který umožňuje **přesouvat složené se sedlovkou zajištěnou v polovině výšky.**


      **Upozornění:** Foto je pouze ilustrativní, příslušenství se může lišit.



      ### **Hlavní přednosti:**


      **1) Jedinečný skládací systém**


      Jednou z největších předností jízdního kola Brompton je unikátní skládací systém, díky kterému se
      vejde i do kufru velmi malého auta. Se složeným kolem Brompton navíc můžete cestovat vlakem bez
      potřeby příplatku za zavazadlo. Složení a rozložení kola Brompton je navíc velmi jednoduché a intuitivní,
      takže jej zvládne opravdu každý.


      **2) Praktické příslušenství**


      Kola Brompton lze doplnit o řadu praktického příslušenství, které vám usnadní život. Mezi nejoblíbenější
      doplňky patří zadní nosič, přední brašny a světla. Pro jezdce vyšší postavy nad 190 cm doporučujeme
      pořízení teleskopické sedlovky Brompton.


      **3) 12stupňová převodovka**


      Kombinací 3stupňové nábojové převodovky a 4stupňové přehazovačky získáte široký rozsah převodů.
      Ideální do kopců, na dlouhé cesty i svižné přelety městem.


      **4) Nový zadní rám**


      Brompton nyní můžete přesouvat pohodlně se sedlovkou zajištěnou v polovině. Nová, větší a lepší
      kolečka Roller Wheels snadněji překonávají překážky.



