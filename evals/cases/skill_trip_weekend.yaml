      ### Expresní skibus z Prahy do Špindlerova Mlýna


      Nechce se Vám k nám do Špindlu řídit? Přijeďte autobusem CITY SKI! **Skiareál Špindlerův Mlýn spolu
      se CITY SKI Vám nabízejí komfortní odvoz na hory za super cenu.** Cesta autobusem CITY SKI šetří
      přírodu i Vaši peněženku. Součástí zájezdů CITY SKI je zábava, soutěže, seznamka a další služby
      vytvářející neopakovatelnou atmosféru lyžařské komunity. Každý účastník zájezdu obdrží v ceně zájezdu
      zpáteční dopravu, celodenní skipas a lyžařský časopis.


      ### Balíček BUS + SKIPAS:


      **1350 Kč** ve vedlejší sezoně


      **1600 Kč** v hlavní sezoně


      Tato cena je jednotná pro všechny lyžaře a nevztahují se na ni další slevy. K této ceně každý účastník
      zaplatí ještě padesát korun jako zálohu za skipas. Tuto zálohu obdrží každý účastník zpět po vrácení
      skipasu přímo na kase střediska.


      **ODJEZDOVÉ MÍSTO** >>> Praha, stanice metra Palmovka


      **ČAS ODJEZDU** >>> 7:00


      **PŘÍJEZD** >>> spodní stanice lanovky Hromovka kolem 9:00


      **ZPÁTEČNÍ CESTA** >>> odjezd ze Špindlerova Mlýna je v 16:15


      Autobusy CITY SKI vyrážejí z Prahy pravidelně o víkendech i ve všední dny během celé sezony. Příležitostně
      jsou vypravovány jednodenní zájezdy také z Pardubic z možností nástupu v Hradci Králové. Většinou
      jednou za sezonu je také vypraven víkendový zájezd do Špindlu z Brna.


      Termíny všech zájezdů, rezervace a veškeré další informace o službě CITY SKI naleznete na **www.cityski.cz**


