    https://www.explorio.cz/magazin/521-krkonose-s-detmi-v-lete-v-zime-i-v-desti:
      "# Krkonoše s dětmi:
      v létě, v zimě i v dešti


      Krkonoše jsou nejnavštěvovanějšími horami v ČR a proto vás tu také na každém kroku čeká plno aktivit
      pro rodiny s dětmi i obrovský výběr hotelů, restaurací, penzionů, apartmánů a chalup k pronájmu.


      ### S dětmi na Sněžku


      Zdolání naší nejvyšší hory byste si s dětmi rozhodně neměli nechat ujít. Pokud se necítíte na výšlap
      až nahoru pěšky, jeďte lanovkou. Vybrat si můžete jednosměrnou, nebo zpáteční jízdenku. Lanovka
      staví ještě ve stanici Růžohorky, můžete vystoupit zde a užít si závěrečné stoupání. Z parkoviště
      v Peci pod Sněžkou vede k lanovce **krátká trasa plná úkolů** a před spodní zastávkou lanovky je
      **velké dětské hřiště**.


      Ovšem **hřiště s nejkrásnějším výhledem** najdete u horní stanice lanovky Medvědín.


      ### Trasy i pro kočárek


      Netroufáte si se svým kočárkem do hor? Nemějte strach, v Krkonoších je mnoho tras, které zvládnete
      i bez terénního kočárku. Podívejte se na tipy z minulého článku.


      ### Stezka Korunami stromů


      Stezka korunami stromů je otevřená celý rok. Na okolní lesy se podíváte ze **45 metrů vysoké věže**
      a cestou se zábavnou formou dozvíte zajímavosti o okolní přírodě.


      ### Herní krajina Pecka


      Odvážíte se dát hlavu do tlapy rysa nebo se utkat s obřími mravenci? Na Portáškách to můžete vyzkoušet
      v Herní Krajině Pecka s dřevěnými interaktivními sochami a objekty na motivy krkonošské fauny. **Vstup
      je zdarma** a dostanete se sem pěšky, nebo lanovkou z Velké Úpy.


      ### Přehrada Les Království


      Znáte tuhle přehradu, co vypadá jako z pohádky? Určitě stojí za návštěvu. Dostanete se sem velmi
      snadno, silnice vede přímo po hrázi a na obou stranách najdete malá parkoviště. Okolím vás provedou
      značené naučné stezky.


      ### Sjezdovky pro zkušené lyžaře i úplné začátečníky


      Z lyžařských areálů v Krkonoších si vybere opravdu každý. Začínající malé lyžaře vezměte třeba do
      Kidparku Mladé Buky, dětské části skiareálu Herlíkovice nebo dětských skiparků ve Skiareálu Špindlerův
      Mlýn. Mnoho lanovek jezdí i mimo lyžařskou sezónu a usnadní vám tak cestu na vrchol. Přehled lanovek
      a informace, které jsou aktuálně v provozu, najdete na oficiálních webových stránkách Krkonoš.


      ### A co když venku prší?


      Ani za nepříznivého počasí se v Krkonoších s dětmi nudit nebudete. Ve Špindlerově Mlýně mají Lego
      muzeum i s hernou plnou kostiček. Ve Svobodě nad Úpou můžete navštívit Krakonoše. Kromě interaktivního
      muzea tu najdete i kavárničku s dětskou hernou. Jak vypadal kdysi život v horách? To se dozvíte
      v Krkonošském muzeu ve Vrchlabí."
    https://stare.krkonose.eu/co-delat-kdyz-v-krkonosich-prsi:
      "## Tradiční krkonošská řemesla na vlastní
      ruce


      Buďte nejen návštěvníkem, ale také tvůrcem a pište chvíli historii tradičních krkonošských řemesel.


      Každé malé dítě ví, že krkonošskému počasí vládne od nepaměti Krakonoš. Když zrovna zalévá horskou
      krajinu a plní bystřiny vodou, češe louky a lesy prudkým větrem nebo pouští to údolí neprostupnou
      mlhu, je čas nechat pohorky větrat a oddat se novým dobrodružstvím.


      Vyzkoušejte tradiční řemesla, poznejte krkonošskou historii. Odpočněte si a dopřejte odpočinek i
      horské přírodě."
    https://ceskehory.info/krkonose/spindleruv-mlyn/: "## Kdy do Špindlu vyrazit


      **V zimě** je Špindl největší lyžařské středisko české strany Krkonoš. O víkendech v hlavní sezóně
      se parkoviště P1–P3 plní brzy ráno, takže kdo jede autem na den, má vyrazit co nejdřív. Klidnější
      lyžování je mimo prázdniny.


      Počítejte i s větrem: lanovka na Pláň ve Svatém Petru má povolenou rychlost větru 18 m/s a kritickou
      20 m/s. Za větrných dnů je jistější Medvědín nebo Hromovka.


      **V létě** jezdí lanovky na Medvědín a ve Svatém Petru, takže se na hřebeny dostanete bez velkého
      převýšení.


      ## Lyžování


      Skiareál Špindlerův Mlýn provozuje společnost Tatry mountain resorts a uvádí zhruba **27 km sjezdovek**
      v pěti areálech: **Svatý Petr, Medvědín, Hromovka, Horní Mísečky a Labská**. Je to jedno z mála
      středisek u nás, kde se dá lyžovat celý týden bez opakování stejných tratí. Detail sjezdovek a mapu
      najdete na stránce Skiareál Špindlerův Mlýn.


      - **Svatý Petr** – nejnáročnější část, vede sem vyhřívaná šestisedačková lanovka na Pláň. Červené
      a černé sjezdovky včetně tratě na Stohu.

      - **Medvědín** – sedačková lanovka z dolní části města, nahoře restaurace ve výšce 1 235 m. Široké
      modré a červené tratě pro rodiny a středně pokročilé.

      - **Hromovka** – vstupní areál u parkoviště P2 se čtyřsedačkovou lanovkou. Červená a modrá sjezdovka
      ho propojují se Svatým Petrem, červená bývá osvětlená pro večerní lyžování.

      - **Horní Mísečky** – mírnější svahy, funpark a Burton snowpark.


      ## Kolik to stojí


      - **Skipas:** prodává se přes **Gopass** s dynamickými cenami, takže se liší podle dne a podle toho,
      jak dlouho předem kupujete. Nejlevnější je nákup online s předstihem, nejdražší pokladna v den lyžování.
      V sezóně 2025/26 stál denní skipas pro dospělého na pokladně **1 690 Kč**, online od **820 Kč**
      (Echo24). Denní ceny na zimu 2026/27 ukáže Gopass až pro konkrétní den.

      - **Sezónka Gopass SKI 2026/27:** pro dospělého od 16 490 Kč (gopass.travel, stav 28. 10. 2026).
      Srovnání s ostatními areály je v cenách skipasů.

      - **CITY SKI z Prahy** (autobus + celodenní skipas): 1 350 Kč ve vedlejší a 1 600 Kč v hlavní sezóně,
      k tomu záloha 50 Kč za kartu.

      - **Parkování v centru** (P Centrum, P Bobová dráha, P JIP Potraviny): 1 h 50 Kč, 2 h 100 Kč, 3
      h 200 Kč.

      - **Parkování Horní Mísečky:** 15 minut zdarma, 1 h 30 Kč, celý den 300 Kč.

      - **Lanovky v ceně pobytu:** některé hotely je nabízejí, podmínky jsou na webu skiareálu v sekci
      „Lanovky zdarma“.


      ## Kde se ubytovat


      Ubytování je rozložené mezi **centrum, Svatý Petr, Bedřichov a Horní Mísečky**. Z centra a od Svatého
      Petra dojdete k lanovkám pěšky, což se v zimě vyplatí nejvíc. Horní Mísečky jsou klidnější a blíž
      k běžkám a snowparku, ale do centra je to dál. Nabídky Bookingu a pobyty se slevou ze Slevomatu
      porovnáte níže na stránce.


      ## 14 tipů, co ve Špindlu dělat


      1. **Pramen Labe** – klasický celodenní výlet údolím Labe nebo přes Labský důl.

      2. **Labská přehrada** – krátká procházka od Bílého mostu v centru.

      3. **Čertova strouha** – naučná stezka zakončená u boudy U Bílého Labe.

      4. **Hřebenovka na Výrovku** – túra Špindlerův Mlýn – Výrovka – úbočí Stohu.

      5. **Špindlerova bouda – Moravská bouda** – kombinace pěší trasy a autobusu.

      6. **Hornická stezka** v Údolí Svatého Petra.

      7. **Mlynářovy okruhy** – procházky od infocentra.

      8. **Sněžka** – dlouhý výšlap po hřebenech.

      9. **Přes hřeben do Polska** – po cestě česko-polského přátelství, při dvoudenní túře se dá sejít
      do Przesieky pod Karkonošským sedlem.

      10. **Běžky** – skiareál upravuje kolem 90 km běžeckých tratí, na Horních Mísečkách jsou závodní
      okruhy 1, 2, 5 a 10 km.

      11. **Burton snowpark** na Horních Mísečkách.

      12. **Večerní lyžování** na osvětlené červené sjezdovce na Hromovce.

      13. **Bobová dráha** v Bedřichově (Bedřichov 127).

      14. **Elektrokola** – dají se půjčit přímo ve Špindlu.


      ## Špindl s dětmi


      Na lyžích jsou pro děti nejlepší široké modré tratě na **Medvědínu** a mírné svahy na **Horních
      Mísečkách**. Mimo sjezdovky je tu **bobová dráha**, **Adventure Park** a u Medvědína dětská hřiště,
      trampolíny, kuličková dráh"
