        # Krkonoše, Podkrkonoší - výlety s dětmi


        Krkonoše jsou nejvyšším pohořím České republiky rozkládajícím se v severovýchodních Čechách a na
        jihu Polska. Nejvyšší hora Sněžka (1602 m) leží na Česko-polské hranici. Na území Krkonoš se nachází
        Krkonošský národní park (KRNAP) založený v roce 1963. Organizace spojených národů pro vzdělání,
        vědu a kulturu vyhlásila v roce 1992 Krkonoše za biosférickou rezervaci UNESCO.


