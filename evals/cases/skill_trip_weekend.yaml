    https://www.mamanacestach.cz/krkonose-s-detmi/:
      "Published: 2026-08-20\n\n**Krkonoše s dětmi nejsou\
      \ jen výstup na Sněžku. Rodinám nabízejí vodopády, lanovky, krátké naučné stezky, dětská hřiště\
      \ i trasy, které zvládnete s terénním kočárkem. Nejdůležitější je vybrat jednu část hor, nepřeplnit\
      \ program a před každým výletem zkontrolovat počasí a omezení v národním parku.**\n\nV průvodci\
      \ najdete ověřené tipy na výlety, doporučení podle věku dětí, praktické informace k lanovkám, ubytování\
      \ i jednoduchý plán na tři dny. Provozní informace byly ověřeny v srpnu 2026. Otevírací dobu, jízdní\
      \ řády a stav cest si vždy zkontrolujte těsně před návštěvou.\n\n## Krkonoše s dětmi rychle a přehledně\n\
      \n| Otázka | Doporučení | \n|---|---|\n| Kolik dní | 3 až 5 dní v jedné části hor | \n| Nejlepší\
      \ základna | Harrachov, Špindlerův Mlýn, Pec pod Sněžkou nebo Janské Lázně | \n| S malými dětmi\
      \ | Mumlavský vodopád, Stezka korunami stromů a kratší údolní trasy | \n| Se školáky | Sněžka, Černohorské\
      \ rašeliniště, Labský důl a pevnost Stachelberg | \n| Co hlídat | Počasí, vítr, provoz lanovek a\
      \ aktuální uzavírky cest | \n\n## Kterou část Krkonoš zvolit\n\n- **Harrachov:** Mumlavský vodopád,\
      \ hornické muzeum, bobová dráha a výlety do západních Krkonoš.\n- **Špindlerův Mlýn:** dobré zázemí,\
      \ lanovky, Labský důl a trasy různých délek.\n- **Pec pod Sněžkou:** výchozí místo na Sněžku a do\
      \ východních Krkonoš.\n- **Janské Lázně a Černá hora:** Stezka korunami stromů, kabinková lanovka\
      \ a Černohorské rašeliniště.\n- **Vrchlabí:** praktická základna s muzeem KRNAP a dobrým programem\
      \ do deště.\n\n## Nejlepší výlety v Krkonoších s dětmi\n\n### 1. Mumlavský vodopád\n\nZ Harrachova\
      \ vede k vodopádu široká cesta dlouhá přibližně dva kilometry. S terénním kočárkem ji za příznivého\
      \ počasí zvládnete, v zimě a po dešti ale může klouzat. U vodopádu dávejte pozor na mokré kameny\
      \ a děti nepouštějte k proudu bez dozoru. Výlet lze prodloužit směrem k Rýžovišti nebo zakončit\
      \ v centru Harrachova.\n\n### 2. Stezka korunami stromů Krkonoše\n\nStezka v Janských Lázních je\
      \ vhodná i pro menší děti a kočárky. Trasa vede od kořenů lesa až do korun stromů a součástí jsou\
      \ naučná zastavení i výhled z věže. Otevírací doba se mění podle sezony a některé doplňkové atrakce\
      \ mohou mít vlastní pravidla. Před cestou ověřte provoz na oficiálním webu stezky.\n\n### 3. Černá\
      \ hora a Černohorské rašeliniště\n\nKabinková lanovka z Janských Lázní ušetří dětem velkou část\
      \ stoupání. Od horní stanice můžete zvolit kratší procházku nebo delší trasu k Černohorskému rašeliništi.\
      \ Dřevěné chodníky bývají úzké a mokré, proto je pro malé děti praktičtější nosítko. Zpáteční provoz\
      \ lanovky zkontrolujte ještě před odchodem.\n\n### 4. Sněžka s dětmi\n\nNejvyšší česká hora není\
      \ automaticky vhodná pro každé dítě. Kabinková lanovka z Pece pod Sněžkou může kvůli silnému větru\
      \ jezdit jen v dolním úseku nebo stát úplně. Na vrcholu bývá výrazně chladněji než v údolí a terén\
      \ je kamenitý. Se školáky je rozumné vyjet část trasy lanovkou a pěší variantu přizpůsobit počasí.\
      \ Aktuální provoz sledujte na webu lanovky na Sněžku.\n\n### 5. Labský důl\n\nTrasa ze Špindlerova\
      \ Mlýna vede údolím podél Labe a umožňuje otočit se kdykoliv podle kondice dětí. Spodní část je\
      \ příjemná i pro rodiny, které nechtějí zdolávat hřebeny. K Labské boudě už cesta výrazně stoupá\
      \ a patří spíš zdatnějším školákům. Po silném větru vždy ověřte stav lesa a případné uzavírky.\n\
      \n### 6. Herní krajina Pecka\n\nDřevěné herní prvky na Portášových Boudách vycházejí z krkonošských\
      \ zvířat a legend. Nahoru se dá dostat lanovkou z Velké Úpy, takže jde o dobrý program i pro děti,\
      \ které nezvládnou dlouhé stoupání. Areál je venkovní a na horském svahu, proto vezměte pevné boty\
      \ a teplejší vrstvu.\n\n### 7. Muzeum Krkonoš ve Vrchlabí\n\nModerní expozice návštěvnického centra\
