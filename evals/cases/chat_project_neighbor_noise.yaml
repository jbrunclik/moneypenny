id: chat_project_neighbor_noise
description: Long project chat - reuse earlier noise numbers for the neighbour's question
history_from: project_research
user: "Soused se ptal, jestli ho to nebude v noci budit. Je od te jednotky asi 9 metru. Co mu mam rict?"
expect:
  rubric: >
    Czech answer the user can pass on to the neighbour: at ~9 m the unit is
    very quiet and well under the 40 dB night limit at the neighbour's,
    reassuring, ideally with one practical point (night/quiet mode or
    placement). Any figures must agree with the chat's (Aerona T9, ~48 dB(A)
    in the catalogue, ~28 dB at 4 m); explaining sound power or the ~6 dB per
    doubling is welcome but not required - the neighbour asked whether it
    will wake him, not for the physics.
  max_tool_rounds: 2
