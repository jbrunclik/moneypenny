id: documents_open_for_exit
smoke: true
description: >
  A saved equity waterfall whose use_for matches the question: the agent opens
  the document and answers from its table, not from the summary
documents:
  - title: Equity waterfall (Nov 2026)
    summary: My stock options' value at different company exit valuations, vested and unvested
    use_for: Exit scenarios, liquidity and financial planning
    file: fixtures/equity_waterfall.pdf
user: "If the company sells for 200 million euros, roughly what would my options be worth?"
expect:
  rubric: >
    Answers from the waterfall: about 270,000 EUR for the vested options and
    about 405,000 EUR including the unvested ones (which accelerate on a
    change of control), before tax. Numbers that are not in the document, or
    an answer that does not use the saved waterfall, fail.
  required_tools: [open_document]
  max_tool_rounds: 2
