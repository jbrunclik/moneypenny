id: condensed_memory_detail
smoke: true
description: A detail only in a condensed memory's full text is looked up by id, not guessed
memories:
  - content: "Bike: Canyon Endurace CF 7 (2023), SRAM Rival AXS 2x12, tubeless 32 mm Continental GP5000 S TR. Last service at Kolo Praha on 2026-09-14: chain replaced, rear derailleur hanger straightened, brake pads front only. Next service due at 8000 km; the shop asked to bring the spare hanger (part 00.7918.087.000) next time."
    summary: "Canyon Endurace CF 7, SRAM Rival AXS, tubeless 32 mm; serviced at Kolo Praha 2026-09-14; next at 8000 km."
    category: fact
user: "Which part number did the bike shop ask me to bring to the next service?"
expect:
  rubric: >
    Gives the part number 00.7918.087.000 (the spare derailleur hanger). It is
    only in the memory's full text, not its summary, so the reply must come from
    looking the memory up. Must not invent a different part number or say it
    does not know.
  required_tools: [search_memory]
  forbidden_tools: [web_search, research]
  max_tool_rounds: 2
