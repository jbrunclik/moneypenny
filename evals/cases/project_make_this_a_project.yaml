id: project_make_this_a_project
description: >
  "Make this a project" creates the project, files the chat under it, and
  starts the project's memory with the facts the chat settled
history:
  - role: user
    content: "Plánuju zateplení domu - fasáda 120 m2, polystyren nebo minerální vata?"
  - role: assistant
    content: "Na 120 m2 fasády bych zvážil minerální vatu kvůli paropropustnosti a požární odolnosti..."
  - role: user
    content: "Dobře, bereme minerální vatu 16 cm, dům je z roku 1978 a fasáda je na jih."
  - role: assistant
    content: "Rozumím: minerální vata 16 cm na 120 m2 jižní fasády domu z roku 1978."
user: "Udělej z tohohle projekt Zateplení, ať k tomu máme všechno pohromadě."
expect:
  rubric: >
    Confirms in Czech that the project Zateplení was created and this chat is
    in it, with the settled facts (mineral wool 16 cm, 120 m2 facade, house
    from 1978, south-facing) kept in the project. Must not claim it cannot
    create projects.
  required_tools: [manage_project]
  required_arg_patterns:
    manage_project.operations: ["create", "Zateplen", "facts['\"]?:\\s*\\[['\"]"]
  max_tool_rounds: 2
