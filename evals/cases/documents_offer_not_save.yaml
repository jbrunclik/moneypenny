id: documents_offer_not_save
description: >
  A document shared with a question but no request to keep it: answered from
  the file, never saved silently (an offer to save is fine)
files: [fixtures/lease_fixed_term.pdf]
user: "How much notice do I have to give if we want to move out early?"
expect:
  rubric: >
    Answers from the lease: three months' written notice. Offering to keep
    the lease in saved documents is fine; claiming it was saved fails.
  forbidden_tools: [manage_documents]
  max_tool_rounds: 1
