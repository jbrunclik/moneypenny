      ✅ **Comfortable and portable**


      I love the design of the Bose Ultras. They're very light, you can wear them for long periods without
      any fatigue, and they fold down small for travel.


      ✅ **Fun and energetic sound**


      These give you really punchy and dynamic audio, with big (but not overly heavy) bass, zinging treble,
      and great clarity through the mid-range. I've loved the sound since their launch.


      ❌ **Battery life isn't great**


      The 24-hour battery life is below average by modern standards. If you want 30 hours or more, the
      Sony WH-1000XM6 or Bose QuietComfort Ultra 2nd Gen will give this to you with the same level of
      noise cancellation.


      ❌ **You want a more refined sound**


