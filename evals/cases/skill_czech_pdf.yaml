id: skill_czech_pdf
description: A PDF with Czech text loads the pdf-documents skill (DejaVu fonts)
user: >
  Vytvoř mi PDF s krátkou pozvánkou na narozeninovou oslavu v sobotu v 15:00
  a podtitulem "Příliš žluťoučký kůň úpěl ďábelské ódy".
requires: [code_sandbox]
expect:
  rubric: >
    A PDF is produced via execute_code with the Czech text and diacritics
    intact (a Unicode font such as DejaVu is used), and the reply confirms it
    in Czech.
  required_tools: [load_skill]
  required_skill: pdf-documents
