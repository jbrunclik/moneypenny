      "Published: 2026-10-05\n\n„Kolik stojí kilowatthodina\
      \ elektřiny?“ zní jako jednoduchá otázka. Na faktuře ale najdete tři různé odpovědi: cenu silové\
      \ elektřiny od dodavatele, celkovou cenu za další spotřebovanou kWh a efektivní cenu za kWh po rozpočítání\
      \ měsíčních plateb.\n\nNa běžném odběru D02d v distribučním území ČEZ vychází podle ceníků E.ON\
      \ a PRE v roce 2026 další spotřebovaná kWh zhruba na 5,93-6,72 Kč s DPH. Když do stejného modelu\
      \ přidám měsíční platby a spotřebu 2,5 MWh za rok, dostanu 8,13-9,03 Kč/kWh s DPH. To už je číslo\
      \ blíž vaší peněžence.\n\nDodavatel přitom neovlivňuje celý účet. Silová elektřina je obchodní složka,\
      \ tedy to, co vám prodává dodavatel. Regulované platby stanovuje ERÚ a mění se podle distribučního\
      \ území, sazby a jističe. V roce 2026 do nich výrazně promluvilo POZE, protože od 1. 1. 2026 ho\
      \ domácnosti neplatí.\n\nDetail regulované složky a poplatku POZE patří do rozboru regulované složky\
      \ elektřiny. Tady držím jednu otázku: kolik stojí 1 kWh a jak si ji přepočítat z faktury.\n\n##\
      \ Kolik stojí 1 kWh elektřiny v roce 2026\n\nU běžné domácnosti v sazbě D02d nedává smysl říct jedno\
      \ číslo bez podmínek. U ceníků pro distribuční území ČEZ vidím zhruba 5,93-6,72 Kč/kWh s DPH za\
      \ spotřební část ceny, tedy bez rozpočítání všech měsíčních plateb.\n\n| Dodavatel a produkt | Platnost\
      \ ceníku | Sazba a území | Obchodní cena VT s DPH | Spotřební cena celkem s DPH | Měsíční platby\
      \ použité ve výpočtu | \n|---|---|---|---|---|---|\n| E.ON Online elektřina na 2 roky 4/26 | od\
      \ 1. 4. 2026 | D02d, ČEZ Distribuce | 3 185,93 Kč/MWh | 5 933,98 Kč/MWh | 457,22 Kč/měsíc | \n|\
      \ PRE PROUD EKO 08/2026 | od 1. 8. 2026 | D02d, ČEZ Distribuce | 3 847,80 Kč/MWh | 6 716,86 Kč/MWh\
      \ | 481,42 Kč/měsíc | \n| ČEZ Elektřina na neurčito | veřejná nabídka | D02d | 3 860 Kč/MWh | nelze\
      \ férově dopočítat bez stálého platu z kompletního ceníku | ČEZ je nezveřejňuje | \n\nPřepočet je\
      \ prostý: 1 MWh je 1 000 kWh. Ceníková cena 5 933,98 Kč/MWh tedy znamená zhruba 5,93 Kč/kWh. Pokud\
      \ se vám jednotky pletou, pomůže samostatný převodník MWh na kWh.\n\nU ČEZ uvádím jen to, co jde\
      \ veřejně ověřit z nabídky. Pro D02d je na stránce „Přejděte k nám“ uvedeno 3 860 Kč/MWh s DPH u\
      \ produktu Elektřina na neurčito a fixace „ne“. Do ročního modelu ho proto nedávám jako plně dopočítaný\
      \ ceník, chyběl by mi obchodní stálý plat. Tenhle řádek v cenících nepřeskakuju. Stovka nebo dvě\
      \ měsíčně vyjde na 1 200 až 2 400 Kč za rok.\n\n## Z čeho se skládá cena elektřiny\n\nCena elektřiny\
      \ má obchodní část dodavatele, regulovanou část podle ERÚ, daň z elektřiny a DPH 21 %. Na vyúčtování\
      \ to není jedna cena, i když zálohy ji často schovají do jedné měsíční částky.\n\nObchodní část\
      \ tvoří silová elektřina a obchodní stálý plat. Tady soutěží dodavatelé. V cenících mám například\
      \ 3 185,93 Kč/MWh s DPH u E.ON Online elektřina na 2 roky 4/26 a 3 847,80 Kč/MWh s DPH u PRE PROUD\
      \ EKO 08/2026 v sazbě D02d na území ČEZ Distribuce.\n\nRegulovaná část zahrnuje hlavně distribuci,\
      \ platbu za jistič, systémové služby a provoz nesíťové infrastruktury. V ceníku E.ON pro D02d na\
      \ území ČEZ Distribuce stojí distribuce ve vysokém tarifu 2 515,08 Kč/MWh s DPH, cena za systémové\
      \ služby 198,73 Kč/MWh s DPH, daň z elektřiny 34,24 Kč/MWh s DPH a platba za provoz nesíťové infrastruktury\
      \ 15,57 Kč za odběrné místo měsíčně.\n\nProto mi vadí věta „dodavatel mi zdražil elektřinu na 6\
      \ Kč“. Dodavatel obvykle zdražil nebo zlevnil jen obchodní složku. Zbytek se řídí pravidly ERÚ,\
      \ distribučním územím a vaší sazbou.\n\n## Co se v roce 2026 změnilo v regulovaných platbách\n\n\
      Od 1. 1. 2026 domácnosti neplatí v regulované složce příspěvek na POZE. ERÚ uvádí, že dříve šlo\
