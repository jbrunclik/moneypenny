      "# Distribuční sazba D02d\n\n**D02d je nejrozšířenější\
      \ distribuční sazba v Česku** — jednotarifní, bez\n        jakékoli technické podmínky a se stejnou\
      \ cenou po celý den. Distribuce u ní od\n        1. 1. 2026 stojí 2 078,58 Kč/MWh\n        v distribučním\
      \ území ČEZ Distribuce. Je určená domácnosti, která netopí elektřinou ani\n        jí neohřívá vodu.\n\
      \n## D02d v číslech\n\nRegulované ceny platné od 1. 1. 2026, uvedené bez DPH.\n\n- Typ sazby\n-\
      \ Jednotarifní\n- Nízký tarif\n- Není — jedna cena po celý den\n- Lze dnes nově sjednat\n- Ano\n\
      - Cena distribuce ve vysokém tarifu\n- 1 516,53–2 295,34 Kč/MWh\n- Měsíční platba za jistič 3× 25\
      \ A\n- 217,00–256,00 Kč\n\nRozsah ceny odpovídá třem distribučním územím. Jaká cena platí pro vás,\
      \ určuje výhradně adresa odběrného místa — distributora si nevybíráte a změnou dodavatele ho neovlivníte.\n\
      \n## Pro koho je sazba D02d\n\nBěžné byty a domy, které netopí elektřinou ani nemají elektrický\
      \ bojler — tedy vytápění plynem, teplárnou, dřevem nebo kotlem na pelety. Elektřina v takové domácnosti\
      \ pokrývá svícení, spotřebiče, elektroniku a případně klimatizaci — tedy spotřebu, kterou nelze\
      \ soustředit do několika hodin denně, a dvojtarifní sazba by proto nepřinesla nic.\n\nD02d je také\
      \ **výchozí sazbou při novém připojení** odběrného místa a sazbou,\n                na kterou se\
      \ domácnost vrací, když přestane splňovat podmínky dvojtarifní sazby — například\n             \
      \   po odstranění elektrického bojleru nebo přímotopů.\n\n### Podmínky přiznání\n\n- žádná technická\
      \ podmínka — sazbu dostane každá domácnost.\n\n### Kdy D02d naopak nechcete\n\nJestliže elektřinou\
      \ topíte, ohříváte vodu bojlerem nebo doma nabíjíte elektromobil, je D02d nejdražší možná volba.\
      \ U elektrického vytápění je cena distribuce v sazbě D57d 754,77 Kč/MWh, tedy o 1 323,81 Kč/MWh\
      \ méně než u D02d — a v nízkém tarifu dokonce jen 116,50 Kč/MWh.\n\n## Kolik stojí distribuce v\
      \ sazbě D02d\n\nCena distribuce se mezi třemi distribučními územími liší výrazně — mezi PREdistribucí\
      \ a EG.D je u D02d rozdíl 778,81 Kč/MWh. Území si nevybíráte, určuje ho adresa odběrného místa.\n\
      \n| Regulovaná cena distribuce u sazby D02d podle distribučního území,             v Kč bez DPH.\
      \ Zdroj: Cenový výměr ERÚ č. 14/2025 ze dne 27. 11. 2025, platnost od             1. 1. 2026. |\
      \  |  | \n|---|---|---|\n| Distribuční území | Distribuce VT Kč/MWh | Jistič 3× 25 A Kč/měsíc |\
      \ \n|---|---|---|\n| ČEZ Distribuce většina Česka mimo jižní Moravu, jižní Čechy a Prahu | 2 078,58\
