    https://www.innogy.cz/radce/blog/cena-elektriny-2026/:
      "# Za kolik si rozsvítíte v roce 2026? Průvodce
      cenami elektřiny


      Rok 2026 přináší pro domácnosti v Česku určitou úlevu v cenách elektřiny. Ale zjistit, jakou částku
      uvidíte ve svém vyúčtování, je často složitější, než se může na první pohled zdát.


      Největší změnou je zrušení poplatku na podporované zdroje energie (POZE) - nyní jej hradí stát.
      Tento krok výrazně snižuje konečné účty. Ceny elektřiny však stále ovlivňuje řada proměnných – zejména
      vývoj na energetických trzích nebo např. regulované položky (složky) ceny.


      ## Ceny elektřiny v roce 2026: Co se skutečně změnilo


      ### 1. Regulované ceny se mírně snížily


      Regulovaná složka ceny byla původně plánována s mírným růstem, ale po rozhodnutí vlády o převzetí
      financování POZE mohlo dojít k jejímu snížení. Od 1. 1. 2026 totiž domácnosti a podnikatelé odebírající
      elektřinu na nízkém napětí neplatí poplatek na podporu obnovitelných zdrojů energie (599 Kč/MWh
      vč. DPH). Jestli se regulované platby sníží i vám, závisí na konkrétních parametrech (jako např.
      spotřeba, distribuční sazba nebo velikost jističe).


      ### 2. Velkoobchodní ceny: stabilita, ale nejistá


      Po extrémních výkyvech v letech 2022–2023 se ceny elektřiny na burzách snížily a mírně stabilizovaly,
      jsou ale stále velmi citlivé.


      **Stabilita ale neznamená jistotu.**


      Přehledný graf ukazuje přibližný **vývoj celkové ceny elektřiny za 1 MWh** pro běžné domácnosti
      v ČR (v sazbě D02d, včetně DPH, distribuce a všech poplatků) od roku 2021 až do současnosti (2026).


      Uvedené hodnoty vycházejí z průměrných tržních dat ČSÚ, ERÚ a ceníků dominantních dodavatelů.


      **Poznámka k datům v grafu:** Uvedené ceny jsou orientační a slouží k ilustraci trendu. Hodnoty
      představují průměrnou celkovou cenu za 1 MWh včetně DPH, regulovaných plateb (distribuce, systémové
      služby apod.), stálých měsíčních platů a daně z elektřiny pro modelový příklad běžné domácnosti
      s roční spotřebou 2,5 MWh v nejrozšířenější distribuční sazbě D02d (jednotarif). Skutečná cena se
      může lišit v závislosti na konkrétním distribučním území (ČEZ, EG.D, PRE), zvoleném produktu dodavatele
      a velikosti hlavního jističe.


      #### Klíčové momenty tohoto vývoje:


      - **2021**: Období stability - celková cena pro konečného spotřebitele se držela okolo 6 Kč za kWh
      (tedy přibližně 6 000 Kč/MWh)

      - **2022**: Energetická krize vyvolaná geopolitickou situací a krachem některých dodavatelů vyhnala
      ceny na burzách do extrémů. Na domácnosti to dopadlo plnou silou

      - **2023**: Stát zavedl cenové stropy (silová elektřina na 5 000 Kč/MWh bez DPH) a odpustil poplatky
      za podporované zdroje energie (POZE). Bez stropu by ceny byly ještě výrazně vyšší

      - **2024–2025**: Postupné uklidňování trhu a pokles velkoobchodních cen na burze, což se s drobným
      zpožděním promítlo i do ceníků pro domácnosti. Naopak vzrostla cena distribuce a byl znovuzaveden
      poplatek za POZE

      - **2026** (Současnost): Další mírný pokles velkoobchodních cen elektřiny a opětovné odpuštění poplatku
      za podporované zdroje energie (POZE) pro domácnosti, díky čemuž se u nových fixací nebo běžných
      produktů pohybujeme okolo 8 Kč za kWh (8 000 Kč/MWh) celkově


      ## Kolik domácnosti skutečně ušetří


      ### Úspora není pro všechny stejná


      - Některé domácnosti zaznamenají pokles nákladů

      - Jinde může být efekt minimální nebo dokonce opačný

      - Záleží na konkrétní smlouvě, spotřebě i parametrech a umístění odběrného místa.


      Realisticky lze očekávat: **Mírné snížení nebo stagnaci nákladů,

      nikoli plošný pokles o desítky procent**


      ## Kolik stojí elektřina v roce 2026


      Cena elektřiny se skládá z více složek a nelze ji vyjádřit jedním univerzálním číslem za kWh. Zatímco
      silová elektřina se v roce 2026 pohybuje přibližně v jednotkách korun za kWh, výsledná cena ve faktuře
      závisí na distribuční oblasti, distribuční sazbě, velikosti jističe i konkrétní smlouvě.


      ## Distribuční sazby a jejich význam


      Správně zvolená distribuční sazba má větší vliv než drobné cenové rozdíly mezi dodavateli.


      - **D02d** – standardní domácnosti

      - **D56d / D57d** – vytápění elektřinou

