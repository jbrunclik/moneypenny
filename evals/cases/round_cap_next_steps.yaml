      ### Informace pro zákazníky innogy se smlouvou o sdružených službách dodávky elektřiny


      S účinností **od 1. 1. 2026** dochází na základě cenových výměrů ERÚ č. 13/2025 a č. 14/2025 ze dne 28. 11.
      2025 a č. 15/2025 ze dne 29. 12. 2025 **ke změně regulovaných cen souvisejících s dodávkou elektřiny.**


      Bližší informace o předpokládaném dopadu do celkových cen za dodávku elektřiny lze získat z tiskové
      zprávy Energetického regulačního úřadu.

      Změny regulovaných složek ceny nejsou v dispozici obchodníků s energiemi, tudíž samy o sobě nezakládají
      právo zákazníků na výpověď nebo odstoupení od smluv podle energetického zákona.


      **Cenový výměr ERÚ č. 15/2025 stanovuje Cenu ,,A" pro podporu výkupu z OZE na 0 Kč za měsíc.**



      S platností **od 1. 1. 2027** mění společnost innogy ceny produktu elektřina Standard a produktů
      s ceníkem elektřina Standard a produktu elektřina Energo Standard. Pro informaci uvádíme porovnání
      stávajících a jednotkových cen produktů elektřina Standard a elektřina Energo Standard. Pro zobrazení
      konkrétního ceníku dle vašeho místa odběru pro produkt elektřina Standard či elektřina Energo Standard
      platného od 1. 1. 2027 použijte vyhledávací lištu výše.


