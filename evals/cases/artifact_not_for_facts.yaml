    https://csu.gov.cz/pha/nejnovejsi-statisticke-udaje-hl-m-praha:
      "# Nejnovější statistické údaje –
      Hl. m. Praha


      - Počet obyvatel zahrnuje občany ČR a cizince, kteří mají v České republice trvalé bydliště, cizince
      z třetích zemí s vízy k pobytu nad 90 dnů nebo s povolením k dlouhodobému pobytu, občany zemí EU,
      Norska, Švýcarska, Islandu, Lichtenštejnska a jejich rodinné příslušníky s hlášeným přechodným pobytem
      a cizince s přiznaným azylem. Od roku 2022 jsou do obyvatelstva zahrnovány osoby s udělenou dočasnou
      ochranou v České republice s obvyklým pobytem v ČR. Údaje o počtu obyvatel jednotlivých územních
      celků vycházejí ze sčítání lidu, domů a bytů (poslední sčítání k 26. 3. 2021), na které pak průběžně
      navazují každoroční bilance narozených, zemřelých, přistěhovalých a vystěhovalých.

      - Průměrná měsíční nominální mzda jednoho zaměstnance zahrnuje všechny pracovní příjmy (základní
      mzdy, osobní příplatky a ohodnocení, prémie a odměny, podíly na hospodářských výsledcích a náhrady
      mzdy), které byly zúčtovány zaměstnancům evidenčního počtu podle příslušných platových a mzdových
      předpisů. Mzda je počítána za celé národní hospodářství, zahrnuje tedy údaje za všechny zaměstnance,
      kteří pracují v kraji. Je uvedena na přepočtené počty zaměstnanců, zohledňuje tak délku pracovních
      úvazků zaměstnanců.

      - Registrované subjekty jsou subjekty vedené v Registru ekonomických subjektů, který vytváří a spravuje
      ČSÚ. Jsou v něm evidovány právnické osoby včetně organizačních složek státu a fyzické osoby, které
      mají postavení podnikatele. Do území jsou subjekty členěny podle adresy svého sídla.

      - Obecná míra nezaměstnanosti vyjadřuje podíl počtu nezaměstnaných na celkové pracovní síle (v procentech),
      kde čitatel i jmenovatel jsou ukazatele konstruované podle metodiky Eurostatu vypracované na základě
      definic a doporučení Mezinárodní organizace práce (International Labour Organization, zkratka ILO).
      Ukazatel je získaný z výsledků výběrového šetření pracovních sil (VŠPS). Šetření podléhají všechny
      osoby obvykle bydlící ve vybraném bytě bez ohledu na druh jejich pobytu. Čtvrtletní výběrový soubor
      (asi 0,6 % všech trvale obydlených bytů) zahrnuje přibližně 25 tis. náhodně vybraných a vyšetřených
      bytů na území celé České republiky.

      - Hrubý domácí produkt představuje souhrn přidaných hodnot jednotlivých institucionálních sektorů
      nebo jednotlivých odvětví v činnostech považovaných dle ESA za produktivní (tj. včetně služeb tržní
      i netržní povahy) a čistých daní na produkty (je tedy vyjádřen v kupních cenách). Z hlediska užití
      je HDP roven souhrnu konečné spotřeby (domácností, vlády a neziskových organizací sloužících domácnostem),
      tvorby hrubého kapitálu (fixního kapitálu a salda zásob a čistého pořízení cenností) a salda zahraničního
      obchodu. Je uváděn v běžných cenách v přepočtu na 1 obyvatele středního stavu.

      - Růst (pokles) HDP charakterizuje o kolik % reálně vzrostl (klesl) hrubý domácí produkt ve sledovaném
      roce proti roku předchozímu. Pro vyloučení vlivu změn cen je HDP přepočten na srovnatelnou cenovou
      úroveň (na ceny předchozího roku).

      - **Tvorba hrubého fixního kapitálu na 1 obyvatele (Česko = 100 %)** 2024 **239,1 %** Datum zveřejnění:
      14. 01. 2026 Tvorba hrubého fixního kapitálu obsahuje hodnotu pořízení hmotného i nehmotného investičního
      majetku (koupeného, bezúplatně převzatého nebo vyrobeného ve vlastní režii), sníženou o hodnotu
      jeho prodeje a hodnotu majetku předaného bezúplatně. Patří sem i pořízení formou finančního leasingu.
      Cílem pořízení je vždy využívat tento investiční majetek při produktivní činnosti, včetně bydlení
      v obydlí jeho vlastníka. Fixním kapitálem jsou pouze aktiva používaná ve výrobě po dobu delší než
      jeden rok. Patří sem rovněž např. předměty pro vojenské účely, výdaje na výzkum a vývoj apod.

      - **Čistý disponibilní důchod domácností na 1 obyvatele (Česko = 100 %)** 2024 **132,2 %** Datum
      zveřejnění: 09. 01. 2026 Čistý disponibilní důchod domácností představuje částku, kterou mohou domácnosti
      věnovat na konečnou spotřebu, na úspory ve formě finančních aktiv a na akumulaci hmotných a nehm"
