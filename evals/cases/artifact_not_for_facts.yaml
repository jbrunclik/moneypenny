    https://zpravymestaprahy.cz/pocet-obyvatel-prahy-se-v-1-pololeti-roku-2026-zvysil/:
      "Published: 2026-09-11


      ##### V 1. pololetí roku 2026 se počet obyvatel v Praze oproti konci roku 2025 podle předběžných
      výsledků zvýšil o 2 444 osob na celkových 1 409 528 obyvatel. Za přírůstkem počtu obyvatel stál
      výhradně přírůstek stěhováním (+3 516 osob), naopak přirozenou měnou ubylo 1 072 osob. V porovnání
      s definitivními údaji z 1. pololetí roku 2025 došlo k meziročnímu prohloubení přirozeného úbytku
      i navýšení přírůstku stěhováním. Meziročně poklesl počet živě narozených (-6,2 %), a vystěhovalých
      (-5,4 %), a zvýšil se počet zemřelých (+0,1 %) a přistěhovalých (+2,1 %).


      K 30. červnu 2026 bylo v Praze evidováno podle předběžné statistické bilance **1 409 528 obyvatel,** z toho **689
      182 mužů a 720 346 žen**. Ženy tak tvořily 51,1 % celkového počtu obyvatel. V absolutních číslech
      zaznamenala hl. m. Praha v 1. pololetí 2026 přírůstek 2 444 osob, a byla společně se Středočeským
      krajem **jedinými dvěma kraji, kde k přírůstku obyvatel došlo**. Nejvyšší úbytek v absolutních číslech
      byl zaznamenán v Moravskoslezském (- 2 995 osob) a Ústeckém (- 1 960 osob) kraji. Celkově se během
      prvního pololetí letošního roku počet obyvatel Česka snížil o 12,2 tisíce na necelých 10,904 milionu,
      kdy kladné saldo zahraničního stěhování (8,9 tisíce) nedokázalo vykompenzovat výrazný úbytek obyvatel
      přirozenou měnou (−21,1 tisíce).


      Během 1. pololetí 2026 **zemřelo 6 202 osob a na svět přišlo 5 130 dětí.** Počet zemřelých se meziročně
      zvýšil o 9 osob (+0,1 %), počet živě narozených poklesl o 6,2 %. V 1. pololetí 2026 tak pokračuje **trend
      klesající porodnosti,** který započal v prvním pololetí roku 2022. V první polovině roku 2021 se
      v Praze narodilo 7 515 dětí a od té doby tento údaj za první pololetí daného roku postupně klesá,
      až na letošních 5 130 dětí. Mezi pololetím roku 2021 a pololetím letošního roku tak došlo k poklesu
      o 31,7 %. Přirozenou měnou v 1. pololetí 2026 klesl počet obyvatel Prahy o 1 072 osob. Oproti loňskému
      roku se přirozený úbytek ještě prohloubil (o 48,3 %).


      Úbytek obyvatel přirozenou měnou postihl všechny kraje. Nejvyšší byl – v přepočtu na 1000 obyvatel
      – v Karlovarském (6,7 ‰), Moravskoslezském (-5,5 ‰) a Ústeckém kraji (-5,0 ‰). Nejmenší byl právě
      v Praze (-1,5 na 1 000 obyvatel) a ve Středočeském (-3,2 ‰) a Jihomoravském kraji (-3,3 ‰).


      Na populační přírůstek Prahy tak měla v 1. pololetí 2026 výhradní vliv migrace. Stěhováním přibylo
      v Praze 3 516 obyvatel. Stěhováním s ostatními regiony Česka sice Praha 861 osob ztratila, ovšem
      migrací se zahraničím naopak 4 377 osob přibylo. V 1. pololetí 2026 se do Prahy **přistěhovalo celkem
      28 534 osob**, což bylo o 2,1 % více než ve stejném období loňského roku. **Vystěhovalých osob** z Prahy **bylo
      25 018**, což představovalo meziroční pokles o 5,4 %.


      Devět krajů Česka mělo v 1. pololetí 2026 kladné migrační saldo. V přepočtu na 1 000 obyvatel byl
      nejvyšší přírůstek migrací ve Středočeském kraji (5,4 ‰) a v Praze (5,0 ‰). Třetí Jihočeský kraj
      dosáhl na migrační přírůstek ve výši 2,2 ‰. Na opačném konci spektra byl Liberecký kraj s migračním
      úbytkem -1,7 ‰.


      V Praze bylo v 1. pololetí 2026 uzavřeno 2 563 sňatků, oproti stejnému období předchozího roku se
      jednalo o pokles o 2,6 %. Počet uzavřených manželství v přepočtu na tisíc obyvatel dosáhl hodnoty
      3,7 a byl nejvyšší mezi kraji ČR. V Praze tak proběhlo nejvíce sňatků ze všech krajů v ČR a to jak
      v absolutních, tak v relativních hodnotách.


      **Podíl dětí narozených mimo manželství** se v Praze meziročně snížil na 36 % (za 1. pololetí roku
      2025 to bylo 37,8 %) a stále zůstal výrazně pod průměrem Česka (46,9 %). Také v porovnání s ostatními
      kraji se jednalo o nejnižší hodnotu. Druhý nejmenší podíl mimomanželských dětí byl v Jihomoravském
      kraji (41,26 %), největší pak v Ústeckém kraji (646 %) a Karlovarském kraji (61,86 %). Z celkového
      počtu 5 130 živě narozených dětí tvořily prvorozené děti 54,26 %, druhorozených bylo 36,36 % a děti
      třetího a vyššího pořadí se na počtu všech živě narozených dětí podílely z 9,5 %.


      **Nejlidnatě"
